<!-- Demo page: the narrated demo video and a way into the app. Plain on purpose:
     no web fonts or scripts from other sites. The video is made by recording the
     real app (see CLAUDE.md, "Demo video"). -->
<style>
  :root{ --navy:#1D3557; --cream:#FFF7E9; --mint:#5FC28E; --muted:#5b6b80; }
  *{ box-sizing:border-box; }
  html, body{ margin:0; background:var(--cream); color:var(--navy); }
  body{ font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5; padding:24px 16px 40px; }
  main{ max-width:960px; margin:0 auto; text-align:center; }
  h1{ font-size:32px; margin:0 0 6px; }
  .lead{ font-size:18px; color:var(--muted); margin:0 0 20px; }
  video{ width:100%; height:auto; display:block; border-radius:18px; background:#000; box-shadow:0 8px 0 rgba(29,53,87,0.1); }
  .cta{ display:inline-block; margin:24px 0 10px; background:var(--mint); color:#fff; font-weight:800; font-size:22px; text-decoration:none; padding:14px 34px; border-radius:999px; box-shadow:0 6px 0 rgba(29,53,87,0.15); }
  .cta:focus{ outline:4px solid #FFC145; outline-offset:3px; }
  .small{ font-size:15px; color:var(--muted); margin:6px 0; }
  .small a{ color:#1f6fb2; }
  @media (max-width:520px){ h1{ font-size:26px; } .lead{ font-size:16px; } .cta{ font-size:19px; padding:12px 26px; } }
</style>
</head>

<main>
  <h1>📺 Routikids</h1>

  <p class="small">Free · no account · English, Português, Deutsch</p>
  <p class="small">Questions or ideas: <a href="mailto:routikids.app@gmail.com">routikids.app@gmail.com</a> · <a href="../privacy.html">Privacy</a></p>
</main>
