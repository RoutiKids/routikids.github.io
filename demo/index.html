<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<meta name="color-scheme" content="light dark">
<title>Routikids · 1 minute demo</title>
<meta name="description" content="Your TV as a picture routine chart for kids. Set it up on your phone, the TV shows one task at a time. Free, no account.">
<!-- Link preview (WhatsApp, social networks). Absolute URLs on purpose. -->
<meta property="og:type" content="video.other">
<meta property="og:site_name" content="Routikids">
<meta property="og:title" content="Routikids · 1 minute demo">
<meta property="og:description" content="Your TV as a picture routine chart for kids. Free, no account.">
<meta property="og:url" content="https://routikids.github.io/demo/">
<meta property="og:image" content="https://routikids.github.io/demo/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:video" content="https://routikids.github.io/demo/routikids-demo-en.mp4">
<meta property="og:video:type" content="video/mp4">
<meta property="og:video:width" content="1280">
<meta property="og:video:height" content="720">
<meta name="twitter:card" content="summary_large_image">
<!-- Demo page: the narrated demo video (English or Portuguese: ?lang=, else the
     browser's language) and a way into the app. Plain on purpose:
     no web fonts or scripts from other sites. The video is made by recording the
     real app (see CLAUDE.md, "Demo video"). Visits and how much of the video is
     watched are counted anonymously (stats/demo, see the privacy page). -->
<style>
  :root{ --navy:#1D3557; --cream:#FFF7E9; --mint:#5FC28E; --muted:#5b6b80; }
  *{ box-sizing:border-box; }
  html, body{ margin:0; background:var(--cream); color:var(--navy); }
  body{ font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5; padding:24px 16px 40px; }
  main{ max-width:960px; margin:0 auto; text-align:center; }
  h1{ font-size:32px; margin:0 0 6px; }
  .lead{ font-size:18px; color:var(--muted); margin:0 0 20px; }
  video{ width:100%; height:auto; display:block; border-radius:18px; background:#000; box-shadow:0 8px 0 rgba(29,53,87,0.1); }
  .cta{ display:inline-block; margin:24px 0 10px; background:var(--mint); color:#fff; font-weight:800; font-size:22px; text-decoration:none; padding:14px 34px; border-radius:999px; box-shadow:0 6px 0 rgba(29,53,87,0.15); }
  .cta:focus{ outline:4px solid #FFC145; outline-offset:3px; }
  .small{ font-size:15px; color:var(--muted); margin:6px 0; }
  .small a{ color:#1f6fb2; }
  .langs{ margin:0 0 14px; font-size:15px; }
  .langs a{ color:var(--navy); margin:0 6px; }
  .langs a.on{ font-weight:800; text-decoration:none; }
  @media (max-width:520px){ h1{ font-size:26px; } .lead{ font-size:16px; } .cta{ font-size:19px; padding:12px 26px; } }
</style>
</head>
<body>
<main>
  <p class="langs"><a href="?lang=en" data-lang="en">English</a> · <a href="?lang=pt" data-lang="pt">Português</a></p>
  <h1>📺 Routikids</h1>
  <p class="lead" data-t="lead">Your TV as a picture routine chart for kids. Here is how it works, in about a minute.</p>
  <video controls playsinline preload="metadata" poster="poster.jpg" src="routikids-demo-en.mp4"></video>
  <a class="cta" href="../" data-t="cta">Try Routikids ▶</a>
  <p class="small" data-t="free">Free · no account · English, Português, Deutsch</p>
  <p class="small"><span data-t="questions">Questions or ideas:</span> <a href="mailto:routikids.app@gmail.com">routikids.app@gmail.com</a> · <a href="../privacy.html" data-t="privacy">Privacy</a></p>
</main>
<script>
  (function(){
    var T = {
      en: { lead: 'Your TV as a picture routine chart for kids. Here is how it works, in about a minute.', cta: 'Try Routikids ▶',
            free: 'Free · no account · English, Português, Deutsch', questions: 'Questions or ideas:', privacy: 'Privacy',
            video: 'routikids-demo-en.mp4', poster: 'poster.jpg', title: 'Routikids · 1 minute demo' },
      pt: { lead: 'Sua TV como um quadro de rotina com figuras para as crianças. Veja como funciona em cerca de um minuto.', cta: 'Experimentar o Routikids ▶',
            free: 'Grátis · sem cadastro · Português, English, Deutsch', questions: 'Dúvidas ou ideias:', privacy: 'Privacidade',
            video: 'routikids-demo-pt.mp4', poster: 'poster-pt.jpg', title: 'Routikids · demonstração de 1 minuto' }
    };
    var lang = new URLSearchParams(location.search).get('lang');
    if(!T[lang]){
      var prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
      lang = 'en';
      for(var i = 0; i < prefs.length; i++){ if(String(prefs[i]).slice(0, 2).toLowerCase() === 'pt'){ lang = 'pt'; break; } if(String(prefs[i]).slice(0, 2).toLowerCase() === 'en') break; }
    }
    var t = T[lang];
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
    document.title = t.title;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t[el.getAttribute('data-t')]; });
    var v = document.querySelector('video');
    if(v.getAttribute('src') !== t.video){ v.setAttribute('poster', t.poster); v.setAttribute('src', t.video); }
    document.querySelector('.langs a[data-lang="' + lang + '"]').classList.add('on');

    // Anonymous count of visits and of how much of the video is watched (see the privacy
    // page): one small record per device per day at stats/demo/<day>/<id>, with the same
    // random id the app uses on this browser, the language, the furthest second reached and
    // whether it got to the end. Off when the app's statistics option is off.
    var ls = function(k, val){ try{ if(val === undefined) return localStorage.getItem(k); localStorage.setItem(k, val); }catch(e){} return null; };
    if(ls('rotinaStatsOff_v1') === '1') return;
    var id = ls('rotinaStatsId_v1');
    if(!id){
      var abc = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', a = new Uint32Array(16);
      (window.crypto || window.msCrypto).getRandomValues(a);
      id = ''; for(var j = 0; j < 16; j++) id += abc[a[j] % abc.length];
      ls('rotinaStatsId_v1', id);
    }
    var now = new Date();
    var day = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    var seen = (ls('rotinaDemoSeen_v1') || '').split('|'); // the day's best so far on this device
    var best = seen[0] === day ? (parseFloat(seen[1]) || 0) : 0, ended = seen[0] === day && seen[2] === '1', sent = '';
    var send = function(){
      var key = Math.round(best) + '|' + ended;
      if(key === sent) return;
      sent = key;
      ls('rotinaDemoSeen_v1', day + '|' + Math.round(best) + '|' + (ended ? 1 : 0));
      fetch('https://rotina-infantil-7dc80-default-rtdb.firebaseio.com/stats/demo/' + day + '/' + id + '.json', {
        method: 'PUT', keepalive: true, cache: 'no-store',
        body: JSON.stringify({ l: lang, s: Math.min(3600, Math.round(best)), e: ended, u: Date.now() })
      }).catch(function(){});
    };
    var lastSent = 0;
    v.addEventListener('timeupdate', function(){
      if(v.currentTime > best) best = v.currentTime;
      if(v.duration && best >= v.duration * 0.95) ended = true;
      if(best - lastSent >= 10 || ended){ lastSent = best; send(); }
    });
    v.addEventListener('pause', send);
    v.addEventListener('ended', function(){ ended = true; send(); });
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') send(); });
    setTimeout(send, 3000);
  })();
</script>
</body>
</html>
