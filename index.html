// ---------- The side list shows only the routine shown on the left ----------
// It follows the hero card: the routine being browsed with the arrows (on
// any day), else the routine of the current/next task, else (day finished)
// the last routine of the day. Other days' routines are drawn as read-only
// preview rows, rebuilt only when the browsed routine changes.
let timelinePreviewKey = null;
function focusedRoutineBlock(){
  if(browseDay !== null && browseRoutineIdx !== null){
    const block = routineBlocksForDay(browseDay)[browseRoutineIdx];
    if(block) return { day: browseDay, block };
  }
  const blocks = routineBlocksForDay(0);
  if(!blocks.length) return null;
  const idx = Math.min(pointer, tasks.length - 1);
  return { day: 0, block: blocks.find(b => idx >= b.startIdx && idx <= b.endIdx) || blocks[blocks.length - 1] };
}
function clearTimelinePreview(){
  timelineEl.querySelectorAll('.step.preview').forEach(el => el.remove());
  timelinePreviewKey = null;
}
// The deadline shown follows the same routine as the card and the list: the
// running routine's (adjustable with the arrows) or, for any other routine
// (browsing, between routines, day finished), its configured deadline, read-only.
function showDeadlineFor(focus){
  let value = limitMin;
  let live = true;
  if(!focus){
    live = false;
  } else if(!(focus.day === 0 && pointer < tasks.length && pointer >= focus.block.startIdx && pointer <= focus.block.endIdx)){
    live = false;
    const routine = ROUTINES.find(r => r.id === focus.block.routineId);
    value = (routine && routine.limitMin !== undefined)
      ? routine.limitMin
      : (focus.day === 0 ? routineTargetAndLimit(focus.block.startIdx).limitMin : focus.block.endMin + 10);
  }
  limitControlEl.style.visibility = focus ? '' : 'hidden';
  limitControlEl.classList.toggle('read-only', !live);
  limitControlEl.querySelectorAll('.limit-btn').forEach(btn => { btn.disabled = !live; });
  limitHourEl.textContent = String(Math.floor(value / 60) % 24).padStart(2, '0');
  limitMinEl.textContent = String(Math.round(value % 60)).padStart(2, '0');
  showForecastFor(focus);
}
// When today's routine on screen will end (or ended), next to its deadline:
// the deadline is the goal the parents set, this is what is happening.
function showForecastFor(focus){
  const el = forecastEl;
  if(!el) return;
  let html = '';
  if(focus && focus.day === 0 && tasks.length){
    const b = focus.block;
    const end = forecastTimes()[b.endIdx].end;
    const value = timeShiftHtml(end, routineTargetAndLimit(b.startIdx).targetEndMin);
    html = panelEl ? `🏁 ${value}`
      : `<span class="limit-title">${tr(pointer > b.endIdx ? 'forecast_done' : 'forecast_label')}</span> ${value}`;
  }
  if(el.dataset.h !== html){
    el.innerHTML = html;
    el.dataset.h = html;
  }
}

function applyTimelineFocus(){
  const titleEl = timelineEl.querySelector('.timeline-title');
  const focus = focusedRoutineBlock();
  showDeadlineFor(focus);
  if(!focus){
    clearTimelinePreview();
    if(titleEl) titleEl.style.display = 'none';
    return;
  }
  const { day, block } = focus;
  const r = ROUTINES.find(r => r.id === block.routineId);
  const weekday = WEEKDAY_FULL[(new Date().getDay() + day) % 7];
  const dayPrefix = day === 0 ? '' : (day === 1 ? `${tr('tomorrow')} · ` : `${weekday[0].toUpperCase()}${weekday.slice(1)} · `);
  if(titleEl){
    titleEl.textContent = `${dayPrefix}${r ? `${r.icon} ${r.name}` : `📋 ${tr('routine_fallback')}`}`;
    titleEl.style.display = '';
  }
  tasks.forEach((t, i) => {
    const el = stepEl(i);
    if(el) el.style.display = (day === 0 && i >= block.startIdx && i <= block.endIdx) ? '' : 'none';
  });
  // In a child's column the list must fit without scrolling (hard with a TV
  // remote): tasks done before the last one shrink into a row of small pictures.
  const trail = timelineEl.querySelector('.kid-trail');
  if(trail && timelineEl.classList.contains('pictures-only')) trail.innerHTML = ''; // already a compact row of pictures
  else if(trail){
    const collapsed = [];
    tasks.forEach((t, i) => {
      const el = stepEl(i);
      const hide = day === 0 && i >= block.startIdx && i < pointer - 1 && !t.userSkipped; // skipped ones stay, to be undone
      if(el) el.classList.toggle('collapsed', hide);
      if(hide) collapsed.push(t);
    });
    const html = collapsed.map(t => `<span class="trail-item">${t.emoji}<small>${t.userSkipped ? '⏭️' : t.outcome === 'skipped' ? '✔' : (t.outcome === 'late' ? LATE_ICON : ONTIME_ICON)}</small></span>`).join('');
    if(trail.innerHTML !== html) trail.innerHTML = html;
  }
  if(day === 0){ clearTimelinePreview(); return; }
  const key = `${day}:${block.startIdx}:${block.endIdx}`;
  if(key === timelinePreviewKey) return;
  clearTimelinePreview();
  tasksForBrowseDay(day).slice(block.startIdx, block.endIdx + 1).forEach(t => {
    const div = document.createElement('div');
    div.className = 'step preview';
    const emoji = document.createElement('div');
    emoji.className = 'emoji';
    emoji.textContent = t.emoji;
    const info = document.createElement('div');
    info.className = 'info';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = t.name;
    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = `${fmtMin(t.startMin)} – ${fmtMin(t.endMin)}`;
    info.appendChild(name);
    info.appendChild(time);
    div.appendChild(emoji);
    div.appendChild(info);
    timelineEl.appendChild(div);
  });
  timelinePreviewKey = key;
}

// ---------- SOUND (generated beep, no external files) ----------
let soundEnabled = false; // starts off; user turns it on with the button
let audioCtx;

function ensureAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep(freq=880, duration=0.15, delay=0){
  if(!soundEnabled) return;
  try{
    const ctx = ensureAudioCtx();
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.25, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.05);
  }catch(e){}
}
function chime(){ beep(660,0.15,0); beep(880,0.18,0.16); beep(1046,0.22,0.34); }

// Demo melody for the "Wake up" task (just to test "bigger sound at the
// start" while we don't have a real hosted mp3 — replace with sound.src
// pointing to a music link/file when we have one).
function wakeMelody(){
  const notes = [523,587,659,698,784,880,784,659];
  notes.forEach((f,i) => beep(f, 0.22, i*0.2));
}

// ---------- Clapping sound (filtered noise, in applause rhythm) ----------
// ---------- "Crowd" applause sound (noise layer + scattered claps) ----------
function playClapSound(){
  if(!soundEnabled) return;
  try{
    const ctx = ensureAudioCtx();
    const duration = 2.6;
    const t0 = ctx.currentTime;

    // layer 1: continuous background "roar", like a distant crowd
    const roarBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate*duration), ctx.sampleRate);
    const roarData = roarBuf.getChannelData(0);
    for(let i=0;i<roarData.length;i++){ roarData[i] = Math.random()*2-1; }
    const roarSrc = ctx.createBufferSource();
    roarSrc.buffer = roarBuf;
    const roarFilter = ctx.createBiquadFilter();
    roarFilter.type = 'bandpass';
    roarFilter.frequency.value = 1600;
    roarFilter.Q.value = 0.5;
    const roarGain = ctx.createGain();
    roarGain.gain.setValueAtTime(0.0001, t0);
    roarGain.gain.linearRampToValueAtTime(0.16, t0+0.3);
    roarGain.gain.linearRampToValueAtTime(0.12, t0+duration-0.5);
    roarGain.gain.linearRampToValueAtTime(0.0001, t0+duration);
    roarSrc.connect(roarFilter).connect(roarGain).connect(ctx.destination);
    roarSrc.start(t0);

    // layer 2: many individual small claps, scattered and irregular (no fixed rhythm)
    const clapCount = 45;
    for(let i=0;i<clapCount;i++){
      const t = Math.random() * duration * 0.92;
      const dur = 0.05 + Math.random()*0.05;
      const bufferSize = Math.floor(ctx.sampleRate * dur);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<bufferSize;j++){ data[j] = (Math.random()*2-1) * Math.pow(1-j/bufferSize, 2); }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1200 + Math.random()*2500;
      filter.Q.value = 0.8 + Math.random();
      const gain = ctx.createGain();
      gain.gain.value = 0.10 + Math.random()*0.16;
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start(t0 + t);
    }

    // layer 3: whistles (high-pitched glissando)
    [0.15, 1.3].forEach(delay => {
      const t1 = t0 + delay;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      const g = ctx.createGain();
      osc.frequency.setValueAtTime(1100, t1);
      osc.frequency.exponentialRampToValueAtTime(2500, t1+0.18);
      osc.frequency.exponentialRampToValueAtTime(1700, t1+0.42);
      g.gain.setValueAtTime(0.0001, t1);
      g.gain.linearRampToValueAtTime(0.16, t1+0.05);
      g.gain.linearRampToValueAtTime(0.0001, t1+0.48);
      osc.connect(g).connect(ctx.destination);
      osc.start(t1); osc.stop(t1+0.5);
    });

    // layer 4: crowd "cheers" (filtered noise with glissando)
    [0.05, 0.85, 1.9].forEach(delay => {
      const t1 = t0 + delay;
      const dur = 0.55;
      const bufferSize = Math.floor(ctx.sampleRate*dur);
      const buf = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ d[i] = Math.random()*2-1; }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filt = ctx.createBiquadFilter();
      filt.type = 'bandpass';
      filt.Q.value = 6;
      filt.frequency.setValueAtTime(450, t1);
      filt.frequency.exponentialRampToValueAtTime(1300, t1+dur*0.6);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t1);
      g.gain.linearRampToValueAtTime(0.22, t1+0.12);
      g.gain.linearRampToValueAtTime(0.0001, t1+dur);
      src.connect(filt).connect(g).connect(ctx.destination);
      src.start(t1);
    });
  }catch(e){}
}

// ---------- Speech (encouraging message, with a more "mascot"-like voice) ----------
function speak(text, opts={}){
  if(!soundEnabled) return;
  try{
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANG_LOCALES[LANG];
      u.pitch = opts.pitch !== undefined ? opts.pitch : 1;
      u.rate = opts.rate !== undefined ? opts.rate : 1;
      const voices = window.speechSynthesis.getVoices();
      const voice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(LANG));
      if(voice) u.voice = voice;
      window.speechSynthesis.speak(u);
    } else {
      beep(392,0.2,0); beep(440,0.2,0.22); beep(494,0.3,0.44); // soft motif, no voice
    }
  }catch(e){}
}

// "Vroom": two rising engine sweeps.
function vroom(){
  if(!soundEnabled) return;
  const ctx = ensureAudioCtx();
  [0, 0.9].forEach(delay => {
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(70, t0);
    osc.frequency.exponentialRampToValueAtTime(260, t0 + 0.7);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.85);
  });
}

const taskAudio = new Audio();
taskAudio.loop = false;

// A family audio for "well done" or "let's speed up"; the default sound
// (fallback) plays when none is chosen, it's missing or it can't play.
const familyAudio = new Audio();
function playFamilyAudio(id, fallback){
  if(!soundEnabled) return;
  const runFallback = () => { try{ fallback(); }catch(e){} };
  const src = audioSrc(id);
  if(!src) return runFallback();
  try{
    familyAudio.pause();
    familyAudio.src = src;
    familyAudio.currentTime = 0;
    familyAudio.play().catch(runFallback);
  }catch(e){ runFallback(); }
}

function stopTaskAudio(){
  if(!taskAudio.paused){
    taskAudio.pause();
    taskAudio.currentTime = 0;
  }
}

function playForTask(task){
  if(!soundEnabled){
    stopTaskAudio();
    return;
  }
  if(task && task.sound && task.sound.type === 'melody'){
    stopTaskAudio();
    wakeMelody();
  } else if(task && task.sound && task.sound.type === 'family'){
    stopTaskAudio();
    const src = audioSrc(task.sound.id);
    if(!src){ chime(); return; } // deleted, or not downloaded yet
    taskAudio.src = src;
    taskAudio.loop = false;
    taskAudio.volume = 1;
    taskAudio.currentTime = 0;
    taskAudio.play().catch(() => { chime(); });
  } else if(task && task.sound && task.sound.src){
    stopTaskAudio();
    taskAudio.src = task.sound.src;
    taskAudio.loop = !!task.sound.loop;
    taskAudio.volume = (task.sound.volume !== undefined) ? task.sound.volume : 1;
    taskAudio.currentTime = 0;
    taskAudio.play().catch(()=>{ wakeMelody(); });
  } else {
    stopTaskAudio();
    chime();
  }
}

// ---------- Per-minute segments ----------
let lastSegTaskIndex = -1;

function buildSegments(totalMin, redMin=0){
  segmentsEl.innerHTML = '';
  const n = Math.max(1, Math.round(totalMin));
  segmentsEl.style.setProperty('--segs', n);
  const redCount = Math.round(redMin);
  for(let i=0;i<n;i++){
    const seg = document.createElement('div');
    const isRed = i >= (n - redCount);
    seg.className = 'seg' + (isRed ? ' overtime' : '');
    seg.innerHTML = `<div class="fill"></div><span>${i+1}</span>`;
    segmentsEl.appendChild(seg);
  }
}
function updateSegments(elapsedMin){
  const segs = segmentsEl.children;
  for(let i=0;i<segs.length;i++){
    const seg = segs[i];
    const fill = seg.querySelector('.fill');
    const segElapsed = Math.min(1, Math.max(0, elapsedMin - i));
    if(segElapsed >= 1){
      seg.classList.add('complete');
      fill.style.width = '100%';
    } else {
      seg.classList.remove('complete');
      fill.style.width = (segElapsed*100) + '%';
    }
  }
}

// ---------- Task extension (+5 min), respecting the deadline ----------
// Recompute only the tasks AFTER the current one (pointer), using its current
// end as the anchor. Never touches the current task's own start — important
// because that start may have been set by an early "Start".
function cascadeAfterPointer(){
  let cursor = tasks[pointer].endMin;
  for(let i = pointer+1; i < tasks.length; i++){
    const start = nextStartAfter(tasks[i-1], tasks[i], cursor);
    tasks[i].startMin = start;
    tasks[i].endMin = start + tasks[i].baseDurationMin;
    cursor = tasks[i].endMin;
  }
}

function extendCurrentTask(){
  const extra = activeChild().extraMin || 5;
  tasks[pointer].baseDurationMin += extra;
  tasks[pointer].redMin += extra;
  tasks[pointer].endMin += extra; // extend only the end; the start doesn't change
  fitFlexibleTasks();
}

// Making up for a delay: only the tasks the parents marked "can be shortened"
// shrink, each by at most half its time, a minute at a time to whichever has
// the most left (roughly in proportion to their length), until the routine
// is back on its planned end. What can't be made up pushes the end (the
// forecast turns red). Durations start from the plan each time, so time
// gained later (an early finish, a skipped task) gives the minutes back.
// startingNow: the current task is only starting, so it can be fitted too.
function fitFlexibleTasks(startingNow){
  if(pointer >= tasks.length) return;
  const block = routineBlockAt(pointer); // only this routine, never the next one
  const cur = tasks[pointer];
  const flex = [];
  for(let i = startingNow ? pointer : pointer + 1; i <= block.endIdx; i++){
    const t = tasks[i];
    if(t.flex && !t.userSkipped && !(i === pointer && t.redMin)){ t.baseDurationMin = t.plannedDurationMin; flex.push(t); }
  }
  const place = () => { if(startingNow) cur.endMin = cur.startMin + cur.baseDurationMin; cascadeAfterPointer(); };
  place();
  if(!flex.length) return;
  let over = Math.round(tasks[block.endIdx].endMin - routineTargetAndLimit(pointer).targetEndMin);
  while(over > 0){
    let best = null;
    flex.forEach(t => {
      if(t.baseDurationMin - 1 < Math.ceil(t.plannedDurationMin / 2)) return;
      if(!best || t.baseDurationMin / t.plannedDurationMin > best.baseDurationMin / best.plannedDurationMin) best = t;
    });
    if(!best) break;
    best.baseDurationMin -= 1;
    over -= 1;
  }
  place();
}

// ---------- Mark task as done (shared by both ways of advancing) ----------
let awaitingStart = false; // true = next task waiting for a tap on "Start"

function markTaskDone(actualEndMin){
  tasks[pointer].endMin = actualEndMin;
  tasks[pointer].outcome = (tasks[pointer].redMin > 0 || tasks[pointer].closedLate) ? 'late' : 'onTime';
  if(tasks[pointer].outcome === 'onTime') celebrate();
  else encourage();
  const finishedRoutine = tasks[pointer].routineId;
  pointer++;
  passSkipped();
  if(pointer >= tasks.length || tasks[pointer].routineId !== finishedRoutine){
    const slot = currentSlot;
    setTimeout(() => { if(SLOTS.includes(slot)) withChild(slot, celebrateRoutine); }, 1500);
  }
  lastSegTaskIndex = -1;
  rebuildTimelineDOM();
}

// Used by the confirmation dialog (Yes / timeout): the task finished on
// time, so the next one starts immediately, with no wait.
function advanceTask(actualEndMin){
  if(pointer >= tasks.length) return;
  markTaskDone(actualEndMin);
  recomputeUpcoming();
  if(pointer < tasks.length && nowInMinutes() >= tasks[pointer].startMin) fitFlexibleTasks(true); // it starts right away
  else fitFlexibleTasks();
  const nextTask = pointer < tasks.length ? tasks[pointer] : null;
  playForTask(nextTask);
}

// ---------- "Was the task completed?" dialog ----------
const confirmOverlay = document.getElementById('confirm-overlay');
const confirmCardEl = document.querySelector('.confirm-card');
const confirmTaskName = document.getElementById('confirm-task-name');
const confirmTimerBar = document.getElementById('confirm-timer-bar');

// The dialog follows the child's settings: time to answer, and what happens
// with no answer (activeChild().confirmDefault).
function activeChild(){ return CHILDREN.find(c => c.id === ACTIVE_CHILD_ID) || {}; }
function confirmMs(){ return (activeChild().confirmSeconds || 10) * 1000; }
let confirmState = null; // {deadline}
let lastTickSecond = null;

// The dialog is shared by all children: one child's question at a time
// (confirmOwner); another child's waits until it is answered.
let confirmOwner = null;
function openConfirm(){
  if(confirmOwner && confirmOwner !== ACTIVE_CHILD_ID) return;
  confirmOwner = ACTIVE_CHILD_ID;
  const mode = activeChild().confirmDefault || 'yes';
  confirmState = { deadline: mode === 'wait' ? Infinity : Date.now() + confirmMs(), mode };
  const seconds = `<span id="confirm-seconds">${confirmMs() / 1000}</span>`;
  document.querySelector('.confirm-hint').innerHTML = mode === 'wait' ? tr('confirm_hint_wait')
    : tr(mode === 'more' ? 'confirm_hint_more' : 'confirm_hint', { seconds, extra: activeChild().extraMin || 5 });
  document.querySelector('.confirm-timer-wrap').style.display = mode === 'wait' ? 'none' : '';
  lastTickSecond = null;
  const child = SLOTS.length > 1 && CHILDREN.find(c => c.id === ACTIVE_CHILD_ID);
  confirmTaskName.textContent = child ? `${tasks[pointer].name} (${child.icon} ${child.name})` : tasks[pointer].name;
  confirmOverlay.style.display = 'flex';
  confirmCardEl.classList.remove('urgent');
  chime();
}
function closeConfirm(){
  confirmState = null;
  if(confirmOwner && confirmOwner !== ACTIVE_CHILD_ID) return; // another child's question is on screen
  confirmOwner = null;
  confirmOverlay.style.display = 'none';
  confirmCardEl.classList.remove('urgent');
}
function resolveConfirm(answer){
  if(!confirmState) return;
  if(answer === 'nao'){
    try{ extendCurrentTask(); }catch(e){}
    closeConfirm();
    lastSegTaskIndex = -1;
    try{ rebuildTimelineDOM(); }catch(e){}
    startExtraTimeFeedback(); // banner + sound + voice, always — even if something above fails
  } else {
    const finishAt = tasks[pointer].endMin;
    closeConfirm();
    try{ advanceTask(finishAt); }catch(e){}
  }
  render();
}
document.getElementById('confirm-yes').addEventListener('click', () => withChild(slotById(confirmOwner), () => { resolveConfirm('sim'); progressAction(); }));
document.getElementById('confirm-no').addEventListener('click', () => withChild(slotById(confirmOwner), () => { resolveConfirm('nao'); progressAction(); }));

// ---------- "I'm done" button (early completion) ----------
function finishEarly(){
  if(pointer >= tasks.length || confirmState || awaitingStart) return;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  if(nowMin < tasks[pointer].startMin) return; // still in the waiting gap between routines
  const finishAt = Math.max(tasks[pointer].startMin, Math.min(nowMin, tasks[pointer].endMin));
  markTaskDone(finishAt);
  if(pointer < tasks.length){
    awaitingStart = true; // next task waits for a tap on "Start"
  } else {
    recomputeUpcoming();
  }
  progressAction();
  render();
}
// Tick the box first, so the child sees it marked, then close the task.
const mainFinishBtn = document.getElementById('finish-early-btn');
mainFinishBtn.addEventListener('click', () => {
  if(mainFinishBtn.classList.contains('checked')) return;
  mainFinishBtn.classList.add('checked');
  setTimeout(() => { mainFinishBtn.classList.remove('checked'); finishEarly(); }, 600);
});

// ---------- "Start" button (starts the next task and moves the rest earlier) ----------
let startNextBtn = document.getElementById('start-next-btn');
function startNextTask(){
  if(!awaitingStart) return;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  awaitingStart = false;
  recomputeUpcoming(nowMin); // anchor the next task (and the following ones) from now
  fitFlexibleTasks(true);
  lastSegTaskIndex = -1;
  playForTask(tasks[pointer]);
  progressAction();
  render();
}
startNextBtn.addEventListener('click', startNextTask);

// ---------- Reorder tasks not done yet ----------
function moveTask(idx, dir){
  const j = idx + dir;
  if(idx < pointer || j < pointer || j >= tasks.length) return;
  const tmp = tasks[idx];
  tasks[idx] = tasks[j];
  tasks[j] = tmp;
  recomputeUpcoming();
  lastSegTaskIndex = -1;
  rebuildTimelineDOM();
  progressAction();
  render();
}
timelineEl.addEventListener('click', (e) => {
  const skip = e.target.closest('.skip-btn');
  if(skip){ onStepSkip(parseInt(skip.dataset.index, 10)); return; }
  const btn = e.target.closest('.reorder-btn');
  if(!btn || btn.disabled) return;
  const idx = parseInt(btn.dataset.index, 10);
  moveTask(idx, btn.classList.contains('up') ? -1 : 1);
});

// ---------- Main render ----------
// Draws the current child's day.
function render(){
  renderMain();
  applyTimelineFocus();
}
// Every second: the clock, each child's day, and the checks that depend on all of them.
function renderAll(){
  const now = new Date();
  clockEl.textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  forEachChild(render);
  checkTestFinished();
  maybeAutoRefresh(now.getHours()*60 + now.getMinutes() + now.getSeconds()/60);
}
function renderMain(){
  checkDayRollover();
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  refreshLimitForCurrentRoutine(); // automatically recompute the deadline when the routine changes
  updateHeaderTitle(); // reset to the normal title by default; renderBrowsedTask() overrides it while browsing

  // Visually mark completed / active tasks
  tasks.forEach((t,i) => {
    const el = stepEl(i);
    if(!el) return;
    el.classList.remove('active','finished');
    if(i < pointer) el.classList.add('finished');
    else if(i === pointer) el.classList.add('active');
  });
  // A task skipped in advance whose turn came (e.g. after a reload): pass it.
  if(pointer < tasks.length && tasks[pointer].userSkipped && !confirmState){
    passSkipped();
    recomputeUpcoming();
    rebuildTimelineDOM();
  }
  refreshStepTimes();
  skipBtn.style.display = 'none';
  skipBtn.textContent = tr('skip_btn');
  postponeBtn.style.display = 'none';
  postponeBtn.textContent = tr('postpone_btn');
  postponeBtn.title = tr('postpone_title');
  const showTaskExtras = () => { skipBtn.style.display = 'inline-block'; if(canPostpone()) postponeBtn.style.display = 'inline-block'; };
  // A column's list may not fit: keep the current task in view (scrolled once per task).
  if(panelEl && timelineEl.dataset.scrolledTo !== String(pointer)){
    const el = stepEl(Math.min(pointer, tasks.length - 1));
    if(el && timelineEl.scrollHeight > timelineEl.clientHeight){
      const prev = stepEl(pointer - 1); // keep the last task done in view, above the current one
      timelineEl.scrollTop = Math.max(0, (prev && prev.style.display !== 'none' ? prev : el).offsetTop);
      timelineEl.dataset.scrolledTo = String(pointer);
    }
  }

  const idle = (pointer >= tasks.length) || (!awaitingStart && tasks[pointer] && nowMin < tasks[pointer].startMin);

  if(!idle){
    browseDay = null;
    browseTaskIdx = null;
    browseControlsEl.style.display = 'none';
  }

  if(pointer >= tasks.length){
    heroEl.classList.add('done');
    finishEarlyBtn.style.display = 'none';
    startNextBtn.style.display = 'none';

    const hasFuture = findDayWithTasks(1, 1) !== null;
    if(tasks.length > 0 || hasFuture){
      browseControlsEl.style.display = 'flex';
      browsePrevBtn.disabled = (browseDay === null) ? (tasks.length === 0) : false;
      browseNextBtn.disabled = (browseDay === null) ? !hasFuture : false;
      if(browseDay !== null){ renderBrowsedTask(); return; }
    } else {
      browseControlsEl.style.display = 'none';
    }

    if(tasks.length === 0){
      heroEmoji.textContent = '😴';
      heroLabel.textContent = tr('no_routine_today');
      heroSub.textContent = previewTomorrow() || tr('no_routine_configured');
    } else {
      heroEmoji.textContent = activeChild().doneIcon || '🎉';
      heroLabel.textContent = tr('routine_complete');
      heroSub.textContent = previewTomorrow() || tr('see_you_tomorrow');
    }
    minutesLeftEl.innerHTML = '';
    segmentsEl.innerHTML = '';
    return;
  }

  if(awaitingStart){
    browseControlsEl.style.display = 'none';
    const t = tasks[pointer];
    heroEl.classList.remove('done');
    heroEmoji.textContent = t.emoji;
    heroLabel.textContent = t.name;
    heroSub.textContent = tr('ready_to_start');
    minutesLeftEl.innerHTML = '';
    segmentsEl.innerHTML = '';
    finishEarlyBtn.style.display = 'none';
    startNextBtn.style.display = 'inline-block';
    startNextBtn.textContent = tr('start_task', { task: t.name });
    showTaskExtras();
    return;
  }
  finishEarlyBtn.style.display = 'inline-block';
  startNextBtn.style.display = 'none';

  // Actual gap between different routines (e.g. end of Morning until Lunch
  // starts). Right after finishing, it keeps showing the "done" screen for
  // a while (so the child sees what they finished) instead of jumping straight
  // to the countdown — only shows the countdown when the next one is close
  // (30min or less) AND at least 15min have passed since the end.
  if(nowMin < tasks[pointer].startMin){
    const minutesSinceLastDone = pointer > 0 ? (nowMin - tasks[pointer-1].endMin) : 999;
    const minutesUntilNext = tasks[pointer].startMin - nowMin;
    const showCountdown = (minutesSinceLastDone >= 15) && (minutesUntilNext <= 30);

    // Safety net: at 15min or less from the actual time, force back to live
    // mode, even if manually browsing another page — ensures nobody misses
    // the time because they were wandering around.
    if(minutesUntilNext <= 15){ browseDay = null; browseTaskIdx = null; }

    finishEarlyBtn.style.display = 'none';
    segmentsEl.innerHTML = '';

    browseControlsEl.style.display = 'flex';
    browsePrevBtn.disabled = (browseDay === null) ? (pointer === 0) : false;
    browseNextBtn.disabled = false; // can always try moving forward (skips to the next days with a routine)
    if(browseDay !== null){ renderBrowsedTask(); return; }

    if(showCountdown){
      heroEl.classList.remove('done');
      heroEmoji.textContent = '⏳';
      heroLabel.textContent = tr('next_label', { task: tasks[pointer].name });
      heroSub.textContent = tr('starts_at', { time: fmtMin(tasks[pointer].startMin) });
      minutesLeftEl.innerHTML = Math.ceil(minutesUntilNext) + '<span class="unit">min</span>';
    } else {
      heroEl.classList.add('done');
      heroEmoji.textContent = activeChild().doneIcon || '🎉';
      heroLabel.textContent = tr('all_good');
      heroSub.textContent = tr('next_at', { task: tasks[pointer].name, time: fmtMin(tasks[pointer].startMin) });
      minutesLeftEl.innerHTML = '';
    }
    return;
  }

  // Confirmation dialog when the current task's time runs out
  if(!confirmState && nowMin >= tasks[pointer].endMin){
    openConfirm();
  }
  if(confirmState){
    // No answer in time: what the child's settings say. "More time" only once
    // per task (then it closes as late); "wait" only until the routine's
    // deadline, so an empty room never blocks the rest of the day.
    const cur = tasks[pointer];
    if(confirmState.mode === 'wait'){
      if(nowMin >= hardLimitMin()){ cur.closedLate = true; resolveConfirm('sim'); return; } // unanswered: counts as late
    } else {
      if(Date.now() >= confirmState.deadline){
        if(confirmState.mode === 'more' && !cur.autoExtended){
          cur.autoExtended = true;
          resolveConfirm('nao');
        } else {
          resolveConfirm('sim');
        }
        return;
      }
      const msLeft = Math.max(0, confirmState.deadline - Date.now());
      const secLeft = Math.ceil(msLeft/1000);
      const secEl = document.getElementById('confirm-seconds');
      if(secEl) secEl.textContent = secLeft;
      confirmTimerBar.style.width = (msLeft/confirmMs()*100) + '%';
      if(secLeft <= 3){
        confirmCardEl.classList.add('urgent');
        if(secLeft !== lastTickSecond){ beep(700, 0.12, 0); lastTickSecond = secLeft; }
      }
    }
  }

  const t = tasks[pointer];
  heroEl.classList.remove('done');
  heroEmoji.textContent = t.emoji;
  heroLabel.textContent = t.name;
  showTaskExtras();
  if(confirmState) heroSub.textContent = tr('confirming');
  else heroSub.innerHTML = tr('until', { time: timeShiftHtml(t.endMin, t.plannedStartMin + t.plannedDurationMin) });

  const total = t.endMin - t.startMin;
  const elapsed = confirmState ? total : Math.max(0, nowMin - t.startMin);
  const remain = Math.max(0, total - elapsed);
  minutesLeftEl.innerHTML = confirmState ? '' : (Math.ceil(remain) + '<span class="unit">min</span>');

  if(lastSegTaskIndex !== pointer){
    buildSegments(total, t.redMin);
    lastSegTaskIndex = pointer;
  }
  updateSegments(elapsed);
}

}

// right after receiving a configuration from another device.
function configRoutineToDraft(r){
  return {
    id: r.id,
    childId: r.childId || ACTIVE_CHILD_ID,
    name: r.name,
    icon: r.icon,
    limitMin: r.limitMin,
    tasks: r.tasks.map(t => ({
      name: t.name,
      emoji: t.emoji,
      start: arrToHHMM(t.start),
      end: arrToHHMM(t.end),
      soundType: (t.sound && ['melody', 'family'].includes(t.sound.type)) ? t.sound.type : ((t.sound && t.sound.src) ? 'url' : 'chime'),
      soundUrl: (t.sound && t.sound.src) ? t.sound.src : '',
      soundAudioId: (t.sound && t.sound.type === 'family') ? t.sound.id : '',
      flex: !!t.flex
    }))
  };

  openPickerIdx = null;

// Over the dark area around a card (settings, welcome, guide, TV setup) the
// mouse wheel scrolls the card too, not only with the pointer on the card.
['settings-overlay', 'welcome-overlay', 'tvsetup-overlay', 'guide-overlay'].forEach(id => {

// ---------- In-app alert/confirm ----------
// TV browsers (e.g. on Google TV) may block native alert()/confirm() popups,
// and a blocked confirm() silently returns false — so use our own dialog.
let appDialogResolve = null;
function openAppDialog(message, yesLabel, noLabel){
  if(appDialogResolve) appDialogResolve(false); // a newer dialog replaces an unanswered one
  document.getElementById('app-dialog-message').textContent = message;
  const yesBtn = document.getElementById('app-dialog-yes');
  const noBtn = document.getElementById('app-dialog-no');
  yesBtn.textContent = yesLabel;
  noBtn.textContent = noLabel || '';
  noBtn.style.display = noLabel ? '' : 'none';
  document.getElementById('app-dialog-overlay').style.display = 'flex';
  // Focus the safe choice, so an accidental remote "OK" press doesn't confirm.
  (noLabel ? noBtn : yesBtn).focus();
  return new Promise(resolve => { appDialogResolve = resolve; });
}
function closeAppDialog(answer){
  document.getElementById('app-dialog-overlay').style.display = 'none';
  const resolve = appDialogResolve;
  appDialogResolve = null;
  if(resolve) resolve(answer);
}
function appAlert(message){ return openAppDialog(message, tr('ok'), null); }
function appConfirm(message, yesLabel){ return openAppDialog(message, yesLabel || tr('yes'), tr('cancel')); }
document.getElementById('app-dialog-yes').addEventListener('click', () => closeAppDialog(true));
document.getElementById('app-dialog-no').addEventListener('click', () => closeAppDialog(false));
document.addEventListener('keydown', (e) => {
  if(appDialogResolve && (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack')){
    e.preventDefault();
    closeAppDialog(false);
  }
});

function computeDraftRoutineNaturalLimit(routine){

// ---------- Weekly table (day x routine) ----------
// Detect actual time overlap between different routines checked on the
// same day. Returns { byDay: {0:[{routineName,...}], ...}, messages: [text,...] }
function findScheduleConflicts(){
  const byDay = {};
  const messages = [];
  for(let d=0; d<7; d++){
    const ids = draftWeekSchedule[d] || [];
    if(ids.length < 2) continue;
    const conflictingIds = new Set();
    // Each child has their own day: only routines of the same child can clash.
    const childIds = [...new Set(draftRoutines.map(r => r.childId))];
    childIds.forEach(cid => {
      let combined = [];
      draftRoutines.forEach(r => {
        if(r.childId === cid && ids.includes(r.id)){
          r.tasks.forEach(t => combined.push({
            routineId: r.id,
            routineName: r.name,
            start: toMinutes(hhmmToArr(t.start)),
            end: toMinutes(hhmmToArr(t.end))
          }));
        }
      });
      combined.sort((a,b) => a.start - b.start);
      for(let i=1; i<combined.length; i++){
        if(combined[i].start < combined[i-1].end && combined[i].routineId !== combined[i-1].routineId){
          conflictingIds.add(combined[i].routineId);
          conflictingIds.add(combined[i-1].routineId);
          messages.push(tr('overlap_item', { day: DAY_NAMES[d], a: combined[i-1].routineName, b: combined[i].routineName }));
        }
      }
    });
    if(conflictingIds.size > 0) byDay[d] = conflictingIds;
  }
  return { byDay, messages };
}

function renderWeekMatrix(){
  const conflicts = findScheduleConflicts();
  const thead = document.querySelector('#week-matrix thead');
  const tbody = document.querySelector('#week-matrix tbody');
  thead.innerHTML = '<tr><th></th>' + DAY_NAMES.map((d,i) => `<th class="${conflicts.byDay[i]?'day-conflict':''}">${d}</th>`).join('') + '<th></th></tr>';
  tbody.innerHTML = draftRoutines.filter(r => r.childId === selectedChildId).map(r => `
    <tr>
      <td><span class="matrix-routine-label">${r.icon} ${r.name}</span></td>
      ${DAY_NAMES.map((_, d) => {
        const checked = (draftWeekSchedule[d]||[]).includes(r.id);
        const isConflict = checked && conflicts.byDay[d] && conflicts.byDay[d].has(r.id);
        return `<td class="${isConflict?'day-conflict':''}"><input type="checkbox" class="${isConflict?'conflict-checkbox':''}" data-day="${d}" data-rid="${r.id}" ${checked ? 'checked' : ''}></td>`;
      }).join('')}
      <td><button type="button" class="apply-all-days-btn" data-rid="${r.id}">${tr('all_days_btn')}</button></td>
    </tr>
  `).join('');

  const warningEl = document.getElementById('conflict-warning');
  if(conflicts.messages.length > 0){
    warningEl.innerHTML = tr('overlap_heading') + '<br>' + conflicts.messages.join('<br>');
    warningEl.classList.add('show');
  } else {
    warningEl.classList.remove('show');
  }
}
document.querySelector('#week-matrix').addEventListener('change', (e) => {
  if(e.target.type !== 'checkbox') return;
  const day = parseInt(e.target.dataset.day, 10);
  const rid = e.target.dataset.rid;
  let dayArr = draftWeekSchedule[day] || (draftWeekSchedule[day] = []);
  if(e.target.checked){
    if(!dayArr.includes(rid)) dayArr.push(rid);
  } else {
    draftWeekSchedule[day] = dayArr.filter(id => id !== rid);
  }
  renderWeekMatrix();
});

// Adjust a task's time (start/end) by the chosen increment.
// When changing a task's END and auto-chaining is on, push the next task's
// START (and end, keeping its duration) along with it, so there's never
// a gap between them.
function adjustDraftTime(index, field, dir){
  const t = draftTasks[index];
  let totalMin = toMinutes(hhmmToArr(t[field])) + (dir * timeStepMin);
  totalMin = ((totalMin % 1440) + 1440) % 1440;
  t[field] = arrToHHMM([Math.floor(totalMin/60), totalMin%60]);

  if(field === 'end' && autoLinkNext && index < draftTasks.length - 1){
    const next = draftTasks[index+1];
    const nextDuration = toMinutes(hhmmToArr(next.end)) - toMinutes(hhmmToArr(next.start));
    const newNextStart = totalMin;
    const newNextEnd = newNextStart + nextDuration;
    next.start = arrToHHMM([Math.floor(newNextStart/60)%24, newNextStart%60]);
    next.end = arrToHHMM([Math.floor(newNextEnd/60)%24, newNextEnd%60]);
  }
  renderSettingsRows();
}

// After reordering, recompute times in a chain: each task keeps its own
// duration, but now starts exactly where the previous one ends, in the new
// order — the first task in the list keeps its original
// start time.
function recalculateDraftTaskTimes(){
  if(draftTasks.length === 0) return;
  let cursor = toMinutes(hhmmToArr(draftTasks[0].start));
  draftTasks.forEach(t => {
    const duration = toMinutes(hhmmToArr(t.end)) - toMinutes(hhmmToArr(t.start));
    t.start = arrToHHMM([Math.floor(cursor/60)%24, cursor%60]);
    cursor += duration;
    t.end = arrToHHMM([Math.floor(cursor/60)%24, cursor%60]);
  });
}

function saveSettings(){
  const newRoutines = draftRoutines.map(r => ({
    id: r.id,
    childId: r.childId || ACTIVE_CHILD_ID,
    name: (r.name && r.name.trim()) ? r.name.trim() : tr('routine_fallback'),
    icon: r.icon,
    limitMin: r.limitMin,
    tasks: r.tasks.map(t => {
      let sound;
      if(t.soundType === 'melody') sound = { type: 'melody' };
      else if(t.soundType === 'family' && AUDIOS.some(a => a.id === t.soundAudioId)) sound = { type: 'family', id: t.soundAudioId };
      else if(t.soundType === 'url' && t.soundUrl && t.soundUrl.trim()) sound = { type: 'url', src: t.soundUrl.trim(), loop: false };
      return { name: t.name.trim(), emoji: t.emoji, start: hhmmToArr(t.start), end: hhmmToArr(t.end), sound, flex: t.flex || undefined };
    })
  }));

  const newChildren = draftChildren.map(c => Object.assign({}, c, { name: String(c.name || '').trim().slice(0, 30) }));
  const savedConfig = {
    childName: newChildren[0].name,
    children: newChildren,
    onTimeIcon: draftOnTimeIcon,
    lateIcon: draftLateIcon,
    routines: newRoutines,
    weekSchedule: draftWeekSchedule,
    audios: AUDIOS, // saved on their own as soon as they change
    testStartedAt: TEST_STARTED_AT || undefined // a running test goes on
  };
  saveStoredConfig(savedConfig);
  pendingRemoteHouse = null; // this save wins over any remote change received while editing
  pushConfigToCloud(savedConfig);

  ROUTINES = newRoutines;
  WEEK_SCHEDULE = draftWeekSchedule;
  CHILDREN = newChildren;
  CHILD_NAME = newChildren[0].name;
  ONTIME_ICON = draftOnTimeIcon;
  LATE_ICON = draftLateIcon;
  initAllChildren();
  closeSettings();
}

// Apply a configuration object received from another device or built from
// templates, with basic validation.
function applyImportedConfig(cfg){
  if(!cfg || !Array.isArray(cfg.routines) || cfg.routines.length === 0) return false;
  normalizeConfig(cfg);
  CHILDREN = cfg.children;
  if(!visibleChildren().some(c => c.id === ACTIVE_CHILD_ID)) ACTIVE_CHILD_ID = visibleChildren()[0].id;
  TEST_STARTED_AT = cfg.testStartedAt || null;
  CHILD_NAME = cfg.childName || '';
  ONTIME_ICON = cfg.onTimeIcon || DEFAULT_ONTIME_ICON;
  LATE_ICON = cfg.lateIcon || DEFAULT_LATE_ICON;
  ROUTINES = cfg.routines;
  WEEK_SCHEDULE = cfg.weekSchedule || {};
  AUDIOS = cfg.audios;
  saveStoredConfig(cfg);
  initAllChildren();
  syncAudioCache();
  return true;
}

// ---------- Backup: save the config to a file and restore it ----------
function backupFileName(){
  const d = new Date();
  return `routikids-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
}
function saveBackup(){
  const config = Object.assign({}, getCurrentConfigObject(), { testStartedAt: undefined });
  const audioData = {};
  AUDIOS.forEach(a => { const rec = getAudioRecord(a.id); if(rec) audioData[a.id] = { data: rec.data, mime: rec.mime }; });
  const json = JSON.stringify({ app: APP_NAME, kind: 'backup', version: 1, savedAt: Date.now(), config, audioData }, null, 1);
  const name = backupFileName();
  const download = () => {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  };
  // On phones, the share menu lets the file go straight to WhatsApp, e-mail or Drive.
  let file = null;
  try{ file = new File([json], name, { type: 'application/json' }); }catch(e){}
  if(file && guessDeviceKind() !== 'computer' && navigator.canShare && navigator.canShare({ files: [file] })){
    navigator.share({ files: [file], title: APP_NAME }).catch(err => { if(!err || err.name !== 'AbortError') download(); });
  } else download();
}

function restoreBackupText(text){
  let data = null;
  try{ data = JSON.parse(text); }catch(e){}
  const cfg = data && data.config;
  if(cfg) delete cfg.testStartedAt;
  if(!data || data.kind !== 'backup' || !cfg || !Array.isArray(cfg.routines) || !cfg.routines.length){
    return appAlert(tr('backup_invalid')).then(() => false);
  }
  const d = new Date(data.savedAt || Date.now());
  const date = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()} ${formatClock(d.getTime())}`;
  return appConfirm(tr('backup_restore_q', { date }), tr('backup_restore_btn')).then(ok => {
    if(!ok) return false;
    // The saved audios are put in place first, so applying the config keeps them.
    const audioData = (data.audioData && typeof data.audioData === 'object') ? data.audioData : {};
    (Array.isArray(cfg.audios) ? cfg.audios : []).forEach(a => {
      const rec = a && audioData[a.id];
      if(rec && typeof rec.data === 'string' && typeof rec.mime === 'string') storeAudioLocal(a.id, { data: rec.data, mime: rec.mime, up: false });
    });
    if(!applyImportedConfig(cfg)) return appAlert(tr('backup_invalid')).then(() => false);
    pendingRemoteHouse = null;
    if(cloudEnabled() && getHouseId()) Promise.all(AUDIOS.map(a => uploadAudio(a.id))).then(() => pushConfigToCloud(cfg));
    if(settingsOverlay.style.display === 'flex'){ populateDraftFromCurrentConfig(); settingsDirty = false; }
    if(restoreFromWelcome) hideWelcome();
    return appAlert(tr('backup_restored')).then(() => true);
  });
}

// ---------- Family audios (recorded or uploaded by the parents) ----------
// The list (id and name) is part of the config. The sound itself is stored apart,
// in audio/<houseId>/<audioId>, so the live reads of the house stay small: each
// device downloads an audio once and keeps a copy in localStorage.
const AUDIO_KEY_PREFIX = 'rotinaAudio_v1_';
const MAX_AUDIO_SECONDS = 15;
const MAX_AUDIO_BYTES = 200 * 1024;
const audioMem = {};      // id -> { data (base64), mime, up (already in the cloud) }
const audioFetching = {};
function escHtml(text){
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function getAudioRecord(id){
  if(!id) return null;
  if(audioMem[id]) return audioMem[id];
  try{
    const rec = JSON.parse(lsGet(AUDIO_KEY_PREFIX + id));
    if(rec && rec.data && rec.mime){ audioMem[id] = rec; return rec; }
  }catch(e){}
  return null;
}
function storeAudioLocal(id, rec){
  audioMem[id] = { data: String(rec.data), mime: String(rec.mime), up: !!rec.up };
  try{ localStorage.setItem(AUDIO_KEY_PREFIX + id, JSON.stringify(audioMem[id])); }catch(e){} // full: kept in memory only
}
function audioSrc(id){
  const rec = id && AUDIOS.some(a => a.id === id) ? getAudioRecord(id) : null;
  return rec ? `data:${rec.mime};base64,${rec.data}` : null;
}
function uploadAudio(id){
  const houseId = getHouseId();
  const rec = getAudioRecord(id);
  if(!cloudEnabled() || !houseId || !rec) return Promise.resolve(false);
  return cloudFetch(`audio/${houseId}/${id}`, { method: 'PUT', body: JSON.stringify({ data: rec.data, mime: rec.mime, updatedAt: Date.now() }) })
    .then(() => { storeAudioLocal(id, Object.assign({}, rec, { up: true })); return true; }, () => false);
}
// Keep this device's copies in step with the list: forget deleted audios,
// download the missing ones and send the ones that didn't reach the cloud yet.
function syncAudioCache(){
  const ids = AUDIOS.map(a => a.id);
  try{
    Object.keys(localStorage).forEach(k => {
      if(k.startsWith(AUDIO_KEY_PREFIX) && !ids.includes(k.slice(AUDIO_KEY_PREFIX.length))) localStorage.removeItem(k);
    });
  }catch(e){}
  Object.keys(audioMem).forEach(id => { if(!ids.includes(id)) delete audioMem[id]; });
  const houseId = getHouseId();
  if(cloudEnabled() && houseId){
    ids.forEach(id => {
      if(audioFetching[id]) return;
      const rec = getAudioRecord(id);
      if(rec && rec.up) return;
      audioFetching[id] = true;
      const job = rec
        ? uploadAudio(id)
        : cloudFetch(`audio/${houseId}/${id}`).then(remote => {
            if(remote && remote.data && remote.mime && AUDIOS.some(a => a.id === id)){
              storeAudioLocal(id, { data: remote.data, mime: remote.mime, up: true });
              renderAudioLibrary();
            }
          });
      job.catch(() => {}).then(() => { delete audioFetching[id]; });
    });
  }
  renderAudioLibrary();
}
// Changes to the audios are saved right away (not with "Save"), so a
// recording never exists in the cloud without being on the list, or the opposite.
function saveAudioList(){
  const cfg = getCurrentConfigObject();
  saveStoredConfig(cfg);
  pushConfigToCloud(cfg);
  syncAudioCache();
  if(settingsOverlay.style.display === 'flex'){ renderSettingsRows(); renderChildEditor(); }
}
function setAudioStatus(text){ document.getElementById('audio-status').textContent = text || ''; }

function renderAudioLibrary(){
  const list = document.getElementById('audio-list');
  if(!list.contains(document.activeElement)) list.innerHTML = AUDIOS.map(a => { // not while a name is being edited
    const ready = !!getAudioRecord(a.id);

    </li>`;
  }).join('');
  const full = AUDIOS.length >= MAX_AUDIOS;
  document.getElementById('audio-upload-btn').disabled = full || !!recorder;

  recordBtn.disabled = full && !recorder;

// Add a recorded or chosen sound to the library.
function addAudioBlob(blob){
  if(AUDIOS.length >= MAX_AUDIOS) return setAudioStatus(tr('audio_full', { n: MAX_AUDIOS }));
  const mime = String(blob.type || '').split(';')[0].trim();
  if(!/^(audio|video)\/[\w.+-]+$/.test(mime) || mime.length > 40) return setAudioStatus(tr('audio_bad_file'));
  if(blob.size > MAX_AUDIO_BYTES) return setAudioStatus(tr('audio_too_big', { kb: Math.round(MAX_AUDIO_BYTES / 1024) }));
  if(!blob.size) return setAudioStatus(tr('audio_bad_file'));
  const reader = new FileReader();
  reader.onload = () => {
    const data = String(reader.result || '').split(',')[1] || '';
    if(!data) return setAudioStatus(tr('audio_bad_file'));
    const id = 'a' + Date.now().toString(36) + randomId(4, ALNUM);
    const input = document.getElementById('audio-name-input');
    const name = (input.value.trim() || tr('audio_default_name', { n: AUDIOS.length + 1 })).slice(0, 30);
    input.value = '';
    storeAudioLocal(id, { data, mime: mime.replace(/^video\//, 'audio/'), up: false });
    const paired = cloudEnabled() && getHouseId();
    setAudioStatus(paired ? tr('audio_sending') : '');
    // The sound goes up before the list names it, so other devices always find it.
    uploadAudio(id).then(ok => {
      AUDIOS = AUDIOS.concat([{ id, name }]);
      saveAudioList();
      setAudioStatus(!paired ? tr('audio_saved_local') : (ok ? tr('audio_saved') : tr('audio_saved_retry')));
    });
  };
  reader.onerror = () => setAudioStatus(tr('audio_bad_file'));
  reader.readAsDataURL(blob);
}

let recorder = null;
let recordTimer = null;
let recordLeft = 0;
function startRecording(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined'){
    return setAudioStatus(tr('audio_no_mic'));
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    const types = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/webm'];
    const type = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    let rec;
    try{ rec = new MediaRecorder(stream, Object.assign({ audioBitsPerSecond: 32000 }, type ? { mimeType: type } : {})); }
    catch(e){ rec = new MediaRecorder(stream); }
    const chunks = [];
    rec.ondataavailable = (e) => { if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordTimer);
      recorder = null;
      renderAudioLibrary();
      addAudioBlob(new Blob(chunks, { type: rec.mimeType || type || 'audio/webm' }));
    };
    recorder = rec;
    recordLeft = MAX_AUDIO_SECONDS;
    setAudioStatus(tr('audio_recording'));
    rec.start();
    renderAudioLibrary();
    recordTimer = setInterval(() => {
      recordLeft--;
      if(recordLeft <= 0) stopRecording();
      else renderAudioLibrary();
    }, 1000);
  }).catch(() => setAudioStatus(tr('audio_mic_denied')));
}
function stopRecording(){
  clearInterval(recordTimer);
  if(recorder && recorder.state !== 'inactive') recorder.stop();
}
document.getElementById('audio-record-btn').addEventListener('click', () => { recorder ? stopRecording() : startRecording(); });

document.getElementById('audio-list').addEventListener('click', (e) => {
  const li = e.target.closest('li[data-id]');
  if(!li) return;
  const id = li.dataset.id;
  if(e.target.closest('.audio-play')){
    const src = audioSrc(id);
    if(!src) return;
    familyAudio.pause();

// ---------- Cloud sync (pairing by code, one anonymous identity per device) ----------
// All paired devices (TV, phones) share one "house" in a Firebase Realtime
// Database. Each device signs in anonymously through the Firebase Auth REST
// API (no accounts, e-mails or passwords), and the database rules only let
// devices listed in houses/<id>/members read or write that house, so removing
// a device from the list cuts its access for real (see database.rules.json).
// A short-lived 6-digit pair code lets a new device add itself as a member.
// Every save uploads the whole config to houses/<id>/data; the last save wins.
const CLOUD_DB_URL = 'https://rotina-infantil-7dc80-default-rtdb.firebaseio.com'; // empty = cloud sync off
const FIREBASE_API_KEY = 'AIzaSyBLKN1Tc425FYJt9-opD2DO6XUDu_4y5HY'; // public by design; access is enforced by the database rules
const AUTH_SIGNUP_URL = 'https://identitytoolkit.googleapis.com/v1/accounts:signUp';
const AUTH_REFRESH_URL = 'https://securetoken.googleapis.com/v1/token';
const HOUSE_ID_KEY = 'rotinaHouseId_v2';
const LEGACY_HOUSE_ID_KEY = 'rotinaHouseId_v1'; // pairing from before per-device identities; must pair again
const HOUSE_REV_KEY = 'rotinaHouseRev_v2'; // revision of the config this device last applied or sent
const AUTH_KEY = 'rotinaAuth_v1';          // { uid, refreshToken } of this device's anonymous identity
const DEVICE_NAME_KEY = 'rotinaDeviceName_v1';
const PAIR_CODE_TTL_MS = 10 * 60 * 1000;
const TOKEN_MARGIN_MS = 60 * 1000;         // refresh the ID token this long before it expires
const LAST_SEEN_INTERVAL_MS = 60 * 60 * 1000;
const ALNUM = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

function cloudEnabled(){ return !!(CLOUD_DB_URL && FIREBASE_API_KEY); }
function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lsSet(key, value){
  try{
    if(value === null) localStorage.removeItem(key);
    else localStorage.setItem(key, value);
  }catch(e){}
}
function randomId(len, alphabet){
  const bytes = new Uint8Array(len);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => alphabet[b % alphabet.length]).join('');
}
function getHouseId(){ return lsGet(HOUSE_ID_KEY); }

// ---- Anonymous device identity (Firebase Auth REST API) ----
let idToken = null;
let idTokenExpiresAt = 0;
let tokenPromise = null;
function loadAuth(){
  try{ return JSON.parse(lsGet(AUTH_KEY)) || null; }catch(e){ return null; }
}
function getUid(){
  const auth = loadAuth();
  return auth ? auth.uid : null;
}
function fetchJson(url, options){
  return fetch(url, options).then(r => r.json().then(body => {
    if(!r.ok){
      const err = new Error('HTTP ' + r.status);
      err.status = r.status;
      err.code = (body && body.error && (body.error.message || body.error)) || '';
      throw err;
    }
    return body;
  }));
}
function getIdToken(force){
  if(!force && idToken && Date.now() < idTokenExpiresAt - TOKEN_MARGIN_MS) return Promise.resolve(idToken);
  if(tokenPromise) return tokenPromise;
  const auth = loadAuth();
  const request = (auth && auth.refreshToken)
    ? fetchJson(`${AUTH_REFRESH_URL}?key=${FIREBASE_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(auth.refreshToken)
      }).then(j => ({ uid: j.user_id, idToken: j.id_token, refreshToken: j.refresh_token, expiresIn: j.expires_in }),
        err => {
          // The identity itself is gone (e.g. deleted in the console): start over with a new
          // one; the database will then treat this device as no longer being a member.
          // Only when Google says the identity itself is gone. Other 400s (bad key,
          // quota, transient errors) keep it, so a glitch never costs the pairing.
          if(['TOKEN_EXPIRED', 'USER_DISABLED', 'USER_NOT_FOUND', 'INVALID_REFRESH_TOKEN'].includes(String(err.code))){
            logCloudEvent(tr('log_identity_lost', { code: err.code }));
            lsSet(AUTH_KEY, null);
          } else {
            logCloudEvent(tr('log_refresh_failed', { info: `${err.status || 'network'} ${err.code || ''}`.trim() }));
          }
          throw err;
        })
    : fetchJson(`${AUTH_SIGNUP_URL}?key=${FIREBASE_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ returnSecureToken: true })
      }).then(j => ({ uid: j.localId, idToken: j.idToken, refreshToken: j.refreshToken, expiresIn: j.expiresIn }));
  tokenPromise = request.then(t => {
    if(!auth || auth.uid !== t.uid) logCloudEvent(tr('log_new_identity', { id: String(t.uid).slice(0, 6) }));
    lsSet(AUTH_KEY, JSON.stringify({ uid: t.uid, refreshToken: t.refreshToken }));
    idToken = t.idToken;
    idTokenExpiresAt = Date.now() + Number(t.expiresIn) * 1000;
    tokenPromise = null;
    return idToken;
  }, err => { tokenPromise = null; throw err; });
  return tokenPromise;
}

function dbUrl(path, token){
  return `${CLOUD_DB_URL.replace(/\/+$/, '')}/${path}.json?auth=${encodeURIComponent(token)}`;
}
// Database REST call as this device. A 401 is retried once with a fresh token
// (it may just have expired); a second 401 means the rules deny access.
function cloudFetch(path, options, retried){
  return getIdToken(retried).then(token => fetch(dbUrl(path, token), Object.assign({ cache: 'no-store' }, options)))
    .then(r => {
      if(r.status === 401 && !retried) return cloudFetch(path, options, true);
      if(!r.ok){ const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }
      return r.json();
    });
}

// it's the revision this device already has; if the settings screen is open
// with unsaved edits, it's deferred so they aren't wiped (closeSettings

// pair code), it's applied right away and the form refreshed.
let pendingRemoteHouse = null;
let knownMemberIds = null;
function handleRemoteHouse(house, readStartedAt){
  if(!house) return;
  handleRemoteConfig(house, readStartedAt);
  if(AUDIOS.some(a => !getAudioRecord(a.id) || !getAudioRecord(a.id).up)) syncAudioCache(); // a download or upload failed before

  forEachChild(() => {

    try{ applyRemoteProgress(remote); }catch(e){}
    // This device is ahead (e.g. its day started before pairing, or the entry is
    // missing): share it, so a device joining mid-day starts from where things are.
    const remoteSeq = (remote && typeof remote.seq === 'number') ? remote.seq : 0;

function handleRemoteConfig(house, readStartedAt){

  if(data.rev === lsGet(HOUSE_REV_KEY)) return;

// The database refused this device. That normally means another device removed
// it, but a transient glitch must never cost the pairing, so it only counts
// after a second refusal at least 15s later.
let removalSuspectAt = 0;
function suspectRemoved(source){
  if(!getHouseId()) return;
  const now = Date.now();
  if(removalSuspectAt && now - removalSuspectAt >= 15000){
    removalSuspectAt = 0;
    handleRemovedFromHouse(source);
    return;
  }
  if(!removalSuspectAt){
    removalSuspectAt = now;
    logCloudEvent(tr('log_refused', { source }));
  }
  setTimeout(refreshFromCloud, 20000);
}

// Another device removed this one from the group (or it was paired before
// per-device identities existed): stop syncing, but keep the local routine.
function handleRemovedFromHouse(source){

// Only one read in flight at a time: if a slower, older response arrived
// after a newer one, it would re-apply stale data. A refresh requested while
// one is running just schedules one more read right after it.
let refreshInFlight = null;
let refreshAgain = false;
function refreshFromCloud(){
  const houseId = getHouseId();
  if(!cloudEnabled() || !houseId) return Promise.resolve();
  if(refreshInFlight){ refreshAgain = true; return refreshInFlight; }
  const readStartedAt = Date.now();
  refreshInFlight = cloudFetch(`houses/${houseId}`)
    .then(house => {
      if(getHouseId() !== houseId) return;
      if(removalSuspectAt){ removalSuspectAt = 0; logCloudEvent(tr('log_recovered')); }
      handleRemoteHouse(house, readStartedAt);
    })
    .catch(err => { if(err.status === 401 && getHouseId() === houseId) suspectRemoved(tr('source_read')); })
    .then(() => {
      refreshInFlight = null;
      if(refreshAgain){ refreshAgain = false; return refreshFromCloud(); }
    });
  return refreshInFlight;
}

// Live updates via the database's streaming REST API (Server-Sent Events).
// Any change notification just triggers a full re-read — simpler than
// applying partial patches. The stream carries the ID token, so it's
// reopened before the token expires.
let houseStream = null;
let streamRestartTimer = null;
function stopHouseSync(){
  if(houseStream){ houseStream.close(); houseStream = null; }
  if(streamRestartTimer){ clearTimeout(streamRestartTimer); streamRestartTimer = null; }
}
function startHouseSync(){
  stopHouseSync();
  const houseId = getHouseId();
  if(!cloudEnabled() || !houseId) return;
  refreshFromCloud();
  if(!window.EventSource) return;
  getIdToken().then(token => {
    if(getHouseId() !== houseId || houseStream) return;
    const stream = new EventSource(dbUrl(`houses/${houseId}`, token));
    houseStream = stream;
    const restartSoon = () => {
      if(houseStream !== stream) return;
      stopHouseSync();
      streamRestartTimer = setTimeout(startHouseSync, 5000);
    };
    ['put', 'patch'].forEach(ev => stream.addEventListener(ev, () => refreshFromCloud()));
    // Token expired or access revoked: reopen with a fresh token (or find out this device was removed).
    ['auth_revoked', 'cancel'].forEach(ev => stream.addEventListener(ev, restartSoon));
    // The browser gave up on the stream for good (e.g. its reconnect hit an expired token).
    stream.addEventListener('error', () => { if(stream.readyState === 2) restartSoon(); });
    streamRestartTimer = setTimeout(startHouseSync, Math.max(60 * 1000, idTokenExpiresAt - Date.now() - TOKEN_MARGIN_MS));
  }).catch(() => {});
}

// Make sure this device belongs to a house (creating one with the current
// config if needed), so other devices can join it.
function ensureHouse(){
  const existing = getHouseId();
  if(existing) return Promise.resolve(existing);
  const houseId = randomId(24, ALNUM);
  return getIdToken()
    .then(() => cloudFetch(`houses/${houseId}/members/${getUid()}`, { method: 'PUT', body: JSON.stringify(newMemberRecord()) }))
    .then(() => {
      lsSet(HOUSE_ID_KEY, houseId);
      logCloudEvent(tr('log_group_created'));
      // This device's audios go up before the config that names them.
      return Promise.all(AUDIOS.map(a => uploadAudio(a.id))).then(() => pushConfigToCloud(getCurrentConfigObject()));
    })
    .then(ok => {
      if(!ok){ lsSet(HOUSE_ID_KEY, null); throw new Error('push failed'); }
      startHouseSync();
      return houseId;
    });
}

// The database rules refuse to overwrite a code that is still valid, so a

function createPairCode(houseId, attempt){

    .then(() => code)
    .catch(err => {

function formatClock(ms){
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function formatLastSeen(ms){
  if(!ms) return tr('seen_never');
  const diffMin = Math.floor((Date.now() - ms) / 60000);
  if(diffMin < 2) return tr('seen_now');
  if(diffMin < 60) return tr('seen_min', { n: diffMin });
  const d = new Date(ms);
  const today = new Date(); today.setHours(0,0,0,0);
  const dayDiff = Math.round((today - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  if(dayDiff === 0) return tr('seen_today', { time: formatClock(ms) });
  if(dayDiff === 1) return tr('seen_yesterday', { time: formatClock(ms) });
  return tr('seen_date', { date: `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}` });
}

let pairCodeTimer = null;
function hidePairCode(){
  if(pairCodeTimer){ clearInterval(pairCodeTimer); pairCodeTimer = null; }
  document.getElementById('cloud-code-box').style.display = 'none';
}
function showPairCode(){
  const btn = document.getElementById('cloud-show-code-btn');
  btn.disabled = true;
  setCloudStatus(tr('generating_code'));
  ensureHouse()
    .then(houseId => createPairCode(houseId))
    .then(code => {
      updateCloudStatus();
      const link = `${location.origin}${location.pathname}?parear=${code}`;
      document.getElementById('cloud-code').textContent = `${code.slice(0,3)} ${code.slice(3)}`;
      const qrEl = document.getElementById('cloud-qr');
      qrEl.innerHTML = '';
      if(typeof QRCode !== 'undefined') new QRCode(qrEl, { text: link, width: 180, height: 180 });
      qrEl.style.display = (typeof QRCode !== 'undefined') ? '' : 'none';
      document.getElementById('cloud-code-box').style.display = '';

      const hintEl = document.getElementById('cloud-code-hint');
      const expiresAt = Date.now() + PAIR_CODE_TTL_MS;
      if(pairCodeTimer) clearInterval(pairCodeTimer);
      const tick = () => {
        const left = Math.max(0, Math.round((expiresAt - Date.now()) / 1000));
        hintEl.textContent = tr('code_hint', { time: `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`, link });
        if(left <= 0){ hidePairCode(); setCloudStatus(tr('code_expired')); }
      };
      pairCodeTimer = setInterval(tick, 1000);
      tick();
    })
    .catch(() => setCloudStatus(tr('code_failed')))
    .then(() => { btn.disabled = false; });
}

let lastJoinError = '';
function joinWithCode(rawCode){
  const code = String(rawCode || '').replace(/\D/g, '');
  const fail = (title, text) => {
    lastJoinError = `❌ ${title} ${text}`;
    setCloudStatus(`❌ ${title}`);
    showCloudBanner('error', `❌ ${title}`, text);
    return false;
  };
  const invalidCode = () => fail(tr('invalid_code_title'), tr('new_code_hint'));
  if(code.length !== 6) return Promise.resolve(fail(tr('incomplete_code_title'), tr('incomplete_code_hint')));
  hideCloudBanner();
  setCloudStatus(tr('connecting'));
  let houseId;
  return getIdToken()
    .then(() => cloudFetch(`pairCodes/${code}`))
    .then(pc => {
      if(!pc || !pc.houseId || pc.expiresAt < Date.now()) return invalidCode();
      houseId = pc.houseId;
      // The rules only accept this while the code is valid for that house.
      return cloudFetch(`houses/${houseId}/members/${getUid()}`, { method: 'PUT', body: JSON.stringify(newMemberRecord({ code })) })
        .then(() => cloudFetch(`houses/${houseId}`))
        .then(house => {
          if(!house || !house.data || !house.data.config){
            return fail(tr('config_not_found_title'), tr('new_code_hint'));
          }
          const previous = getHouseId();
          if(previous && previous !== houseId){
            // Leave the previous group so it doesn't list this device forever.
            cloudFetch(`houses/${previous}/members/${getUid()}`, { method: 'DELETE' }).catch(() => {});
          }
          stopHouseSync();
          hidePairCode();
          lsSet(HOUSE_ID_KEY, houseId);
          logCloudEvent(tr('log_joined', { code }));
          knownMemberIds = null;
          applyRemoteHouse(house); // joining is explicit, so apply even with the settings screen open
          pendingRemoteHouse = null;
          if(settingsOverlay.style.display === 'flex') populateDraftFromCurrentConfig();
          startHouseSync();
          updateCloudStatus();
          renderDevices(house);
          // The QR link may open inside the camera/Lens app instead of the usual browser, and each
          // browser is a separate device here — so tell the user how to connect the usual one too.
          showCloudBanner('ok', tr('joined_title'),
            tr('joined_text', { code: `${code.slice(0,3)} ${code.slice(3)}`, time: formatClock(pc.expiresAt) }) + ' ',
            buildDeviceNameEditor());
          return true;
        });
    })
    .catch(err => (err && err.status === 401) ? invalidCode() : fail(tr('connect_failed_title'), tr('check_internet')));
}

}

// Deletes everything the family has in the database (audios, today's progress,
// the config, then every device, this one last) and disconnects. The routine
// stays on this device; the other devices keep theirs and lose the connection.
function deleteCloudData(){
  appConfirm(tr('cloud_delete_q'), tr('cloud_delete_yes')).then(ok => {
    const houseId = getHouseId();
    const uid = getUid();
    if(!ok || !houseId) return;
    setCloudStatus(tr('cloud_deleting'));
    stopHouseSync();
    const del = path => cloudFetch(path, { method: 'DELETE' });
    Promise.all(AUDIOS.map(a => del(`audio/${houseId}/${a.id}`).catch(() => {})))
      .then(() => del(`houses/${houseId}/progress`))
      .then(() => del(`houses/${houseId}/data`))
      .then(() => cloudFetch(`houses/${houseId}/members`))
      .then(members => Promise.all(Object.keys(members || {}).filter(id => id !== uid).map(id => del(`houses/${houseId}/members/${id}`))))
      .then(() => del(`houses/${houseId}/members/${uid}`))
      .then(() => {
        logCloudEvent(tr('log_cloud_deleted'));
        AUDIOS.forEach(a => { const rec = getAudioRecord(a.id); if(rec) storeAudioLocal(a.id, Object.assign({}, rec, { up: false })); });
        forgetHouse();
        return appAlert(tr('cloud_deleted'));
      }, () => {
        startHouseSync();
        updateCloudStatus();
        return appAlert(tr('cloud_delete_failed'));
      });
  });
}

function initCloudSync(){
  if(!cloudEnabled()) return;
  document.getElementById('cloud-sync').style.display = '';
  if(lsGet(LEGACY_HOUSE_ID_KEY)){
    lsSet(LEGACY_HOUSE_ID_KEY, null);
    legacyPairingNotice = !getHouseId();
  }
  updateCloudStatus();
  renderCloudLog();
  // Note app opens only when the version or the pairing state changed, so
  // routine auto-reloads don't flood the history.
  const openSignature = `${RUNNING_VERSION}|${getHouseId() ? 'on' : 'off'}`;
  if(lsGet('rotinaCloudLogLastOpen_v1') !== openSignature){
    lsSet('rotinaCloudLogLastOpen_v1', openSignature);
    logCloudEvent(tr('log_opened', { version: RUNNING_VERSION, state: getHouseId() ? tr('state_in_group') : tr('state_no_group') }));
  }
  startHouseSync();
  touchLastSeen();
  setInterval(touchLastSeen, LAST_SEEN_INTERVAL_MS);
  setInterval(refreshFromCloud, 5 * 60 * 1000); // safety net in case the live stream silently drops
  // Without a working live stream (unsupported or dead), check more often and try to reopen it.
  setInterval(() => {
    if(!houseStream || houseStream.readyState === 2) startHouseSync();
    else if(houseStream.readyState !== 1) refreshFromCloud();
  }, 30 * 1000);
  // Phones drop the live stream silently in the background (screen off, other app) and
  // throttle timers there, so resync as soon as the app is back in front or back online.
  let lastResync = 0;
  const resyncNow = () => {
    if(document.visibilityState === 'hidden' || Date.now() - lastResync < 2000) return;
    lastResync = Date.now();
    startHouseSync();
  };
  document.addEventListener('visibilitychange', resyncNow);
  window.addEventListener('online', resyncNow);
  window.addEventListener('pageshow', (e) => { if(e.persisted) resyncNow(); });

  // Opened from the pairing QR code/link: join right away and show the result.
  const params = new URLSearchParams(location.search);
  const code = params.get('parear');
  if(code){
    params.delete('parear');
    const query = params.toString();
    history.replaceState(null, '', location.pathname + (query ? '?' + query : '') + location.hash);
    openSettings();
    joinWithCode(code);
  }
}

// ---------- App updates ----------
// Every 10 minutes (and when the app comes back to the foreground) fetch the
// published index.html with a unique URL — bypassing the browser/CDN caches —
// and compare its "Versão do código" stamp with the one running. When newer,
// show a banner, and reload by itself at the next safe moment (no task
// running, no settings screen, dialog or welcome screen open).
const RUNNING_VERSION = (document.querySelector('meta[name="app-version"]').content.match(/\d{4}-\d{2}-\d{2} \d{2}:\d{2}/) || [''])[0];
let updateAvailable = false;
let lastUpdateCheck = 0;
function freshAppUrl(){ return location.pathname + '?_cb=' + Date.now(); }
function reloadFresh(){ location.replace(freshAppUrl()); }
function checkForUpdate(){
  if(location.protocol === 'file:' || !RUNNING_VERSION || updateAvailable) return;
  lastUpdateCheck = Date.now();
  fetch(freshAppUrl(), { cache: 'no-store' })
    .then(r => r.ok ? r.text() : '')
    .then(html => {
      const m = html.match(/Versão do código: (\d{4}-\d{2}-\d{2} \d{2}:\d{2})/);
      if(m && m[1] > RUNNING_VERSION){
        updateAvailable = true;
        document.getElementById('update-banner').style.display = 'flex';
      }
    })
    .catch(() => {});
}
function isQuietForReload(){
  return settingsOverlay.style.display !== 'flex'
    && document.getElementById('welcome-overlay').style.display !== 'flex'
    && document.getElementById('tvsetup-overlay').style.display !== 'flex'
    && document.getElementById('guide-overlay').style.display !== 'flex'
    && document.getElementById('app-dialog-overlay').style.display !== 'flex';
}
document.getElementById('update-now-btn').addEventListener('click', reloadFresh);
setTimeout(checkForUpdate, 60 * 1000);
setInterval(checkForUpdate, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && Date.now() - lastUpdateCheck > 60 * 1000) checkForUpdate();
});

const TV_BRANDS = ['googletv', 'samsung', 'lg', 'firetv', 'other'];
function renderBrandGuide(container){
  container.innerHTML = '';
  const tabs = document.createElement('div');
  tabs.className = 'brand-tabs';
  const body = document.createElement('div');
  body.className = 'brand-body';
  const show = (brand) => {
    tabs.querySelectorAll('.brand-tab').forEach(b => b.classList.toggle('selected', b.dataset.brand === brand));
    body.innerHTML = (brand === 'googletv' ? `<p class="settings-hint" style="margin:0 0 0.8vh;">${tr('brand_googletv_models')}</p>` : '')
      + tr(`brand_${brand}_steps`)
      + (brand !== 'other' ? `<p class="brand-remote">${tr(`brand_${brand}_remote`)}</p>` : '')
      + `<p class="settings-hint" style="margin:0.8vh 0 0;">${tr('brand_note')}</p>`;
  };
  TV_BRANDS.forEach(brand => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'brand-tab';
    b.dataset.brand = brand;
    b.textContent = tr(`brand_${brand}`);
    b.addEventListener('click', () => show(brand));
    tabs.appendChild(b);
  });
  container.appendChild(tabs);
  container.appendChild(body);
  show(TV_BRANDS[0]);
}
