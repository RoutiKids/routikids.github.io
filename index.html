}
function showPairCode(){
  const btn = document.getElementById('cloud-show-code-btn');
  btn.disabled = true;
  setCloudStatus(tr('generating_code'));
  ensureHouse()
    .then(houseId => createPairCode(houseId))
    .then(code => {
      updateCloudStatus();
      const link = `${location.origin}${location.pathname}?parear=${code}`;
      document.getElementById('cloud-code').textContent = `${code.slice(0,3)} ${code.slice(3)}`;
      const qrEl = document.getElementById('cloud-qr');
      qrEl.innerHTML = '';
      if(typeof QRCode !== 'undefined') new QRCode(qrEl, { text: link, width: 180, height: 180 });
      qrEl.style.display = (typeof QRCode !== 'undefined') ? '' : 'none';
      document.getElementById('cloud-code-box').style.display = '';

      const hintEl = document.getElementById('cloud-code-hint');
      const expiresAt = Date.now() + PAIR_CODE_TTL_MS;
      if(pairCodeTimer) clearInterval(pairCodeTimer);
      const tick = () => {
        const left = Math.max(0, Math.round((expiresAt - Date.now()) / 1000));
        hintEl.textContent = tr('code_hint', { time: `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`, link });
        if(left <= 0){ hidePairCode(); setCloudStatus(tr('code_expired')); }
      };
      pairCodeTimer = setInterval(tick, 1000);
      tick();
    })
    .catch(() => setCloudStatus(tr('code_failed')))
    .then(() => { btn.disabled = false; });
}

function joinWithCode(rawCode){
  const code = String(rawCode || '').replace(/\D/g, '');
  const fail = (title, text) => {
    setCloudStatus(`❌ ${title}`);
    showCloudBanner('error', `❌ ${title}`, text);
    return false;
  };
  const invalidCode = () => fail(tr('invalid_code_title'), tr('new_code_hint'));
  if(code.length !== 6) return Promise.resolve(fail(tr('incomplete_code_title'), tr('incomplete_code_hint')));
  hideCloudBanner();
  setCloudStatus(tr('connecting'));
  let houseId;
  return getIdToken()
    .then(() => cloudFetch(`pairCodes/${code}`))
    .then(pc => {
      if(!pc || !pc.houseId || pc.expiresAt < Date.now()) return invalidCode();
      houseId = pc.houseId;
      // The rules only accept this while the code is valid for that house.
      return cloudFetch(`houses/${houseId}/members/${getUid()}`, { method: 'PUT', body: JSON.stringify(newMemberRecord({ code })) })
        .then(() => cloudFetch(`houses/${houseId}`))
        .then(house => {
          if(!house || !house.data || !house.data.config){
            return fail(tr('config_not_found_title'), tr('new_code_hint'));
          }
          const previous = getHouseId();
          if(previous && previous !== houseId){
            // Leave the previous group so it doesn't list this device forever.
            cloudFetch(`houses/${previous}/members/${getUid()}`, { method: 'DELETE' }).catch(() => {});
          }
          stopHouseSync();
          hidePairCode();
          lsSet(HOUSE_ID_KEY, houseId);
          logCloudEvent(tr('log_joined', { code }));
          knownMemberIds = null;
          applyRemoteHouse(house); // joining is explicit, so apply even with the settings screen open
          pendingRemoteHouse = null;
          if(settingsOverlay.style.display === 'flex') populateDraftFromCurrentConfig();
          startHouseSync();
          updateCloudStatus();
          renderDevices(house);
          // The QR link may open inside the camera/Lens app instead of the usual browser, and each
          // browser is a separate device here — so tell the user how to connect the usual one too.
          showCloudBanner('ok', tr('joined_title'),
            tr('joined_text', { code: `${code.slice(0,3)} ${code.slice(3)}`, time: formatClock(pc.expiresAt) }) + ' ',
            buildDeviceNameEditor());
          return true;
        });
    })
    .catch(err => (err && err.status === 401) ? invalidCode() : fail(tr('connect_failed_title'), tr('check_internet')));
}

function disconnectHouse(){
  appConfirm(tr('disconnect_q'), tr('disconnect_btn'))
    .then(ok => { if(ok) leaveHouse(); });
}
function leaveHouse(){
  logCloudEvent(tr('log_disconnected'));
  const houseId = getHouseId();
  const uid = getUid();
  if(houseId && uid) cloudFetch(`houses/${houseId}/members/${uid}`, { method: 'DELETE' }).catch(() => {});
  stopHouseSync();
  hidePairCode();
  lsSet(HOUSE_ID_KEY, null);
  lsSet(HOUSE_REV_KEY, null);
  knownMemberIds = null;
  updateCloudStatus();
}

document.getElementById('cloud-show-code-btn').addEventListener('click', showPairCode);
document.getElementById('cloud-join-btn').addEventListener('click', () => {
  joinWithCode(document.getElementById('cloud-code-input').value);
});
document.getElementById('cloud-disconnect-btn').addEventListener('click', disconnectHouse);
document.getElementById('cloud-remove-others-btn').addEventListener('click', () => {
  removeMembers(Object.keys(lastMembers).filter(id => id !== getUid()));
});
document.getElementById('cloud-name-editor').appendChild(buildDeviceNameEditor());

function initCloudSync(){
  if(!cloudEnabled()) return;
  document.getElementById('cloud-sync').style.display = '';
  if(lsGet(LEGACY_HOUSE_ID_KEY)){
    lsSet(LEGACY_HOUSE_ID_KEY, null);
    legacyPairingNotice = !getHouseId();
  }
  updateCloudStatus();
  renderCloudLog();
  // Note app opens only when the version or the pairing state changed, so
  // routine auto-reloads don't flood the history.
  const openSignature = `${RUNNING_VERSION}|${getHouseId() ? 'on' : 'off'}`;
  if(lsGet('rotinaCloudLogLastOpen_v1') !== openSignature){
    lsSet('rotinaCloudLogLastOpen_v1', openSignature);
    logCloudEvent(tr('log_opened', { version: RUNNING_VERSION, state: getHouseId() ? tr('state_in_group') : tr('state_no_group') }));
  }
  startHouseSync();
  touchLastSeen();
  setInterval(touchLastSeen, LAST_SEEN_INTERVAL_MS);
  setInterval(refreshFromCloud, 5 * 60 * 1000); // safety net in case the live stream silently drops
  // Without a working live stream (unsupported or dead), check more often and try to reopen it.
  setInterval(() => {
    if(!houseStream || houseStream.readyState === 2) startHouseSync();
    else if(houseStream.readyState !== 1) refreshFromCloud();
  }, 30 * 1000);
  // Phones drop the live stream silently in the background (screen off, other app) and
  // throttle timers there, so resync as soon as the app is back in front or back online.
  let lastResync = 0;
  const resyncNow = () => {
    if(document.visibilityState === 'hidden' || Date.now() - lastResync < 2000) return;
    lastResync = Date.now();
    startHouseSync();
  };
  document.addEventListener('visibilitychange', resyncNow);
  window.addEventListener('online', resyncNow);
  window.addEventListener('pageshow', (e) => { if(e.persisted) resyncNow(); });

  // Opened from the pairing QR code/link: join right away and show the result.
  const params = new URLSearchParams(location.search);
  const code = params.get('parear');
  if(code){
    params.delete('parear');
    const query = params.toString();
    history.replaceState(null, '', location.pathname + (query ? '?' + query : '') + location.hash);
    openSettings();
    joinWithCode(code);
  }
}

// ---------- App updates ----------
// Every 10 minutes (and when the app comes back to the foreground) fetch the
// published index.html with a unique URL — bypassing the browser/CDN caches —
// and compare its "Versão do código" stamp with the one running. When newer,
// show a banner, and reload by itself at the next safe moment (no task
// running, no settings screen, dialog or welcome screen open).
const RUNNING_VERSION = (document.querySelector('meta[name="app-version"]').content.match(/\d{4}-\d{2}-\d{2} \d{2}:\d{2}/) || [''])[0];
let updateAvailable = false;
let lastUpdateCheck = 0;
function freshAppUrl(){ return location.pathname + '?_cb=' + Date.now(); }
function reloadFresh(){ location.replace(freshAppUrl()); }
function checkForUpdate(){
  if(location.protocol === 'file:' || !RUNNING_VERSION || updateAvailable) return;
  lastUpdateCheck = Date.now();
  fetch(freshAppUrl(), { cache: 'no-store' })
    .then(r => r.ok ? r.text() : '')
    .then(html => {
      const m = html.match(/Versão do código: (\d{4}-\d{2}-\d{2} \d{2}:\d{2})/);
      if(m && m[1] > RUNNING_VERSION){
        updateAvailable = true;
        document.getElementById('update-banner').style.display = 'flex';
      }
    })
    .catch(() => {});
}
function isQuietForReload(){
  return settingsOverlay.style.display !== 'flex'
    && document.getElementById('welcome-overlay').style.display !== 'flex'
    && document.getElementById('app-dialog-overlay').style.display !== 'flex';
}
document.getElementById('update-now-btn').addEventListener('click', reloadFresh);
setTimeout(checkForUpdate, 60 * 1000);
setInterval(checkForUpdate, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && Date.now() - lastUpdateCheck > 60 * 1000) checkForUpdate();
});

// ---------- First use: welcome screen with templates ----------
function renderWelcomeTemplates(){
  const defaults = ['morning', 'bedtime'];
  const options = ROUTINE_TEMPLATES.map(t =>
    `<label><input type="checkbox" value="${t.key}"${defaults.includes(t.key) ? ' checked' : ''}> ${t.icon} ${t.label} <span class="days">${t.daysLabel}</span></label>`);
  options.push(`<label><input type="checkbox" value="blank"> ${tr('welcome_blank')} <span class="days">${tr('welcome_blank_hint')}</span></label>`);
  document.getElementById('welcome-templates').innerHTML = options.join('');
}
function hideWelcome(){ document.getElementById('welcome-overlay').style.display = 'none'; }
function showWelcome(){
  renderWelcomeTemplates();
  document.getElementById('welcome-overlay').style.display = 'flex';
  document.getElementById('welcome-start-btn').focus();
}
document.getElementById('welcome-start-btn').addEventListener('click', () => {
  const keys = [...document.querySelectorAll('#welcome-templates input:checked')].map(i => i.value);
  const templates = keys.map(k => k === 'blank' ? BLANK_TEMPLATE : ROUTINE_TEMPLATES.find(t => t.key === k)).filter(Boolean);
  if(!templates.length) templates.push(BLANK_TEMPLATE);
  const nickname = document.getElementById('welcome-child-name').value.trim().slice(0, 30);
  applyImportedConfig(buildConfigFromTemplates(templates, nickname));
  hideWelcome();
});
document.getElementById('welcome-connect-btn').addEventListener('click', () => {
  hideWelcome();
  openSettings();
  document.getElementById('cloud-code-input').focus();
});
// First use = nothing saved on this device and not paired. Not shown when opened from a pairing QR link.
function maybeShowWelcome(){
  if(stored || (cloudEnabled() && getHouseId())) return;
  if(new URLSearchParams(location.search).get('parear')) return;
  showWelcome();
}

// Now that everything (DOM, functions, settings screen) exists, build the
// actual routine from the configuration saved in this browser (or the
// default, if it's the first time).
initSchedule(TASKS);
maybeShowWelcome();
initCloudSync();

function safeRender(){
  try{ render(); }catch(e){ /* never let the loop hang because of a one-off error */ }
}
safeRender();
setInterval(safeRender, 1000);
</script>
