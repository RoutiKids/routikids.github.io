<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
// Moving from the old address: the page left there forwards this device's
// saved data (routine, pairing, identity, language) in the URL fragment,
// which is never sent to any server. Import it once — unless this address
// already has its own data — and drop it from the URL.
(function(){
  const m = location.hash.match(/^#migrate=([A-Za-z0-9_-]+)/);
  if(!m) return;
  try{
    const json = decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))));
    const data = JSON.parse(json);
    const hasOwnData = localStorage.getItem('rotinaConfig_v2') || localStorage.getItem('rotinaHouseId_v2');
    if(!hasOwnData){
      Object.keys(data).forEach(k => {
        if(/^rotina/.test(k) && typeof data[k] === 'string') localStorage.setItem(k, data[k]);
      });
    }
  }catch(e){}
  history.replaceState(null, '', location.pathname + location.search);
})();

// Always force fetching the newest version from the server: if the URL lacks
// our cache-busting parameter, redirect to itself with a unique value, which
// forces the browser to ignore any cached copy (on the TV or GitHub Pages)
// and download the actual latest file.
(function(){
  // Only enable this redirect on the real published site (github.io) —
  // anywhere else (Claude preview, file opened locally, etc.) it is harmless,
  // so it doesn't break those other ways of viewing the page.
  if(location.hostname.endsWith('github.io') && !location.search.includes('_cb=')){
    // Keep any existing query params (e.g. ?parear=CODE from the pairing QR code) and hash.
    const sep = location.search ? '&' : '?';
    location.replace(location.pathname + location.search + sep + '_cb=' + Date.now() + location.hash);
  }
})();
</script>

<style>

  /* ---- Utility buttons (test / reset time) ---- */

  /* ---- "Tap to turn on the sound" balloon, above the sound button ---- */

    right:2.5vw;

    display:none;
    align-items:center;
    gap:0.4vw;
  }
  #sound-prompt-btn{
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size:clamp(16px, 1.3vw, 28px);

    background:var(--coral);
    border:none;
    border-radius:999px;
    padding:1.2vh 1.4vw;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(29,53,87,0.25);
    animation:soundPromptPulse 1.6s ease-in-out infinite;
  }
  #sound-prompt-close{
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size:clamp(16px, 1.2vw, 26px);

    height:2.2em;
    border-radius:50%;

  }
  #sound-prompt-btn:focus, #sound-prompt-close:focus{ outline:4px solid var(--sun); outline-offset:2px; }
  @keyframes soundPromptPulse{ 0%, 100%{ transform:scale(1); } 50%{ transform:scale(1.04); } }
  @media (prefers-reduced-motion: reduce){ #sound-prompt-btn{ animation:none; } }

  /* ---- Footer: current clock + deadline (next to the sound button) ---- */
  #bottom-info{
    position:fixed;
    bottom:2.5vh;
    right:9.5vw;
    z-index:500;
    display:flex;
    align-items:center;
    gap:1.2vw;
  }
  #clock{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.8vw;
    color:var(--sky);
    background:rgba(255,255,255,0.85);
    border-radius:16px;
    padding:0.8vh 1vw;
  }
  /* The routine's expected end, in the footer where the deadline used to be. The
     deadline is part of the routine's settings and is no longer shown on screen. */
  #limit-control{ display:none !important; }
  #forecast{
    display:flex;
    align-items:center;
    gap:0.6vw;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.9vw;
    color:var(--navy);
    background:rgba(255,255,255,0.85);
    border-radius:16px;
    padding:0.8vh 1vw;
  }
  #forecast:empty{ display:none; }
  #forecast .limit-title{ font-family:'Nunito', sans-serif; font-weight:700; font-size:0.95vw; }
  #forecast .t-orig{ font-size:0.7em; }
  /* Times that moved from the plan: new time in red (later) or green (earlier), the planned one in brackets */

  .t-early{ color:#1b7f4b; font-weight:800; }
  .t-orig{ opacity:0.7; font-weight:600; }
  .kid-forecast .t-late, .kid-forecast .t-early{ background:white; border-radius:999px; padding:0 0.35em; }
  #skip-task-btn, .kid-skip, #postpone-task-btn, .kid-postpone{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(14px, 1.1vw, 24px);
    background:rgba(29,53,87,0.1);
    color:var(--navy);
    border:none;
    border-radius:14px;
    padding:0.6vh 1.2vw;
    margin-top:1vh;
    cursor:pointer;
    display:none;
  }
  #skip-task-btn, #postpone-task-btn{ margin-left:0.4vw; margin-right:0.4vw; }
  .kid-skip, .kid-postpone{ font-size:calc(var(--w) * 0.026); padding:0.4vh calc(var(--w) * 0.025); margin-top:0.6vh; }
  #skip-task-btn:focus, .kid-skip:focus, #postpone-task-btn:focus, .kid-postpone:focus, .skip-btn:focus{ outline:4px solid var(--sun); outline-offset:2px; }
  .skip-btn{
    font-size:clamp(14px, 1.2vw, 26px);
    background:rgba(29,53,87,0.08);
    border:none;
    border-radius:10px;
    padding:0.4vh 0.6vw;
    cursor:pointer;
    flex-shrink:0;
  }

  .pictures-only .step .skip-btn:not(.restore){ display:none; } /* a child can't skip, but a parent can undo */
  .task-extra-btns{ display:flex; flex-wrap:wrap; justify-content:center; gap:0.4vw; }
  .step.skip-planned{ opacity:0.45 !important; }
  .step.skip-planned .name{ text-decoration:line-through; }
  #limit-control{
    display:flex;
    align-items:center;
    gap:0.6vw;
    background:rgba(255,255,255,0.85);
    border-radius:16px;
    padding:0.8vh 1vw;
  }
  #limit-control .limit-title{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:0.9vw;
    color:var(--navy);
    margin-right:0.3vw;
  }
  .limit-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.2vh;
  }
  .limit-value{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.3vw;
    color:var(--navy);
    min-width:2.2vw;
    text-align:center;
  }
  .limit-colon{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.3vw;
    color:var(--navy);
    align-self:center;
  }
  .limit-btn{
    width:1.8vw;
    height:1.8vw;
    min-width:20px;
    min-height:20px;
    border-radius:6px;
    border:none;
    background:rgba(29,53,87,0.1);
    color:var(--navy);
    font-weight:800;
    font-size:0.9vw;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #limit-control.read-only .limit-btn{ visibility:hidden; }
  .limit-btn:focus{
    outline:4px solid var(--sun);
    outline-offset:2px;
  }

  /* ---- Main layout ---- */
  main{
    flex:1;
    display:grid;
    grid-template-columns: 1.4fr 1fr;
    gap:3vw;
    min-height:0;
  }

  /* ---- Current task hero ---- */
  #hero{
    background:var(--card);
    border-radius:32px;
    padding:2.5vh 2.5vw;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    box-shadow:0 12px 0 rgba(29,53,87,0.08);
    position:relative;
    transition: background 0.6s ease;
    overflow-y:auto;
    scrollbar-width:none;
  }
  #hero::-webkit-scrollbar{ display:none; }
  #hero.done{ background:var(--mint); color:white; }
  #hero-emoji{
    font-size:7.5vw;
    line-height:1;
    margin-bottom:1vh;
  }
  #hero-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:3.4vw;
    margin-bottom:1vh;
  }
  #hero-sub{
    font-size:1.4vw;
    opacity:0.75;
    margin-bottom:1.5vh;
  }

  #minutes-left{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:5vw;
    color:var(--coral);
    line-height:1;
  }
  #hero.done #minutes-left{ color:white; }
  #minutes-left .unit{
    font-size:1.4vw;
    font-weight:700;
    margin-left:0.5vw;
  }
  #segments{
    display:flex;
    gap:0.5vw;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:1.2vh;
    max-width:100%;
  }
  .seg{
    width:3vw;
    height:3vw;
    min-width:26px;
    min-height:26px;
    border-radius:9px;
    background:rgba(29,53,87,0.12);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.1vw;
    color:var(--navy);
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }
  .seg .fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    background:var(--sun);
    transition:width 0.3s linear;
  }
  .seg span{ position:relative; z-index:1; }
  .seg.complete{ background:var(--mint); color:white; }
  .seg.complete .fill{ display:none; }
  .seg.overtime{ background:rgba(255,107,107,0.18); }
  .seg.overtime .fill{ background:var(--coral); }
  .seg.overtime.complete{ background:var(--coral); color:white; }
  #hero.done .seg{ background:rgba(255,255,255,0.3); color:white; }

  /* "I'm done" is a box to tick next to the minutes, as in the children's columns
     (.kid-finish styles); --w sizes it like a column. */
  #minutes-row{ display:flex; align-items:center; justify-content:center; gap:3vw; }
  #hero{ --w:clamp(300px, 34vw, 720px); }
  #hero.done #finish-early-btn{ display:none; }
  #start-next-btn{
    display:none;
    margin-top:1.8vh;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.6vw;
    background:var(--sky);
    color:white;
    border:none;
    border-radius:18px;
    padding:1.6vh 2.6vw;
    cursor:pointer;
    box-shadow:0 6px 0 rgba(29,53,87,0.15);
    -webkit-tap-highlight-color: transparent;
    flex-shrink:0;
  }
  #start-next-btn:focus{
    outline:5px solid var(--sun);
    outline-offset:2px;
  }

  #browse-controls{
    display:none;
    gap:1.5vw;
    margin-top:1.8vh;
  }
  #browse-controls button{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.6vw;
    background:rgba(29,53,87,0.1);
    color:var(--navy);
    border:none;
    border-radius:14px;
    padding:1.2vh 1.8vw;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #browse-controls button:disabled{ opacity:0.3; cursor:default; }
  #browse-controls button:focus{
    outline:5px solid var(--sun);
    outline-offset:2px;
  }

  /* ---- Timeline ---- */
  #timeline{
    display:flex;
    flex-direction:column;
    gap:1vh;
    overflow-y:auto;
    scrollbar-width:none;
  }
  #timeline::-webkit-scrollbar{ display:none; }
  .step{
    background:var(--card);
    border-radius:18px;
    padding:1.1vh 1.4vw;
    display:flex;
    align-items:center;
    gap:1vw;
    opacity:0.55;
    transform:scale(0.97);
    transition: all 0.4s ease;
    border-left:8px solid transparent;
    flex-shrink:0;
  }
  .step .emoji{ font-size:2.6vw; }
  .step .info{ flex:1; min-width:0; }
  .step .name{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.5vw;
  }
  .step .time{
    font-size:1.05vw;
    color:#6b7a90;
  }
  .step.active{
    opacity:1;
    transform:scale(1.03);
    border-left-color:var(--coral);
    box-shadow:0 6px 0 rgba(29,53,87,0.08);
  }
  .step.finished{
    opacity:0.9;
    border-left-color:var(--mint);
  }
  .step.finished .name{ text-decoration: line-through; text-decoration-color:var(--mint); }
  .check{
    font-size:1.8vw;
    color:var(--mint);
    flex-shrink:0;
  }
  .outcome-badge{
    font-size:1.8vw;
    flex-shrink:0;
  }
  .outcome-badge.star{
    font-size:3vw;
    filter: drop-shadow(0 0 6px rgba(255,193,69,0.7));
    animation: star-pop 0.5s ease;
  }
  @keyframes star-pop{
    0%{ transform:scale(0); }
    60%{ transform:scale(1.3); }
    100%{ transform:scale(1); }
  }

  /* ---- "Pictures only" list (children who can't read yet) ---- */
  .pictures-only{ flex-direction:row !important; flex-wrap:wrap; align-content:flex-start; }
  .pictures-only .timeline-title{ width:100%; }
  .pictures-only .step{ flex-direction:column; gap:0.3vh; padding:1vh 1.2vw; }
  .pictures-only .step .info, .pictures-only .step .reorder-controls{ display:none; }
  .pictures-only .step .emoji{ font-size:4vw; }

  /* ---- Several children: one column each (sizes follow the column, --w) ---- */
  #kids-grid{ display:none; }
  body.multi main{ display:none; }
  body.multi #kids-grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(var(--n), 1fr);
    gap:1.2vw;
    min-height:0;
  }
  body.multi header h1{ font-size:2vw; }
  /* One child: the screen takes the child's colour, as a column does with several children */
  html.solo, html.solo body{ background:var(--c); background:color-mix(in srgb, var(--c) 65%, white); }
  html.solo #hero{ background:color-mix(in srgb, var(--c) 18%, white); }
  html.solo #hero.done{ background:var(--mint); }
  html.solo .step{ background:color-mix(in srgb, var(--c) 10%, white); opacity:0.85; }
  html.solo .step.active{ opacity:1; border-left-color:var(--c); box-shadow:0 0 0 0.3vh var(--c); }
  html.solo .step.finished{ opacity:1; }
  body.multi #limit-control, body.multi #forecast{ display:none; }
  /* Clock, expected end and sound sit at the top right (one child or several), so
     nothing covers the task list at the bottom of the screen. */
  #bottom-info{ top:1.2vh; bottom:auto; right:1.5vw; }
  #bottom-info #sound-toggle{ position:static; width:3.2vw; height:3.2vw; min-width:40px; min-height:40px; font-size:1.5vw; }
  #fullscreen-btn{ position:static; }
  #sound-prompt{ top:calc(2vh + max(3.2vw, 40px)); bottom:auto; right:1.5vw; }
  body:not(.multi) header h1{ font-size:2.2vw; }
  .kid-panel{
    --w:600px;
    display:flex;
    flex-direction:column;
    background:var(--c);
    background:color-mix(in srgb, var(--c) 65%, white);
    border-radius:1.4vw;
    border:0.4vh solid var(--c);
    overflow:hidden;
    padding:0 1vw 1.2vh;
    min-height:0;
    min-width:0;
    box-shadow:0 0.6vh 0 rgba(29,53,87,0.08);
  }
  .kid-head{
    display:flex;
    align-items:center;
    gap:calc(var(--w) * 0.015);
    margin:0 -1vw 1.2vh;
    padding:0.8vh 1vw;
    background:var(--c);
    color:white;
  }
  .kid-avatar{ font-size:calc(var(--w) * 0.06); line-height:1; }
  .kid-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:calc(var(--w) * 0.05);
    line-height:1;
  }
  .kid-deadline{ margin-left:auto; font-family:'Baloo 2', sans-serif; font-weight:800; font-size:calc(var(--w) * 0.038); white-space:nowrap; }
  .kid-deadline .t-orig{ font-size:0.75em; }
  .kid-panel.light-color .kid-head{ color:var(--navy); } /* white on yellow is hard to read */
  .kid-hero{
    display:grid;
    grid-template-columns:auto 1fr;
    align-items:center;
    gap:calc(var(--w) * 0.03);
    background:white;
    background:color-mix(in srgb, var(--c) 18%, white);
    border-radius:1.2vw;
    box-shadow:0 0.5vh 0 rgba(29,53,87,0.12);
    padding:1.6vh calc(var(--w) * 0.03);
    transition:background 0.6s ease;
  }
  .kid-hero.done{ background:var(--mint); color:white; }
  .kid-emoji{ font-size:calc(var(--w) * 0.24); line-height:1; }
  .kid-info{ display:flex; flex-direction:column; align-items:flex-start; min-width:0; }
  .kid-label{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:calc(var(--w) * 0.065); line-height:1.05; }
  .kid-sub{ font-size:calc(var(--w) * 0.026); opacity:0.75; margin-top:0.3vh; }
  .kid-minutes{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:calc(var(--w) * 0.12); line-height:1; color:var(--coral); }
  .kid-minutes .unit{ font-size:calc(var(--w) * 0.03); margin-left:0.3vw; }
  .kid-hero.done .kid-minutes{ color:white; }
  /* The minute blocks: a full-width row, as big as fits (--segs = how many), never tiny */
  .kid-segments{ grid-column:1 / -1; display:flex; flex-wrap:wrap; justify-content:center; gap:calc(var(--w) * 0.01); margin-top:0.4vh; }
  .kid-segments:empty{ display:none; }
  .kid-segments .seg{
    --size:max(calc(var(--w) * 0.055), min(calc(var(--w) * 0.09), calc(var(--w) * 0.78 / var(--segs, 10))));
    width:var(--size);
    height:var(--size);
    min-width:0;
    min-height:0;
    border-radius:calc(var(--size) * 0.22);
    font-size:calc(var(--size) * 0.42);
  }
  .kid-hero.done .seg{ background:rgba(255,255,255,0.3); color:white; }
  .kid-finish, .kid-start{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:calc(var(--w) * 0.032);
    color:white;
    background:var(--mint);
    border:none;
    border-radius:999px;
    padding:0.6vh calc(var(--w) * 0.03);
    margin-top:0.6vh;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(29,53,87,0.15);
  }
  .kid-start{ display:none; background:var(--sky); }
  .kid-row{ display:flex; align-items:center; gap:calc(var(--w) * 0.04); }
  /* "I'm done" as a box to tick next to the minutes (saves a line) */
  .kid-row{ gap:calc(var(--w) * 0.08); }
  .kid-finish{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.4vh;
    padding:0;
    margin-top:0;
    background:none;
    box-shadow:none;
    color:var(--navy);
    flex-shrink:0;
  }
  .kid-box{
    width:calc(var(--w) * 0.11);
    height:calc(var(--w) * 0.11);
    border:calc(var(--w) * 0.012) solid var(--c);
    border-radius:calc(var(--w) * 0.022);
    background:white;
    box-shadow:0 4px 0 rgba(29,53,87,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:calc(var(--w) * 0.075);
    line-height:1;
    color:white;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .kid-finish:hover .kid-box, .kid-finish:focus .kid-box{ transform:scale(1.06); }
  .kid-finish.checked .kid-box{ background:var(--mint); border-color:var(--mint); transform:scale(1.12); }
  .kid-finish.checked .kid-box::after{ content:'✔'; }
  .kid-finish-label{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:calc(var(--w) * 0.03); line-height:1; }
  .kid-finish:focus{ outline:none; }
  .kid-finish:focus .kid-box{ outline:4px solid var(--sun); outline-offset:3px; }
  .kid-browse{ display:none; gap:calc(var(--w) * 0.02); margin-top:0.8vh; }
  .kid-browse button{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:calc(var(--w) * 0.035);
    background:rgba(29,53,87,0.1);
    color:var(--navy);
    border:none;
    border-radius:12px;
    padding:0.5vh calc(var(--w) * 0.03);
    cursor:pointer;
  }
  .kid-browse button:disabled{ opacity:0.3; cursor:default; }
  .kid-browse button:focus{ outline:4px solid var(--sun); outline-offset:2px; }
  .kid-hero.done .kid-browse button{ background:rgba(255,255,255,0.3); color:white; }
  .kid-finish:focus, .kid-start:focus{ outline:4px solid var(--sun); outline-offset:2px; }
  .kid-hero.done .kid-finish{ display:none; }
  .kid-timeline{ position:relative; flex:1; display:flex; flex-direction:column; gap:0.8vh; overflow-y:auto; scrollbar-width:none; margin-top:1.2vh; min-height:0; }
  .kid-timeline::-webkit-scrollbar{ display:none; }
  .kid-timeline .timeline-title{ font-size:calc(var(--w) * 0.03); padding:0; color:var(--navy); }
  .kid-timeline .step{ background:white; background:color-mix(in srgb, var(--c) 10%, white); opacity:0.85; }
  .kid-timeline .step.active, .kid-timeline .step.finished{ opacity:1; }
  .kid-timeline .step{ padding:0.8vh calc(var(--w) * 0.02); gap:calc(var(--w) * 0.02); border-radius:0.9vw; transform:none; }
  .kid-timeline .step.active{ border-left-color:var(--c); transform:none; box-shadow:0 0 0 0.3vh var(--c); }
  .kid-timeline .step .emoji{ font-size:calc(var(--w) * 0.06); }
  .kid-timeline .step .name{ font-size:calc(var(--w) * 0.034); }
  .kid-timeline .step .time{ font-size:calc(var(--w) * 0.026); }
  .kid-timeline .check{ font-size:calc(var(--w) * 0.035); }
  .kid-timeline .outcome-badge{ font-size:calc(var(--w) * 0.035); }
  .kid-timeline .outcome-badge.star{ font-size:calc(var(--w) * 0.05); }
  .kid-timeline .reorder-controls{ display:none; }
  .kid-timeline .step.collapsed{ display:none !important; }
  .kid-trail{ display:flex; flex-wrap:wrap; gap:calc(var(--w) * 0.015); }
  .kid-trail:empty{ display:none; }
  .trail-item{
    display:flex;
    align-items:center;
    gap:2px;
    font-size:calc(var(--w) * 0.045);
    background:white;
    border-radius:999px;
    padding:0.2vh calc(var(--w) * 0.015);
    opacity:0.85;
  }
  .trail-item small{ font-size:0.6em; }
  .kid-timeline.pictures-only .step .emoji{ font-size:calc(var(--w) * 0.1); }

  /* ---- Extra time: the runner; finished late: the late icon pops ---- */
  .runner{
    position:fixed;
    left:0;
    display:flex;
    align-items:center;
    font-size:var(--size);
    line-height:1;
    animation:runner-dash 2.6s ease-in-out forwards;
    pointer-events:none;
  }
  .runner-dust{ font-size:0.6em; margin-right:-0.15em; opacity:0.8; }
  .runner-figure{ display:inline-block; transform:scaleX(-1); } /* these emojis face left: make them run right */
  .runner-figure.rocket{ transform:rotate(45deg); }
  @keyframes runner-dash{
    0%{ transform:translateX(var(--from)); opacity:0; }
    10%{ opacity:1; }
    45%{ transform:translateX(calc((var(--from) + var(--to)) / 2)) translateY(-10px); }
    90%{ opacity:1; }
    100%{ transform:translateX(var(--to)); opacity:0; }
  }
  .done-pop{
    position:fixed;
    font-size:28vw;
    line-height:1;
    transform:translate(-50%, -50%) scale(0);
    animation:done-pop 3.2s ease forwards;
    pointer-events:none;
    z-index:5;
  }
  @keyframes done-pop{
    0%{ transform:translate(-50%, -50%) scale(0) rotate(-20deg); opacity:0; }
    20%{ transform:translate(-50%, -50%) scale(1.15) rotate(8deg); opacity:1; }
    32%{ transform:translate(-50%, -50%) scale(1) rotate(0); }
    80%{ opacity:1; }
    100%{ transform:translate(-50%, -60%) scale(0.95); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .done-pop{ animation-duration:0.01s; } }
  .late-pop{
    position:fixed;
    font-size:9vw;
    transform:translate(-50%, -50%) scale(0);
    animation:late-pop 1.8s ease forwards;
    pointer-events:none;
  }
  @keyframes late-pop{
    0%{ transform:translate(-50%, -50%) scale(0); opacity:0; }
    25%{ transform:translate(-50%, -50%) scale(1.15); opacity:1; }
    40%{ transform:translate(-50%, -50%) scale(1); }
    80%{ opacity:1; }
    100%{ transform:translate(-50%, -60%) scale(0.9); opacity:0; }
  }

  /* ---- Celebration / encouragement ---- */
  #celebration-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:700;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    top:45%;
    animation: confetti-rise 1.7s ease-out forwards;
  }
  @keyframes confetti-rise{
    0%{ transform:translateY(0) scale(0.5) rotate(0deg); opacity:0; }
    15%{ opacity:1; }
    100%{ transform:translateY(-32vh) scale(1.3) rotate(25deg); opacity:0; }
  }
  .balloon{
    position:absolute;
    bottom:-12vh;
    width:4.5vw;
    height:5.5vw;
    min-width:36px;
    min-height:44px;
    border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
    animation: balloon-rise 3.6s ease-in forwards;
  }
  .balloon::after{
    content:'';
    position:absolute;
    left:50%;
    bottom:-2.5vh;
    width:1px;
    height:2.5vh;
    background:rgba(29,53,87,0.35);
  }
  @keyframes balloon-rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:1; }
    100%{ transform:translateY(-125vh) translateX(var(--drift, 10px)); opacity:0; }
  }
  /* ---- Reorder arrows (only on tasks not done yet) ---- */
  .reorder-controls{
    display:flex;
    flex-direction:column;
    gap:0.4vh;
    flex-shrink:0;
  }
  .reorder-btn{
    width:2.4vw;
    height:2.4vw;
    min-width:24px;
    min-height:24px;
    border-radius:8px;
    border:none;
    background:rgba(29,53,87,0.08);
    color:var(--navy);
    font-size:1.2vw;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .reorder-btn:disabled{ opacity:0.25; cursor:default; }
  .reorder-btn:focus{
    outline:4px solid var(--sun);
    outline-offset:1px;
  }

  /* ---- Sound on/off button ---- */
  #sound-toggle{
    position:fixed;
    bottom:2.5vh;

  /* ---- Phones and other narrow or short screens ----
     The TV layout (two columns, fixed footer, sizes in vw) gets cramped and
     overlaps on a phone. Here everything stacks in one scrolling column:
     buttons, title, a bar with clock + deadline + sound button, the current
     task card, then the list. */
  @media (orientation: portrait), (max-width: 700px), (max-height: 500px){

      height:auto;
      min-height:100vh;

    main{

      flex-direction:column;
      gap:16px;
      flex:none;

    #hero-emoji{ font-size:72px; }
    #hero-label{ font-size:28px; }
    #hero-sub{ font-size:16px; }
    #minutes-left{ font-size:56px; }
    #minutes-left .unit{ font-size:18px; margin-left:4px; }
    #segments{ gap:6px; }
    .seg{ width:34px; height:34px; font-size:13px; border-radius:8px; }
    #start-next-btn{ font-size:18px; padding:12px 22px; }
    #hero{ --w:440px; }
    #minutes-row{ gap:28px; }
    #browse-controls{ gap:12px; }
    #browse-controls button{ font-size:20px; padding:10px 22px; }
    #timeline{ overflow:visible; gap:8px; }
    .timeline-title{ font-size:18px; padding:0 4px; }
    #forecast{ font-size:22px; padding:6px 12px; gap:6px; }
    #forecast .limit-title{ font-size:14px; }
    .step{ padding:10px 12px; gap:12px; border-radius:14px; }
    .step .emoji{ font-size:30px; }
    .step .name{ font-size:18px; }
    .step .time{ font-size:14px; }
    .check{ font-size:22px; }
    .outcome-badge{ font-size:22px; }
    .outcome-badge.star{ font-size:28px; }
    .reorder-controls{ gap:4px; }
    .reorder-btn{ width:34px; height:30px; font-size:14px; }
    #fullscreen-btn{ position:static; }
    #sound-prompt{ right:12px; left:12px; bottom:12px; justify-content:center; }
    body.multi #kids-grid{ order:4; display:flex; flex-direction:column; gap:14px; flex:none; }
    #bottom-info{ top:auto; right:auto; }
    #bottom-info #sound-toggle{ width:52px; height:52px; font-size:22px; }
    #sound-prompt{ top:auto; bottom:12px; right:12px; }
    body.multi header h1{ font-size:22px; }
    body:not(.multi) header h1{ font-size:24px; }
    .kid-panel{ border-radius:18px; padding:12px; }
    .kid-hero{ border-radius:14px; }
    #sound-toggle{ position:static; width:52px; height:52px; min-width:52px; min-height:52px; font-size:22px; }

    /* Settings screen: readable sizes instead of vw-based ones (16px inputs also avoid iOS zoom) */
    #settings-overlay, #welcome-overlay, #tvsetup-overlay, #guide-overlay{ padding:8px; }
    .brand-body{ padding:8px 12px; }
    .brand-remote{ padding:6px 8px; }
    .settings-card{ padding:18px 14px; max-height:94vh; border-radius:18px; }

    .settings-text-input, .settings-time-input, .settings-select{ font-size:16px; padding:8px 10px; }
    .settings-card .util-btn{ font-size:14px; padding:8px 14px; }
    .settings-hint{ font-size:13px; }
    #sync-section, #routines-section, #backup-section, #children-section, #audio-section{ padding:12px; }
    #sync-section h3, #routines-section h3, #backup-section h3, #children-section h3, #audio-section h3, #routine-tasks-heading{ font-size:18px; }
    .step-size-btn{ font-size:14px; padding:6px 12px; }
    #autolink-row{ font-size:14px; }
    #autolink-row input{ width:20px; height:20px; }
    .routine-tab, #routine-add-btn, #routine-delete-btn{ font-size:14px; padding:6px 12px; }
    #routine-icon-picker button, .emoji-picker button{ font-size:20px; padding:4px 6px; }
    #week-matrix{ font-size:13px; }
    #week-matrix input[type="checkbox"]{ width:22px; height:22px; }
    #conflict-warning{ font-size:13px; padding:8px 10px; }
    .apply-all-days-btn{ font-size:12px; padding:3px 8px; }
    .task-row{ padding:12px 10px; }
    .task-row .emoji-preview{ font-size:26px; width:40px; height:40px; }
    .task-time-group{ font-size:14px; gap:6px; }
    .time-stepper .time-value{ font-size:16px; min-width:44px; }
    .time-step-btn{ width:32px; height:26px; font-size:12px; }
    .task-row .remove-task-btn{ width:34px; height:34px; }

    .settings-add-btn{ font-size:16px; padding:10px 18px; }
    .settings-btn{ font-size:17px; padding:10px 20px; }
    #app-version{ font-size:11px !important; }
    #cloud-sync .settings-label{ font-size:14px; }
    .lang-picker{ justify-content:flex-start; gap:6px; }
    .lang-btn{ padding:5px 10px; }
  }
</style>

<body>

<div id="util-buttons">
  <button id="config-btn" class="util-btn" data-i18n="btn_config" data-i18n-title="btn_config_title" style="background:#B983FF;"></button>

</div>
<div id="bottom-info">

  <div id="forecast"></div>
  <div id="limit-control">
    <span class="limit-title" data-i18n="deadline"></span>
    <div class="limit-unit">

      <button id="limit-hour-minus" class="limit-btn">▼</button>
    </div>
    <span class="limit-colon">:</span>
    <div class="limit-unit">
      <button id="limit-min-plus" class="limit-btn">▲</button>
      <span class="limit-value" id="limit-min">--</span>
      <button id="limit-min-minus" class="limit-btn">▼</button>
    </div>
  </div>
  <!-- Fixed to the bottom-right corner on the TV; part of this bar on phones -->
  <button id="sound-toggle" data-i18n-title="sound_title">🔊</button>
</div>
<div id="celebration-layer"></div>

<header>
  <h1 id="page-title"></h1>
</header>

<main>
  <div id="hero">
    <div id="hero-emoji">⏰</div>
    <div id="hero-label" data-i18n="loading"></div>
    <div id="hero-sub"></div>

    sound_prompt: "🔊 Toque aqui para ativar o som",
    guide_why_html: "<p>Rotina faz bem às crianças: saber o que vem agora e depois traz segurança, diminui as brigas nas transições e ajuda a ganhar autonomia. Mas os quadros de papel na parede costumam ser esquecidos depois de algumas semanas, porque são parados, não mostram o tempo passando e dão trabalho para mudar.</p><p>A ideia do Routikids é usar o <strong>lado bom da TV</strong>: ela já está no centro da casa, é grande e prende a atenção da criança. Em vez de desenho, ela mostra a rotina: viva, mudando ao longo do dia, fácil de ajustar.</p><p>💛 Ajuda qualquer criança a <strong>começar a ter noção de tempo</strong>, de ordem e de prioridades. E é um apoio visual especialmente útil para crianças que precisam de mais estrutura, como muitas crianças com TDAH.</p>",

    brand_note: "Os nomes dos menus podem variar conforme o modelo da TV.",
    guide_title: "📖 Guia rápido",
    guide_what_title: "O que é o Routikids?",
    guide_what_html: "<p>O Routikids é um <strong>quadro de rotina, como os de parede, só que digital e na TV</strong>. Ele acompanha o dia sozinho e mostra à criança o que fazer agora e o que vem depois.</p><ul><li>⏳ A tarefa da vez aparece grande, com os <strong>minutos que faltam em blocos coloridos</strong> que vão sumindo: a criança <em>vê</em> o tempo passar.</li><li>📋 A lista ao lado mostra o que já foi feito e o que vem depois.</li><li>🔄 A rotina muda sozinha conforme a hora e o dia: manhã, tarde, hora de dormir, fim de semana.</li><li>✔ Ao terminar uma tarefa, toque em <strong>\"Já terminei\"</strong>. Vocês decidem se quem toca é a criança ou um adulto. Se o tempo acabar antes, o app pergunta se a tarefa foi concluída.</li><li>🎉 Tarefa no tempo = comemoração; atrasou = um incentivo carinhoso.</li><li>📱 Os pais configuram tarefas, horários e dias <strong>pelo celular</strong>, e a TV se atualiza sozinha.</li></ul>",
    guide_tv_title: "Como levar para a TV",
    guide_tv_html: "<ol><li>Configure a rotina no celular (os modelos prontos ajudam).</li><li>Na TV, abra o navegador e digite <strong>{url}</strong>.</li><li>Na tela de boas-vindas da TV, digite o código que aparece no celular em ⚙️ Configurar → \"📺 Levar para a TV\".</li></ol>",
    guide_tips_title: "Dicas",
    guide_tips_html: "<ul><li>🔊 <strong>Som:</strong> o navegador só libera o som depois de um toque. Na TV, toque no aviso \"Toque aqui para ativar o som\" (ou no botão 🔇).</li><li>🖥️ <strong>Tela cheia:</strong> o botão \"Tela cheia\" esconde a barra do navegador. Depois de uma atualização do app, pode ser preciso tocar nele de novo.</li><li>⭐ <strong>Favoritos:</strong> salve o endereço nos favoritos do navegador da TV para abrir direto nas próximas vezes.</li><li>🌙 <strong>Tela sempre ligada:</strong> o app pede para a tela não apagar enquanto está aberto. Se mesmo assim a TV escurecer ou mostrar fotos depois de alguns minutos, desative ou aumente o tempo do protetor de tela nas configurações da TV.</li><li>🧪 <strong>Teste:</strong> \"Testar agora\" roda a rotina na hora, com tarefas de 1 minuto, em todos os aparelhos conectados; \"Sair do teste\" volta ao dia real, sem perder o que já foi feito.</li></ul>",
    guide_privacy_title: "Privacidade",
    guide_privacy_html: "<p>Use só um apelido para a criança. As rotinas ficam salvas no aparelho e, se você conectar outros aparelhos, num servidor usado só para sincronizá-los. Em ⚙️ Configurar você vê e remove os aparelhos conectados.</p>",
    welcome_note: "⚠️ <strong>Versão de teste.</strong> Este app ainda está em fase de testes. Para proteger sua família, <strong>use apenas um apelido</strong> para a criança, nada de nome completo, escola ou endereço. As rotinas ficam salvas neste aparelho e, se você conectar outros aparelhos, num servidor usado só para sincronizá-los.",

    sound_prompt: "🔊 Tap here to turn on the sound",
    guide_why_html: "<p>Routines are good for kids: knowing what comes now and next gives them security, means fewer fights at transitions and helps them become independent. But paper charts on the wall are often forgotten after a few weeks, because they are static, don't show time passing and are a hassle to change.</p><p>The idea behind Routikids is to use the <strong>good side of the TV</strong>: it is already at the centre of the home, it is big and it catches your child's attention. Instead of cartoons, it shows the routine: alive, changing through the day, easy to adjust.</p><p>💛 It helps any child <strong>start to get a sense of time</strong>, order and priorities. And it is a particularly useful visual aid for children who need more structure, such as many children with ADHD.</p>",

    brand_note: "Menu names may vary by TV model.",
    guide_title: "📖 Quick guide",
    guide_what_title: "What is Routikids?",
    guide_what_html: "<p>Routikids is a <strong>routine chart like the ones on the wall, only digital and on the TV</strong>. It follows the day by itself and shows your child what to do now and what comes next.</p><ul><li>⏳ The current task is shown big, with the <strong>minutes left as colourful blocks</strong> that disappear one by one: your child <em>sees</em> time passing.</li><li>📋 The list next to it shows what is done and what comes next.</li><li>🔄 The routine changes by itself with the time and the day: morning, afternoon, bedtime, weekend.</li><li>✔ When a task is finished, tap <strong>\"I'm done\"</strong>. You decide whether your child or an adult does the tapping. If time runs out first, the app asks whether the task was finished.</li><li>🎉 On time = a celebration; late = a gentle encouragement.</li><li>📱 Parents set up tasks, times and days <strong>on the phone</strong>, and the TV updates by itself.</li></ul>",
    guide_tv_title: "How to put it on the TV",
    guide_tv_html: "<ol><li>Set up the routine on your phone (the ready-made templates help).</li><li>On the TV, open the browser and type <strong>{url}</strong>.</li><li>On the TV's welcome screen, type the code shown on your phone under ⚙️ Settings → \"📺 Put it on the TV\".</li></ol>",
    guide_tips_title: "Tips",
    guide_tips_html: "<ul><li>🔊 <strong>Sound:</strong> browsers only allow sound after a tap. On the TV, press the \"Tap here to turn on the sound\" notice (or the 🔇 button).</li><li>🖥️ <strong>Full screen:</strong> the \"Full screen\" button hides the browser bar. After an app update you may need to press it again.</li><li>⭐ <strong>Bookmark:</strong> save the address in the TV browser's bookmarks to open it directly next time.</li><li>🌙 <strong>Screen always on:</strong> the app asks the screen to stay on while it is open. If the TV still dims or shows photos after a few minutes, turn off the screensaver or make its delay longer in the TV settings.</li><li>🧪 <strong>Test:</strong> \"Test now\" runs the routine right away, with 1-minute tasks, on all connected devices; \"Exit test\" goes back to the real day without losing what was done.</li></ul>",
    guide_privacy_title: "Privacy",
    guide_privacy_html: "<p>Use only a nickname for your child. Routines are stored on the device and, if you connect other devices, on a server used only to sync them. In ⚙️ Settings you can see and remove connected devices.</p>",

    sound_prompt: "🔊 Hier tippen, um den Ton einzuschalten",
    guide_why_html: "<p>Routinen tun Kindern gut: Zu wissen, was jetzt und danach kommt, gibt Sicherheit, sorgt für weniger Streit bei Übergängen und hilft, selbstständiger zu werden. Aber Papierpläne an der Wand geraten oft nach ein paar Wochen in Vergessenheit. Sie sind starr, zeigen nicht, wie die Zeit vergeht, und lassen sich nur mühsam ändern.</p><p>Die Idee von Routikids: die <strong>gute Seite des Fernsehers</strong> nutzen. Er steht schon mitten im Zuhause, ist groß und zieht die Aufmerksamkeit des Kindes auf sich. Statt Zeichentrick zeigt er die Routine: lebendig, im Lauf des Tages wechselnd, leicht anzupassen.</p><p>💛 Das hilft jedem Kind, <strong>ein Gefühl für Zeit</strong>, Reihenfolge und Prioritäten zu entwickeln. Und es ist eine besonders hilfreiche visuelle Stütze für Kinder, die mehr Struktur brauchen, wie viele Kinder mit ADHS.</p>",

    brand_googletv_steps: "<ol><li>Öffne auf dem Startbildschirm den <strong>Play Store</strong> (unter „Apps“).</li><li>Suche nach <strong>„TV Bro“</strong> (kostenloser Browser) und installiere ihn.</li><li>Öffne TV Bro und gib die Adresse oben in die Leiste ein.</li></ol>",

    brand_other_steps: "<ul><li>Suche auf dem Fernseher eine App namens <strong>„Browser“</strong>, <strong>„Internet“</strong> oder <strong>„Web“</strong> und gib dort die Adresse ein (z. B. Hisense, Panasonic).</li><li><strong>Roku</strong> (auch TCL-Fernseher mit Roku) hat keinen Browser: Nimm einen Chromecast, einen Fire TV Stick oder einen Laptop.</li><li>Kein Browser auf dem Fernseher? Verbinde einen <strong>Laptop per HDMI-Kabel</strong> mit dem Fernseher und öffne die Adresse dort im Vollbild.</li></ul>",
    brand_note: "Menünamen können je nach Fernsehermodell abweichen.",
    guide_title: "📖 Kurzanleitung",
    guide_what_title: "Was ist Routikids?",
    guide_what_html: "<p>Routikids ist ein <strong>Routineplan wie die an der Wand, nur digital und auf dem Fernseher</strong>. Er begleitet den Tag von selbst und zeigt dem Kind, was jetzt dran ist und was danach kommt.</p><ul><li>⏳ Die aktuelle Aufgabe wird groß angezeigt, die <strong>verbleibenden Minuten als bunte Kästchen</strong>, die nach und nach verschwinden: Das Kind <em>sieht</em>, wie die Zeit vergeht.</li><li>📋 Die Liste daneben zeigt, was schon erledigt ist und was als Nächstes kommt.</li><li>🔄 Die Routine wechselt von selbst mit Uhrzeit und Wochentag: Morgen, Nachmittag, Schlafenszeit, Wochenende.</li><li>✔ Ist eine Aufgabe erledigt, tippe auf <strong>„Fertig!“</strong>. Ihr entscheidet, ob das Kind oder ein Erwachsener tippt. Läuft die Zeit vorher ab, fragt die App, ob die Aufgabe erledigt wurde.</li><li>🎉 Pünktlich = Feier; zu spät = eine liebe Ermutigung.</li><li>📱 Eltern stellen Aufgaben, Zeiten und Tage <strong>auf dem Handy</strong> ein, und der Fernseher aktualisiert sich von selbst.</li></ul>",
    guide_tv_title: "So kommt es auf den Fernseher",
    guide_tv_html: "<ol><li>Richte die Routine auf dem Handy ein (die fertigen Vorlagen helfen).</li><li>Öffne auf dem Fernseher den Browser und gib <strong>{url}</strong> ein.</li><li>Gib auf dem Willkommensbildschirm des Fernsehers den Code ein, den das Handy unter ⚙️ Einstellungen → „📺 Auf den Fernseher bringen“ anzeigt.</li></ol>",
    guide_tips_title: "Tipps",
    guide_tips_html: "<ul><li>🔊 <strong>Ton:</strong> Browser erlauben Ton erst nach einem Tippen. Drücke auf dem Fernseher auf den Hinweis „Hier tippen, um den Ton einzuschalten“ (oder auf die 🔇-Taste).</li><li>🖥️ <strong>Vollbild:</strong> Die Taste „Vollbild“ blendet die Browserleiste aus. Nach einem App-Update musst du sie eventuell erneut drücken.</li><li>⭐ <strong>Lesezeichen:</strong> Speichere die Adresse als Lesezeichen im Browser des Fernsehers, um sie beim nächsten Mal direkt zu öffnen.</li><li>🌙 <strong>Bildschirm bleibt an:</strong> Die App bittet darum, dass der Bildschirm an bleibt, solange sie geöffnet ist. Wird der Fernseher trotzdem nach ein paar Minuten dunkel oder zeigt Fotos, schalte den Bildschirmschoner in den Einstellungen des Fernsehers aus oder verlängere die Zeit.</li><li>🧪 <strong>Test:</strong> „Jetzt testen“ lässt die Routine sofort mit 1-Minuten-Aufgaben auf allen verbundenen Geräten laufen; „Test beenden“ kehrt zum echten Tag zurück, ohne Erledigtes zu verlieren.</li></ul>",

function detectLang(){
  let saved = null;
  try{ saved = localStorage.getItem(LANG_KEY); }catch(e){}
  if(saved && I18N[saved]) return saved;
  let hasRoutine = false;
  try{ hasRoutine = !!(localStorage.getItem('rotinaConfig_v2') || localStorage.getItem('rotinaConfig_v1')); }catch(e){}
  if(hasRoutine) return 'pt';
  const prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
  for(const p of prefs){
    const code = String(p).slice(0, 2).toLowerCase();
    if(I18N[code]) return code;
  }
  return 'en';
}

  if(vars && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
  return s;
}

  for(let i = pointer; i < tasks.length; i++){
    const prev = i > 0 ? tasks[i-1] : null;
    const start = (i === pointer && overrideCursor !== undefined) ? cursor : nextStartAfter(prev, tasks[i], cursor);
    tasks[i].startMin = start;
    tasks[i].endMin = start + tasks[i].baseDurationMin;
    cursor = tasks[i].endMin;
  }
}


// (Re)build the whole routine from a configuration — used on initial load
// and whenever the user saves new settings on the "Configure" screen.
function nowInMinutes(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60;
}

// If the page is opened (or the routine reloaded) after some task's time
// has already passed, silently advance to the actual current task —
// no confirmation dialog or sound, one by one, retroactively.
function catchUpToNow(){
  const nowMin = nowInMinutes();
  while(pointer < tasks.length && nowMin >= tasks[pointer].endMin){
    tasks[pointer].outcome = 'skipped';
    pointer++;
    recomputeUpcoming();
  }
}

// Builds today's schedule from the config. Unless opts.fresh is set (new day,
// "Exit test"), today's progress so far (tasks done, their real times and
// outcomes, extensions, the current task) is kept: from the schedule on
// screen when the config changes, or from the saved copy after a reload.
// While a test runs (activeTestStartMin), today's tasks take 1 minute each,
// one after the other, from the moment "Test now" was pressed on any device.
function initSchedule(cfg, opts){
  const testStart = activeTestStartMin();
  const given = opts && opts.progress;
  const prev = given || ((opts && opts.fresh) ? null : previousDayProgress(testStart));
  const build = () => {
    const list = buildTasksFromConfig(cfg);
    if(testStart !== null){
      list.forEach((t, i) => {
        t.plannedStartMin = testStart + i;
        t.plannedDurationMin = 1;
        t.baseDurationMin = 1;
      });
    }
    return list;
  };
  PLANNED = cfg.map(t => ({ baseDurationMin: toMinutes(t.end) - toMinutes(t.start) }));
  dayStartMin = testStart !== null ? testStart : (cfg.length > 0 ? toMinutes(cfg[0].start) : 0);
  lastSegTaskIndex = -1;
  closeConfirm();
  testMode = testStart !== null;
  runningTestStart = testStart;
  scheduleDate = todayKey();
  currentLimitRoutineId = undefined; // force recomputing the deadline for the current routine
  let merged = false;
  if(prev){
    tasks = build();
    try{ merged = mergeDayProgress(prev, !!given); }catch(e){ merged = false; }
  }
  if(!merged){
    tasks = build();
    pointer = 0;
    awaitingStart = false;
    currentLimitRoutineId = undefined;
    recomputeUpcoming();
    catchUpToNow();
  }
  refreshLimitForCurrentRoutine();
  rebuildTimelineDOM();
  updateHeaderTitle();
  document.getElementById('reset-schedule-btn').style.display = testMode ? '' : 'none';
  saveDayState();
}

// Minute of the day the shared test started, or null when no test is running.
// A test only counts on the day it started and for at most 2 hours.
const TEST_MAX_MS = 2 * 60 * 60 * 1000;
function activeTestStartMin(){
  if(!TEST_STARTED_AT) return null;
  const started = new Date(TEST_STARTED_AT);
  const now = new Date();
  if(started.toDateString() !== now.toDateString() || now - started > TEST_MAX_MS || now < started - 60000) return null;
  return started.getHours() * 60 + started.getMinutes() + started.getSeconds() / 60;
}

// ---------- Today's progress (kept across config changes and reloads) ----------
const DAY_STATE_KEY = 'rotinaDayState_v2';        // { childId: snapshot }
const LEGACY_DAY_STATE_KEY = 'rotinaDayState_v1'; // single snapshot, from before children
function readDayStates(){
  let all = null;
  try{ all = JSON.parse(lsGet(DAY_STATE_KEY) || 'null'); }catch(e){}
  if(!all || typeof all !== 'object') all = {};
  if(!Object.keys(all).length){
    try{
      const legacy = JSON.parse(lsGet(LEGACY_DAY_STATE_KEY) || 'null');
      if(legacy && Array.isArray(legacy.tasks)) all[CHILDREN[0].id] = legacy;
    }catch(e){}
  }
  return all;
}
let testMode = false;     // "Test now" replaces the real times; its progress is only kept in memory
let runningTestStart = null;
let scheduleDate = null;  // day the schedule on screen belongs to
function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function snapshotDay(){
  return {
    child: ACTIVE_CHILD_ID, date: scheduleDate, test: runningTestStart, seq: progressSeq, pointer, awaitingStart, limitMin, limitRid: currentLimitRoutineId,
    tasks: tasks.map(t => ({
      name: t.name, routineId: t.routineId, plannedStartMin: t.plannedStartMin, plannedDurationMin: t.plannedDurationMin,
      baseDurationMin: t.baseDurationMin, redMin: t.redMin, outcome: t.outcome, startMin: t.startMin, endMin: t.endMin,
      userSkipped: t.userSkipped || undefined
    }))
  };
}
// The progress to carry over: the test on screen while the same test goes on;
// otherwise the real day, from the screen, or from the saved copy (after a
// reload, or when a test ends and the real day comes back).
function previousDayProgress(testStart){
  let prev = null;
  if(testStart !== null){
    if(tasks.length && testMode && runningTestStart === testStart) prev = snapshotDay();
  } else if(tasks.length && !testMode){
    prev = snapshotDay();
  } else {
    prev = readDayStates()[ACTIVE_CHILD_ID] || null;
    if(prev && prev.test !== undefined && prev.test !== null) prev = null;
  }
  if(!prev || prev.date !== todayKey() || !Array.isArray(prev.tasks)) return null;
  if(prev.seq > progressSeq) progressSeq = prev.seq;
  return prev;
}
// ---------- Sharing today's progress with the paired devices ----------
// A tap that changes the progress (I'm done, Start, the "Finished?" answer,
// reordering, the deadline) publishes this device's day to houses/<id>/progress;
// the other devices fit it onto their schedule with mergeDayProgress. Each
// child has its own entry, so progress on two children never overwrites each other. Automatic
// steps (the dialog's timeout, catching up) happen on every device by itself.
// Actions are numbered (the last number seen + 1) instead of timed, because
// device clocks differ by seconds; the highest number wins.
let progressSeq = 0;           // number of the last progress action applied here (local or remote)
let progressPublishTimer = null;
let progressBlocked = false;   // the database refused it (rules not updated yet): keep working locally
function progressAction(){
  progressSeq += 1;
  saveDayState(); // right away, so a reload a moment later can't lose it
  if(progressPublishTimer) clearTimeout(progressPublishTimer);
  const slot = currentSlot;
  progressPublishTimer = setTimeout(() => { if(SLOTS.includes(slot)) withChild(slot, publishProgress); }, 300);
}
function publishProgress(){
  progressPublishTimer = null;
  const houseId = getHouseId();
  if(!cloudEnabled() || !houseId || progressBlocked || !scheduleDate) return;
  const body = JSON.stringify({ state: JSON.stringify(snapshotDay()), seq: progressSeq, updatedAt: Date.now(), by: getUid() || '' });
  cloudFetch(`houses/${houseId}/progress/${encodeURIComponent(ACTIVE_CHILD_ID)}`, { method: 'PUT', body }).catch(err => {
    if(err && err.status === 401){ progressBlocked = true; logCloudEvent(tr('log_progress_blocked')); }
  });
}
function applyRemoteProgress(progress){
  if(!progress || typeof progress.state !== 'string' || progress.by === getUid()) return;
  // Newer action, or two devices acting at the same moment: the same device wins on both sides.
  const newer = progress.seq > progressSeq || (progress.seq === progressSeq && String(progress.by) > String(getUid()));
  if(!newer) return;
  let state;
  try{ state = JSON.parse(progress.state); }catch(e){ return; }
  if(!state || state.date !== todayKey() || !Array.isArray(state.tasks)) return;
  if((state.test === undefined ? null : state.test) !== runningTestStart) return; // the other device is in another test/real day
  const doneBefore = tasks.filter(t => t.outcome === 'onTime' || t.outcome === 'late').length;
  const pointerBefore = pointer;
  initSchedule(TASKS, { progress: state });
  progressSeq = progress.seq;
  saveDayState();
  // Show what happened on the other device: the celebration, and the next task's sound.
  const done = tasks.filter(t => t.outcome === 'onTime' || t.outcome === 'late');
  if(done.length > doneBefore){
    const last = done[done.length - 1];
    try{ if(last.outcome === 'onTime') celebrate(); else encourage(); }catch(e){}
  }
  if(pointer !== pointerBefore && !awaitingStart && pointer < tasks.length){
    try{ playForTask(tasks[pointer]); }catch(e){}
  }
  render();
}

let lastDayStateJson = '';
function saveDayState(){
  if(testMode || !scheduleDate) return;
  const snap = snapshotDay();
  const json = JSON.stringify(snap);
  if(json === lastDayStateJson) return;
  lastDayStateJson = json;
  const all = readDayStates();
  all[ACTIVE_CHILD_ID] = snap;
  Object.keys(all).forEach(id => { if(!CHILDREN.some(c => c.id === id)) delete all[id]; });
  lsSet(DAY_STATE_KEY, JSON.stringify(all));
  lsSet(LEGACY_DAY_STATE_KEY, null);
}

// Fits the progress in `prev` onto the freshly built `tasks`:
// - tasks already done keep their real times and outcome (a task removed from the config disappears);
// - the current task keeps its start and extensions, and the ones after it keep their order;
// - a new task planned before the current one counts as already passed; later ones join the upcoming list.
// Returns false when there is no progress worth keeping.
function mergeDayProgress(prev, force){
  const prevPointer = Math.min(prev.pointer || 0, prev.tasks.length);
  const prevCurrent = prev.tasks[prevPointer];
  const hasProgress = prevPointer > 0 || prev.awaitingStart || (prevCurrent && prevCurrent.redMin > 0) || prev.tasks.some(t => t.userSkipped);
  if(!hasProgress && !force) return false;

  // Match tasks by routine + name (+ repetition), or else by routine + planned start (a renamed task).
  const keysOf = list => {
    const seen = {};
    return list.map(t => { const k = `${t.routineId || ''}|${t.name}`; seen[k] = (seen[k] || 0) + 1; return `${k}#${seen[k]}`; });
  };
  const oldKeys = keysOf(prev.tasks);
  const freshKeys = keysOf(tasks);
  const used = new Set();
  const findFresh = (o, key) => {
    let i = freshKeys.indexOf(key);
    if(i < 0 || used.has(i)) i = tasks.findIndex((t, j) => !used.has(j) && t.routineId === o.routineId && t.plannedStartMin === o.plannedStartMin);
    if(i >= 0) used.add(i);
    return i;
  };

  const done = [];
  prev.tasks.slice(0, prevPointer).forEach((o, k) => {
    const i = findFresh(o, oldKeys[k]);
    if(i < 0) return;
    const t = tasks[i];
    Object.assign(t, { startMin: o.startMin, endMin: o.endMin, outcome: o.outcome, redMin: o.redMin, baseDurationMin: o.baseDurationMin, userSkipped: !!o.userSkipped });
    done.push(t);
  });
  const rest = [];
  prev.tasks.slice(prevPointer).forEach((o, k) => {
    const i = findFresh(o, oldKeys[prevPointer + k]);
    if(i < 0) return;
    const t = tasks[i];
    const isCurrent = k === 0;
    if(o.plannedDurationMin === t.plannedDurationMin){
      t.baseDurationMin = o.baseDurationMin;
      t.redMin = o.redMin;
    } else if(isCurrent){
      t.redMin = o.redMin;
      t.baseDurationMin = t.plannedDurationMin + o.redMin;
    }
    if(o.userSkipped){ t.userSkipped = true; t.baseDurationMin = 0; }
    rest.push({ t, old: o, isCurrent });
  });

  const currentKept = rest.length > 0 && rest[0].isCurrent;
  const anchor = rest.length ? rest[0].t.plannedStartMin : nowInMinutes();
  tasks.forEach((t, i) => {
    if(used.has(i)) return;
    if(t.plannedStartMin < anchor){
      t.outcome = 'skipped';
      t.startMin = t.plannedStartMin;
      t.endMin = t.plannedStartMin + t.baseDurationMin;
      const at = done.findIndex(d => d.startMin > t.startMin);
      done.splice(at < 0 ? done.length : at, 0, t);
    } else {
      const at = rest.findIndex((r, j) => (j > 0 || !currentKept) && r.t.plannedStartMin > t.plannedStartMin);
      rest.splice(at < 0 ? rest.length : at, 0, { t });
    }
  });

  tasks = done.concat(rest.map(r => r.t));
  pointer = done.length;
  if(currentKept){
    const t = tasks[pointer];
    t.startMin = rest[0].old.startMin;
    t.endMin = t.startMin + t.baseDurationMin;
    awaitingStart = !!prev.awaitingStart;
    cascadeAfterPointer();
    // Reopened long after the current task ended: move on, as a fresh load would.
    if(!awaitingStart && nowInMinutes() > t.endMin + 1) catchUpToNow();
  } else {
    awaitingStart = false;
    recomputeUpcoming();
    catchUpToNow();
  }
  if(pointer < tasks.length && prev.limitRid !== undefined && tasks[pointer].routineId === prev.limitRid){
    currentLimitRoutineId = prev.limitRid;
    limitMin = prev.limitMin;
  }
  return true;
}

// If the TV stays on past midnight, switch to the new day's routine automatically.
function checkDayRollover(){
  const idx = new Date().getDay();
  if(idx !== loadedDayIndex){
    loadedDayIndex = idx;
    TASKS = buildTodaysTasks();
    initSchedule(TASKS, { fresh: true });
  }
}

// Reload the page when a new version is published, but only at a safe moment
// (no child in the middle of a task), so no progress is lost. There is no
// periodic reload any more: each reload may make the browser hold the sound
// back until the next tap.
function maybeAutoRefresh(nowMin){
  // Safe only when no child is in the middle of a task.
  const isSafe = SLOTS.every(slot => withChild(slot, () => (pointer >= tasks.length) || (tasks[pointer] && nowMin < tasks[pointer].startMin)));
  if(isSafe && updateAvailable && isQuietForReload()) reloadFresh();
}

function fmt([h,m]){
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function fmtMin(min){
  const m = Math.round(min);
  return fmt([Math.floor(m/60), m%60]);
}

// The elements the day is drawn into. With one child they are the main
// screen's; with several, each child's column has its own set, swapped in by
// useView() while that child's day is handled (see "One day per child").
let heroEl = document.getElementById('hero');
let heroEmoji = document.getElementById('hero-emoji');
let heroLabel = document.getElementById('hero-label');
let heroSub = document.getElementById('hero-sub');
let minutesLeftEl = document.getElementById('minutes-left');
let segmentsEl = document.getElementById('segments');
let finishEarlyBtn = document.getElementById('finish-early-btn');
let skipBtn = document.getElementById('skip-task-btn');
let postponeBtn = document.getElementById('postpone-task-btn');
let forecastEl = document.getElementById('forecast');
let browseControlsEl = document.getElementById('browse-controls');
let browsePrevBtn = document.getElementById('browse-prev-btn');
let browseNextBtn = document.getElementById('browse-next-btn');

// Arrow navigation, by WHOLE routine (not task by task — today's tasks
// already show in the side list). browseDay = null (default screen) or
// a day offset from today (0 = today, 1 = tomorrow, ...);
// browseRoutineIdx = index of the routine "block" within that day
// (a day can have more than one routine).
let browseDay = null;
let browseRoutineIdx = null;

function tasksForBrowseDay(offset){
  return offset === 0 ? tasks : buildPreviewTasksForOffset(offset);
}
// Group a day's task list into blocks by routine (consecutive tasks
// of the same routine become a single block = one "page").
function routineBlocksForDay(offset){
  const list = tasksForBrowseDay(offset);
  const blocks = [];
  list.forEach((t, idx) => {
    const last = blocks[blocks.length - 1];
    if(last && last.routineId === t.routineId){
      last.endIdx = idx;
      last.endMin = t.endMin;
    } else {
      blocks.push({ routineId: t.routineId, startIdx: idx, endIdx: idx, startMin: t.startMin, endMin: t.endMin });
    }
  });
  return blocks;
}
// Find the next (or previous) day offset, starting at startOffset, that
// has at least 1 routine — skips days with nothing configured. Only looks
// up to 6 days ahead (never more than one full lap of the week).
function findDayWithTasks(startOffset, direction){
  for(let off = startOffset; off >= 0 && off <= 6; off += direction){
    if(tasksForBrowseDay(off).length > 0) return off;
  }
  return null;
}

function renderBrowsedTask(){
  const blocks = routineBlocksForDay(browseDay);
  const block = blocks[browseRoutineIdx];
  const list = tasksForBrowseDay(browseDay);
  const isToday = browseDay === 0;
  const isCompleted = isToday && block.endIdx < pointer;
  heroEl.classList.toggle('done', isCompleted);

  const r = ROUTINES.find(r => r.id === block.routineId);
  heroEmoji.textContent = r ? r.icon : '📋';
  heroLabel.textContent = r ? r.name : tr('routine_fallback');
  // The child's name in the title never disappears — only this card line changes
  const dayLabel = browseDay === 0 ? tr('today') : (browseDay === 1 ? tr('tomorrow') : `${WEEKDAY_FULL[(new Date().getDay()+browseDay)%7]}`);
  const taskCount = block.endIdx - block.startIdx + 1;

  if(isCompleted){
    const blockTasks = list.slice(block.startIdx, block.endIdx + 1);
    const anyLate = blockTasks.some(t => t.outcome === 'late');
    const outcomeTxt = anyLate ? ` ${LATE_ICON}` : ` ${ONTIME_ICON}`;
    heroSub.textContent = tr('completed_range', { from: fmtMin(block.startMin), to: fmtMin(block.endMin), n: taskCount }) + outcomeTxt;
  } else {
    heroSub.textContent = tr('day_range', { day: dayLabel, from: fmtMin(block.startMin), to: fmtMin(block.endMin), n: taskCount });
  }
  minutesLeftEl.innerHTML = '';
  segmentsEl.innerHTML = '';
  finishEarlyBtn.style.display = 'none';
  startNextBtn.style.display = 'none';
}

function browsePrev(){
  if(browseDay === null){
    if(pointer > 0){
      const blocks = routineBlocksForDay(0);
      const idx = blocks.findIndex(b => b.endIdx >= pointer - 1 && b.startIdx <= pointer - 1);
      browseDay = 0;
      browseRoutineIdx = idx !== -1 ? idx : blocks.length - 1;
    }
    render();
    return;
  }
  if(browseRoutineIdx > 0){
    browseRoutineIdx--;
  } else {
    const prevDay = findDayWithTasks(browseDay - 1, -1);
    if(prevDay !== null){
      browseDay = prevDay;
      browseRoutineIdx = routineBlocksForDay(prevDay).length - 1;
    } else if(browseDay === 0){
      browseDay = null; browseRoutineIdx = null; // back to the default screen
    }
  }
  render();
}
function browseNext(){
  if(browseDay === null){
    if(pointer < tasks.length){
      const blocks = routineBlocksForDay(0);
      const idx = blocks.findIndex(b => b.endIdx >= pointer);
      browseDay = 0;
      browseRoutineIdx = idx !== -1 ? idx : 0;
    } else {
      const nextDay = findDayWithTasks(1, 1);
      if(nextDay !== null){ browseDay = nextDay; browseRoutineIdx = 0; }
    }
    render();
    return;
  }
  const blocks = routineBlocksForDay(browseDay);
  if(browseRoutineIdx < blocks.length - 1){
    browseRoutineIdx++;
  } else {
    const nextDay = findDayWithTasks(browseDay + 1, 1);
    if(nextDay !== null){ browseDay = nextDay; browseRoutineIdx = 0; }
  }
  render();
}
browsePrevBtn.addEventListener('click', browsePrev);
browseNextBtn.addEventListener('click', browseNext);

let timelineEl = document.getElementById('timeline');
const clockEl = document.getElementById('clock');
let pageTitleEl = document.getElementById('page-title');
let panelEl = null; // the child's column (several children), or null (main screen)
function stepEl(i){ return timelineEl.querySelector(`.step[data-step="${i}"]`); }

function updateHeaderTitle(){
  // The child shown (not always the first one: the others may be hidden), with their picture.
  const child = activeChild();
  const icon = child.icon || '🌞';
  pageTitleEl.textContent = child.name ? tr('page_title_child', { name: child.name, icon }) : `${icon} ${APP_NAME}`;
}

// ---------- Forecast: when things will happen, given what happened so far ----------
// The tasks' times, or, while the next task waits for its "Start" past its
// time, those times moved on from now (the same way "Start" will move them).
function forecastTimes(){
  const out = tasks.map(t => ({ start: t.startMin, end: t.endMin }));
  if(!awaitingStart || pointer >= tasks.length) return out;
  let cursor = nowInMinutes();
  if(cursor <= tasks[pointer].startMin) return out;
  for(let i = pointer; i < tasks.length; i++){
    const start = i === pointer ? cursor : nextStartAfter(tasks[i - 1], tasks[i], cursor);
    out[i] = { start, end: start + tasks[i].baseDurationMin };
    cursor = out[i].end;
  }
  return out;
}
// A time (or range) that moved from the plan shows in red (later) or green
// (earlier), with the planned one in brackets.
function shiftedHtml(now, planned, later){
  if(now === planned) return now;
  return `<span class="${later ? 't-late' : 't-early'}">${now}</span> <span class="t-orig">(${planned})</span>`;
}
function timeShiftHtml(value, plannedValue){
  return shiftedHtml(fmtMin(value), fmtMin(plannedValue), value > plannedValue);
}
function stepTimeHtml(t, i, times){
  if(t.userSkipped) return tr('skipped_today');
  if(i < pointer) return `${fmtMin(t.startMin)} – ${fmtMin(t.endMin)}${t.redMin ? ` (+${t.redMin}min)` : ''}`;
  const { start, end } = times[i];
  const plannedEnd = t.plannedStartMin + t.plannedDurationMin;
  const later = Math.round(end) !== Math.round(plannedEnd) ? end > plannedEnd : start > t.plannedStartMin;
  const shortened = i >= pointer && t.baseDurationMin < t.plannedDurationMin ? ` <span title="${tr('shortened_title')}">✂️</span>` : '';
  return shiftedHtml(`${fmtMin(start)} – ${fmtMin(end)}`, `${fmtMin(t.plannedStartMin)} – ${fmtMin(plannedEnd)}`, later) + shortened;
}
function refreshStepTimes(){
  const times = forecastTimes();
  tasks.forEach((t, i) => {
    const el = stepEl(i);
    const timeEl = el && el.querySelector('.time');
    if(!timeEl) return;
    const html = stepTimeHtml(t, i, times);
    if(timeEl.dataset.h !== html){ timeEl.innerHTML = html; timeEl.dataset.h = html; }
  });
}

// ---------- Skipping a task (just for today) ----------
// A skipped task takes no time and gets no star or turtle (⏭️ in the list).
// The current one closes right away, like "I'm done"; a later one is marked
// and passed over when its turn comes. A later one can be brought back.
function passSkipped(){
  while(pointer < tasks.length && tasks[pointer].userSkipped){
    const t = tasks[pointer];
    t.outcome = 'skipped';
    t.baseDurationMin = 0;
    t.endMin = t.startMin;
    pointer++;
  }
  if(pointer >= tasks.length) awaitingStart = false;
}
function skipTask(idx){
  if(idx < pointer || idx >= tasks.length) return;
  const t = tasks[idx];
  const nowMin = nowInMinutes();
  t.userSkipped = true;
  if(idx === pointer && !awaitingStart && nowMin >= t.startMin){
    if(confirmState) closeConfirm();
    t.endMin = Math.max(t.startMin, Math.min(nowMin, t.endMin));
    t.outcome = 'skipped';
    pointer++;
    passSkipped();
    if(pointer < tasks.length) awaitingStart = true;
    else recomputeUpcoming();
  } else {
    t.baseDurationMin = 0;
    const running = pointer < tasks.length && idx > pointer && !awaitingStart && nowMin >= tasks[pointer].startMin;
    if(running) fitFlexibleTasks();
    else{ recomputeUpcoming(); passSkipped(); recomputeUpcoming(); }
  }
  lastSegTaskIndex = -1;
  rebuildTimelineDOM();
}
function unskipTask(idx){
  const t = tasks[idx];
  if(idx <= pointer || !t || !t.userSkipped) return;
  t.userSkipped = false;
  t.baseDurationMin = t.plannedDurationMin;
  const running = !awaitingStart && nowInMinutes() >= tasks[pointer].startMin;
  if(running) fitFlexibleTasks(); else recomputeUpcoming();
  rebuildTimelineDOM();
  progressAction();
  render();
}
// Asks first, so a stray tap (or a child) doesn't skip a task.
function askSkip(idx){
  const slot = currentSlot;
  const t = tasks[idx];
  if(!t || idx < pointer) return;
  appConfirm(tr('skip_q', { task: t.name }), tr('skip_yes')).then(ok => {
    if(!ok || !SLOTS.includes(slot)) return;
    withChild(slot, () => {
      const i = tasks.indexOf(t);
      if(i < pointer) return;
      skipTask(i);
      progressAction();
      render();
    });
  });
}
function onStepSkip(idx){
  const t = tasks[idx];
  if(!t) return;
  if(idx < pointer){ if(t.userSkipped) restoreSkipped(idx); return; }
  if(t.userSkipped) unskipTask(idx);
  else askSkip(idx);
}
function currentIsRunning(){
  return pointer < tasks.length && !awaitingStart && nowInMinutes() >= tasks[pointer].startMin;
}
// A task skipped earlier today comes back as the next one (right after the
// current task of its routine), or as the current one, waiting for "Start",
// when nothing of another routine is running.
function canRestore(idx){
  const t = tasks[idx];
  if(!t || !t.userSkipped || idx >= pointer) return false;
  if(pointer >= tasks.length) return true;
  return tasks[pointer].routineId === t.routineId || !currentIsRunning();
}
function restoreSkipped(idx){
  if(!canRestore(idx)) return;
  const [t] = tasks.splice(idx, 1);
  pointer--;
  Object.assign(t, { userSkipped: false, outcome: null, redMin: 0, baseDurationMin: t.plannedDurationMin, autoExtended: false, closedLate: false });
  const running = currentIsRunning();
  if(pointer < tasks.length && tasks[pointer].routineId === t.routineId && running){
    tasks.splice(pointer + 1, 0, t);
    fitFlexibleTasks();
  } else {
    if(confirmState) closeConfirm();
    tasks.splice(pointer, 0, t);
    awaitingStart = true;
    recomputeUpcoming();
  }
  lastSegTaskIndex = -1;
  rebuildTimelineDOM();
  progressAction();
  render();
}
// "Do it later": the current task goes to the end of its routine and the next
// one comes up (waiting for "Start"). It comes back when its turn comes.
function canPostpone(){
  if(pointer >= tasks.length) return false;
  const block = routineBlockAt(pointer);
  for(let i = pointer + 1; i <= block.endIdx; i++) if(!tasks[i].userSkipped) return true;
  return false;
}
function postponeTask(){
  if(!canPostpone()) return;
  if(confirmState) closeConfirm();
  const block = routineBlockAt(pointer);
  const [t] = tasks.splice(pointer, 1);
  Object.assign(t, { redMin: 0, baseDurationMin: t.plannedDurationMin, autoExtended: false, closedLate: false });
  tasks.splice(block.endIdx, 0, t);
  passSkipped();
  awaitingStart = pointer < tasks.length;
  recomputeUpcoming();
  lastSegTaskIndex = -1;
  rebuildTimelineDOM();
}
postponeBtn.addEventListener('click', () => { postponeTask(); progressAction(); render(); });
skipBtn.addEventListener('click', () => askSkip(pointer));

// ---------- Timeline construction (rebuilt whenever the order changes) ----------
function rebuildTimelineDOM(){
  const child = CHILDREN.find(c => c.id === ACTIVE_CHILD_ID);
  timelineEl.classList.toggle('pictures-only', !!(child && child.picturesOnly));
  timelineEl.innerHTML = `<div class="timeline-title"${timelineEl.id === 'timeline' ? ' id="timeline-title"' : ''}></div>`
    + (panelEl ? '<div class="kid-trail"></div>' : '');
  timelinePreviewKey = null;
  const times = forecastTimes();
  tasks.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'step';
    div.dataset.step = i;
    if(timelineEl.id === 'timeline') div.id = 'step-' + i;
    const isDone = i < pointer;
    const canMoveUp = !isDone && i > pointer;
    const canMoveDown = !isDone && i < tasks.length - 1;
    if(!isDone && t.userSkipped) div.classList.add('skip-planned');
    const timeHtml = stepTimeHtml(t, i, times);
    div.innerHTML = `
      <div class="emoji">${t.emoji}</div>
      <div class="info">
        <div class="name">${t.name}</div>
        <div class="time" data-h="${timeHtml.replace(/"/g, '&quot;')}">${timeHtml}</div>
      </div>
      ${isDone
        ? `<div class="check">${t.userSkipped ? '⏭️' : '✔'}</div>${t.outcome === 'skipped' ? '' : `<div class="outcome-badge${t.outcome === 'late' ? '' : ' star'}">${t.outcome === 'late' ? LATE_ICON : ONTIME_ICON}</div>`}${t.userSkipped && canRestore(i) ? `<button type="button" class="skip-btn restore" data-index="${i}" title="${tr('unskip_title')}">↩️</button>` : ''}`
        : `<button type="button" class="skip-btn${t.userSkipped ? ' restore' : ''}" data-index="${i}" title="${tr(t.userSkipped ? 'unskip_title' : 'skip_title')}">${t.userSkipped ? '↩️' : '⏭️'}</button>
           <div class="reorder-controls">
             <button class="reorder-btn up" data-index="${i}" ${canMoveUp ? '' : 'disabled'} title="${tr('move_earlier')}">▲</button>
             <button class="reorder-btn down" data-index="${i}" ${canMoveDown ? '' : 'disabled'} title="${tr('move_later')}">▼</button>
           </div>`
      }
    `;
    timelineEl.appendChild(div);
  });
}
