<!DOCTYPE html>

<script>
// Always force fetching the newest version from the server: if the URL lacks
// our cache-busting parameter, redirect to itself with a unique value, which
// forces the browser to ignore any cached copy (on the TV or GitHub Pages)
// and download the actual latest file.
(function(){
  // Only enable this redirect on the real published site (github.io) —
  // anywhere else (Claude preview, file opened locally, etc.) it is harmless,
  // so it doesn't break those other ways of viewing the page.
  if(location.hostname.endsWith('github.io') && !location.search.includes('_cb=')){
    // Keep any existing query params (e.g. ?parear=CODE from the pairing QR code) and hash.
    const sep = location.search ? '&' : '?';
    location.replace(location.pathname + location.search + sep + '_cb=' + Date.now() + location.hash);
  }
})();
</script>

  #settings-child-name{
    width:100%;
    max-width:320px;
    margin-bottom:1.5vh;
  }
  #step-size-row{
    display:flex;
    align-items:center;
    gap:0.6vw;
    margin-bottom:1vh;
    flex-wrap:wrap;
  }
  #step-size-row .settings-label{ display:inline; margin:0; }
  .step-size-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:0.95vw;
    border:2px solid rgba(29,53,87,0.15);
    background:white;
    color:var(--navy);
    border-radius:10px;
    padding:0.6vh 1vw;
    cursor:pointer;
  }
  .step-size-btn.selected{ background:var(--sky); color:white; border-color:var(--sky); }
  #autolink-row{
    display:flex;
    align-items:center;
    gap:0.5vw;
    margin-bottom:2vh;
    font-family:'Nunito', sans-serif;
    font-size:0.95vw;
    color:var(--navy);
  }
  #autolink-row input{ width:1.4vw; height:1.4vw; min-width:16px; min-height:16px; }

  /* ---- Weekly routines (tabs + table) ---- */
  #routines-section{
    background:rgba(29,53,87,0.04);
    border-radius:16px;
    padding:1.5vh 1.2vw;
    margin-bottom:2vh;
  }
  #routines-section h3{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.3vw;
    color:var(--navy);
    margin-bottom:1vh;
  }
  #sync-section{
    background:rgba(95,194,142,0.08);
    border:2px solid rgba(95,194,142,0.3);
    border-radius:16px;
    padding:1.5vh 1.2vw;
    margin-bottom:2vh;
  }
  #sync-section h3{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.2vw;
    color:var(--navy);
    margin-bottom:0.8vh;
  }
  #sync-section code{
    background:rgba(29,53,87,0.08);
    padding:0.1vh 0.4vw;
    border-radius:6px;
  }
  .sync-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:0.8vw;
    margin:1vh 0;
  }
  #cloud-banner{
    display:none;
    border-radius:14px;
    padding:1.5vh 1.2vw;
    margin-bottom:2vh;
    font-family:'Nunito', sans-serif;
    font-size:clamp(15px, 1vw, 22px);
    color:var(--navy);
  }
  #cloud-banner.ok{ background:rgba(95,194,142,0.2); border:2px solid var(--mint); }
  #cloud-banner.error{ background:rgba(255,107,107,0.15); border:2px solid var(--coral); }
  #cloud-banner strong{
    display:block;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(22px, 1.6vw, 34px);
    margin-bottom:0.5vh;
  }
  #cloud-devices{
    list-style:none;
    padding:0;
    margin:0.5vh 0 1vh;
  }
  #cloud-devices li{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:0.4vh 1vw;
    background:white;
    border:2px solid rgba(29,53,87,0.1);
    border-radius:12px;
    padding:0.8vh 1vw;
    margin-bottom:0.8vh;
    font-family:'Nunito', sans-serif;
    font-size:clamp(14px, 0.95vw, 20px);
    color:var(--navy);
  }
  .cloud-device-name{ font-weight:800; flex:1 1 auto; }
  .cloud-device-seen{ color:#6b7a90; font-size:0.9em; }
  .cloud-remove-btn{ background:var(--coral); font-size:clamp(13px, 0.9vw, 18px); }
  #cloud-banner .sync-buttons{ margin-top:1vh; }
  #cloud-banner .settings-text-input,
  #cloud-banner .util-btn{ font-size:clamp(16px, 1vw, 22px); }
  #cloud-log-box{ margin:1vh 0; font-family:'Nunito', sans-serif; font-size:clamp(12px, 0.8vw, 16px); color:#6b7a90; }
  #cloud-log-box summary{ cursor:pointer; }
  #cloud-log{ list-style:none; padding:0; margin:0.5vh 0 0; }
  #cloud-log li{ padding:0.2vh 0; }
  #cloud-code{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(32px, 4vw, 72px);
    letter-spacing:0.15em;
    color:var(--navy);
  }
  #cloud-qr{
    background:white;
    border-radius:12px;
    padding:1.5vh;
    margin:1vh 0;
    width:fit-content;
  }
  #cloud-code-input{
    max-width:9em;
    letter-spacing:0.15em;
  }
  .settings-hint{
    font-family:'Nunito', sans-serif;
    font-size:0.85vw;
    color:#6b7a90;
    margin-bottom:1.2vh;
  }
  #routine-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:0.5vw;
    margin-bottom:1vh;
  }
  .routine-tab{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1vw;
    border:2px solid rgba(29,53,87,0.15);
    background:white;
    color:var(--navy);
    border-radius:12px;
    padding:0.8vh 1.2vw;
    cursor:pointer;
  }
  .routine-tab.selected{ background:var(--sky); color:white; border-color:var(--sky); }
  #routine-add-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1vw;
    border:2px dashed rgba(29,53,87,0.3);
    background:transparent;
    color:var(--navy);
    border-radius:12px;
    padding:0.8vh 1.2vw;
    cursor:pointer;
  }
  #routine-edit-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:0.6vw;
    margin-bottom:1vh;
  }
  #routine-name-input{ flex:1; min-width:140px; }
  #routine-icon-picker{ display:flex; flex-wrap:wrap; gap:0.3vw; }
  #routine-icon-picker button{
    font-size:1.3vw;
    padding:0.3vh 0.5vw;
    border-radius:8px;
    border:2px solid transparent;
    background:rgba(29,53,87,0.06);
    cursor:pointer;
  }
  #routine-icon-picker button.selected{ border-color:var(--sky); background:rgba(78,168,222,0.2); }
  #routine-delete-btn{
    background:var(--coral);
    color:white;
    border:none;
    border-radius:10px;
    padding:0.8vh 1vw;
    cursor:pointer;
    font-size:1vw;
  }
  #week-matrix{
    width:100%;
    border-collapse:collapse;
    margin-top:1vh;
    font-size:0.85vw;
  }
  #week-matrix th, #week-matrix td{
    text-align:center;
    padding:0.6vh 0.4vw;
    border-bottom:1px solid rgba(29,53,87,0.08);
  }
  #week-matrix th{ color:var(--navy); font-family:'Nunito', sans-serif; font-weight:700; }
  #week-matrix td:first-child, #week-matrix th:first-child{ text-align:left; }
  #week-matrix .matrix-routine-label{ display:flex; align-items:center; gap:0.4vw; white-space:nowrap; }
  #week-matrix input[type="checkbox"]{ width:1.3vw; height:1.3vw; min-width:15px; min-height:15px; }
  #week-matrix th.day-conflict{ color:var(--coral); }
  #week-matrix td.day-conflict{ background:rgba(255,107,107,0.12); }
  #week-matrix input.conflict-checkbox{ outline:2px solid var(--coral); }
  #conflict-warning{
    display:none;
    background:rgba(255,107,107,0.12);
    border:2px solid var(--coral);
    border-radius:12px;
    padding:1vh 1.2vw;
    margin-top:1vh;
    font-family:'Nunito', sans-serif;
    font-size:0.9vw;
    color:var(--navy);
  }
  #conflict-warning.show{ display:block; }
  #conflict-warning strong{ color:var(--coral); }
  .apply-all-days-btn{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:0.75vw;
    border:none;
    border-radius:8px;
    background:rgba(78,168,222,0.2);
    color:var(--sky);
    padding:0.3vh 0.6vw;
    cursor:pointer;
    white-space:nowrap;
  }
  #routine-tasks-heading{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.2vw;
    color:var(--navy);
    margin:1.5vh 0 1vh 0;
  }
  .task-row{
    background:white;
    border-radius:16px;
    padding:1.5vh 1.2vw;
    margin-bottom:1.2vh;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:0.8vw;
  }
  .task-row .emoji-preview{
    font-size:2vw;
    width:2.6vw;
    height:2.6vw;
    min-width:32px;
    min-height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(29,53,87,0.06);
    border-radius:10px;
    flex-shrink:0;
  }
  .task-name-input{ flex:1; min-width:140px; }
  .emoji-picker{
    display:flex;
    flex-wrap:wrap;
    gap:0.3vw;
    width:100%;
    margin:0.6vh 0 0.4vh 0;
  }
  .emoji-picker button{
    font-size:1.4vw;
    padding:0.4vh 0.5vw;
    border-radius:8px;
    border:2px solid transparent;
    background:rgba(29,53,87,0.06);
    cursor:pointer;
  }
  .emoji-picker button.selected{ border-color:var(--sky); background:rgba(78,168,222,0.2); }
  .task-time-group{ display:flex; align-items:center; gap:0.6vw; font-size:0.9vw; color:var(--navy); }
  .time-stepper{ display:flex; flex-direction:column; align-items:center; gap:0.1vh; }
  .time-stepper .time-value{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.1vw;
    color:var(--navy);
    min-width:3.2vw;
    text-align:center;
  }
  .time-step-btn{
    width:1.8vw;
    height:1.6vw;
    min-width:22px;
    min-height:20px;
    border-radius:6px;
    border:none;
    background:rgba(29,53,87,0.1);
    color:var(--navy);
    font-weight:800;
    font-size:0.9vw;
    cursor:pointer;
  }
  .task-row .sound-url-input{ width:100%; margin-top:0.5vh; }
  .task-row .remove-task-btn{
    background:var(--coral);
    color:white;
    border:none;
    border-radius:8px;
    width:2.2vw;
    height:2.2vw;
    min-width:26px;
    min-height:26px;
    cursor:pointer;
    flex-shrink:0;
  }
  .task-row .row-reorder{ display:flex; flex-direction:column; gap:0.2vh; }
  .task-row .row-reorder button{
    width:1.8vw; height:1.6vw; min-width:20px; min-height:18px;
    border-radius:5px; border:none; background:rgba(29,53,87,0.08); cursor:pointer; font-size:0.8vw;
  }
  .task-row .row-reorder button:disabled{ opacity:0.25; }
  .settings-add-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.1vw;
    background:var(--sky);
    color:white;
    border:none;
    border-radius:14px;
    padding:1.2vh 2vw;
    cursor:pointer;
    margin-top:0.5vh;
  }
  .settings-actions{
    display:flex;
    justify-content:flex-end;
    gap:1vw;
    margin-top:3vh;
  }
  .settings-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.2vw;
    border:none;
    border-radius:16px;
    padding:1.4vh 2.4vw;
    cursor:pointer;
    color:white;
  }
  .settings-btn.cancel{ background:#9aa5b1; }
  .settings-btn.save{ background:var(--mint); }

  /* ---- Timeline heading: which routine the list is showing ---- */
  .timeline-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.4vw;
    color:var(--navy);
    opacity:0.8;
    padding:0 0.4vw;
    flex-shrink:0;
  }
  .step.preview{ opacity:0.7; }

  /* ---- Phones and other narrow or short screens ----
     The TV layout (two columns, fixed footer, sizes in vw) gets cramped and
     overlaps on a phone. Here everything stacks in one scrolling column:
     buttons, title, a bar with clock + deadline + sound button, the current
     task card, then the list. */
  @media (orientation: portrait), (max-width: 700px), (max-height: 500px){
    html, body{ overflow-y:auto; overflow-x:hidden; }
    body{
      height:auto;
      min-height:100vh;
      padding:12px 14px 24px;
    }
    #util-buttons{
      position:static;
      order:1;
      flex-wrap:wrap;
      justify-content:center;
      gap:8px;
      margin-bottom:8px;
    }
    #util-buttons .util-btn{ font-size:13px; padding:7px 12px; }
    header{ order:2; padding-top:0; margin-bottom:8px; }
    header h1{ font-size:24px; text-align:center; }
    #bottom-info{
      position:static;
      order:3;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:12px;
    }
    #clock{ font-size:22px; padding:6px 14px; }
    #limit-control{ padding:6px 12px; gap:6px; }
    #limit-control .limit-title{ font-size:14px; }
    .limit-value, .limit-colon{ font-size:20px; min-width:26px; }
    .limit-btn{ width:30px; height:30px; font-size:13px; }
    main{
      order:4;
      display:flex;
      flex-direction:column;
      gap:16px;
      flex:none;
    }
    #hero{ padding:22px 16px; border-radius:24px; overflow:visible; }
    #hero-emoji{ font-size:72px; }
    #hero-label{ font-size:28px; }
    #hero-sub{ font-size:16px; }
    #minutes-left{ font-size:56px; }
    #minutes-left .unit{ font-size:18px; margin-left:4px; }
    #segments{ gap:6px; }
    .seg{ width:34px; height:34px; font-size:13px; border-radius:8px; }
    #finish-early-btn, #start-next-btn{ font-size:18px; padding:12px 22px; }
    #browse-controls{ gap:12px; }
    #browse-controls button{ font-size:20px; padding:10px 22px; }
    #timeline{ overflow:visible; gap:8px; }
    .timeline-title{ font-size:18px; padding:0 4px; }
    .step{ padding:10px 12px; gap:12px; border-radius:14px; }
    .step .emoji{ font-size:30px; }
    .step .name{ font-size:18px; }
    .step .time{ font-size:14px; }
    .check{ font-size:22px; }
    .outcome-badge{ font-size:22px; }
    .outcome-badge.star{ font-size:28px; }
    .reorder-controls{ gap:4px; }
    .reorder-btn{ width:34px; height:30px; font-size:14px; }
    #sound-toggle{ position:static; width:52px; height:52px; min-width:52px; min-height:52px; font-size:22px; }

    /* Settings screen: readable sizes instead of vw-based ones (16px inputs also avoid iOS zoom) */
    #settings-overlay, #welcome-overlay{ padding:8px; }
    .settings-card{ padding:18px 14px; max-height:94vh; border-radius:18px; }
    .settings-card h2{ font-size:22px; }
    .settings-label{ font-size:15px; }
    .settings-text-input, .settings-time-input, .settings-select{ font-size:16px; padding:8px 10px; }
    .settings-card .util-btn{ font-size:14px; padding:8px 14px; }
    .settings-hint{ font-size:13px; }
    #sync-section, #routines-section{ padding:12px; }
    #sync-section h3, #routines-section h3, #routine-tasks-heading{ font-size:18px; }
    .step-size-btn{ font-size:14px; padding:6px 12px; }
    #autolink-row{ font-size:14px; }
    #autolink-row input{ width:20px; height:20px; }
    .routine-tab, #routine-add-btn, #routine-delete-btn{ font-size:14px; padding:6px 12px; }
    #routine-icon-picker button, .emoji-picker button{ font-size:20px; padding:4px 6px; }
    #week-matrix{ font-size:13px; }
    #week-matrix input[type="checkbox"]{ width:22px; height:22px; }
    #conflict-warning{ font-size:13px; padding:8px 10px; }
    .apply-all-days-btn{ font-size:12px; padding:3px 8px; }
    .task-row{ padding:12px 10px; }
    .task-row .emoji-preview{ font-size:26px; width:40px; height:40px; }
    .task-time-group{ font-size:14px; gap:6px; }
    .time-stepper .time-value{ font-size:16px; min-width:44px; }
    .time-step-btn{ width:32px; height:26px; font-size:12px; }
    .task-row .remove-task-btn{ width:34px; height:34px; }
    .task-row .row-reorder button{ width:30px; height:26px; font-size:12px; }
    .settings-add-btn{ font-size:16px; padding:10px 18px; }
    .settings-btn{ font-size:17px; padding:10px 20px; }
    #app-version{ font-size:11px !important; }
    #cloud-sync .settings-label{ font-size:14px; }
    .lang-picker{ justify-content:flex-start; gap:6px; }
    .lang-btn{ padding:5px 10px; }
  }
</style>
</head>
<body>

<div id="util-buttons">
  <button id="config-btn" class="util-btn" data-i18n="btn_config" data-i18n-title="btn_config_title" style="background:#B983FF;"></button>
  <button id="test-schedule-btn" class="util-btn" data-i18n="btn_test" data-i18n-title="btn_test_title"></button>
  <button id="reset-schedule-btn" class="util-btn" data-i18n="btn_reset" data-i18n-title="btn_reset_title"></button>
</div>
<div id="bottom-info">
  <div id="clock">--:--</div>
  <div id="limit-control">
    <span class="limit-title" data-i18n="deadline"></span>
    <div class="limit-unit">
      <button id="limit-hour-plus" class="limit-btn">▲</button>
      <span class="limit-value" id="limit-hour">--</span>
      <button id="limit-hour-minus" class="limit-btn">▼</button>
    </div>
    <span class="limit-colon">:</span>
    <div class="limit-unit">
      <button id="limit-min-plus" class="limit-btn">▲</button>
      <span class="limit-value" id="limit-min">--</span>
      <button id="limit-min-minus" class="limit-btn">▼</button>
    </div>
  </div>
  <!-- Fixed to the bottom-right corner on the TV; part of this bar on phones -->
  <button id="sound-toggle" data-i18n-title="sound_title">🔊</button>
</div>
<div id="celebration-layer"></div>
<div id="encourage-banner"></div>

<header>
  <h1 id="page-title"></h1>
</header>

<main>
  <div id="hero">
    <div id="hero-emoji">⏰</div>
    <div id="hero-label" data-i18n="loading"></div>
    <div id="hero-sub"></div>
    <div id="minutes-left">--<span class="unit">min</span></div>
    <div id="segments"></div>
    <button id="finish-early-btn" data-i18n="finish_early"></button>
    <button id="start-next-btn" data-i18n="start"></button>
    <div id="browse-controls">
      <button id="browse-prev-btn" data-i18n-title="browse_prev_title">◀</button>
      <button id="browse-next-btn" data-i18n-title="browse_next_title">▶</button>
    </div>
  </div>

  <div id="timeline"></div>
</main>

<div id="settings-overlay">
  <div class="settings-card">
    <h2 data-i18n="settings_title"></h2>
    <div class="lang-picker"></div>
    <div id="cloud-banner"></div>

    <div id="sync-section">
      <div id="cloud-sync" style="display:none;">
        <h3 data-i18n="sync_title"></h3>
        <p class="settings-hint" id="cloud-status"></p>
        <p class="settings-hint" data-i18n-html="sync_howto"></p>
        <div class="sync-buttons">
          <button type="button" id="cloud-show-code-btn" class="util-btn" style="background:var(--coral);" data-i18n="show_code"></button>
        </div>
        <div id="cloud-code-box" style="display:none;">
          <div id="cloud-code"></div>
          <div id="cloud-qr"></div>
          <p class="settings-hint" id="cloud-code-hint"></p>
        </div>
        <p class="settings-hint" style="margin-top:1.5vh;" data-i18n-html="got_code"></p>
        <div class="sync-buttons">
          <input type="text" id="cloud-code-input" class="settings-text-input" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000">
          <button type="button" id="cloud-join-btn" class="util-btn" style="background:var(--mint);" data-i18n="connect"></button>
        </div>
        <label class="settings-label" style="margin-top:1.5vh; display:block;" data-i18n="device_name_label"></label>
        <div id="cloud-name-editor"></div>
        <div id="cloud-devices-box" style="display:none;">
          <p class="settings-hint" style="margin-top:1.5vh;" data-i18n-html="devices_heading"></p>
          <ul id="cloud-devices"></ul>
          <div class="sync-buttons">
            <button type="button" id="cloud-remove-others-btn" class="util-btn" style="background:var(--coral); display:none;" data-i18n="remove_others"></button>
          </div>
        </div>
        <details id="cloud-log-box">
          <summary data-i18n="log_title"></summary>
          <ul id="cloud-log"></ul>
        </details>
        <div class="sync-buttons">
          <button type="button" id="cloud-disconnect-btn" class="util-btn" style="background:#9aa5b1; display:none;" data-i18n="disconnect"></button>
        </div>
      </div>

    </div>

    <label class="settings-label" for="settings-child-name" data-i18n="nickname_label"></label>
    <input type="text" id="settings-child-name" class="settings-text-input" maxlength="30" data-i18n-placeholder="nickname_placeholder">
    <p class="settings-hint" data-i18n="nickname_hint"></p>

    <div id="step-size-row">
      <span class="settings-label" data-i18n="step_size"></span>
      <button type="button" class="step-size-btn selected" data-step="5">5 min</button>

function detectLang(){
  let saved = null;
  try{ saved = localStorage.getItem(LANG_KEY); }catch(e){}
  if(saved && I18N[saved]) return saved;
  let hasRoutine = false;
  try{ hasRoutine = !!(localStorage.getItem('rotinaConfig_v2') || localStorage.getItem('rotinaConfig_v1')); }catch(e){}
  if(hasRoutine) return 'pt';
  const prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
  for(const p of prefs){
    const code = String(p).slice(0, 2).toLowerCase();
    if(I18N[code]) return code;
  }
  return 'en';
}
const LANG = detectLang();
function tr(key, vars){
  const table = I18N[LANG];
  let s = (key in table) ? table[key] : ((key in I18N.pt) ? I18N.pt[key] : key);
  if(vars && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
  return s;
}
function applyStaticTranslations(){
  document.documentElement.lang = LANG_LOCALES[LANG];
  document.title = APP_NAME;
  const htmlVars = { app: APP_NAME, task: '<span id="confirm-task-name"></span>', seconds: '<span id="confirm-seconds">30</span>' };
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n, { app: APP_NAME }); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = tr(el.dataset.i18nHtml, htmlVars); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = tr(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = tr(el.dataset.i18nTitle); });
  const stamp = (document.querySelector('meta[name="app-version"]').content.match(/\d{4}-\d{2}-\d{2} \d{2}:\d{2}/) || [''])[0];
  document.getElementById('app-version').textContent = `${tr('code_version')}: ${stamp}`;
}
applyStaticTranslations();

// Language picker (welcome screen and settings). Changing the language saves
// it for this device and reloads the app; unsaved settings edits are asked about first.
function renderLangPickers(){
  document.querySelectorAll('.lang-picker').forEach(box => {
    box.innerHTML = '';
    const label = document.createElement('span');
    label.className = 'lang-label';
    label.textContent = tr('lang_label');
    box.appendChild(label);
    Object.keys(LANG_LABELS).forEach(code => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lang-btn' + (code === LANG ? ' selected' : '');
      btn.dataset.lang = code;
      btn.textContent = LANG_LABELS[code];
      btn.addEventListener('click', () => changeLang(code));
      box.appendChild(btn);
    });
  });
}
function changeLang(code){
  if(code === LANG) return;
  const go = () => {
    try{ localStorage.setItem(LANG_KEY, code); }catch(e){}
    reloadFresh();
  };
  if(settingsDirty && settingsOverlay.style.display === 'flex'){
    appConfirm(tr('lang_change_confirm')).then(ok => { if(ok) go(); });
  } else {
    go();
  }
}
renderLangPickers();

function toMinutes([h,m]){ return h*60+m; }

// Merge the tasks of all routines active today (there may be more than
// one if "allow several per day" is on), in chronological order.
function buildTasksForDayIndex(dayIdx){
  const activeIds = (WEEK_SCHEDULE[dayIdx] || []).filter(id => ROUTINES.some(r => r.id === id));
  let combined = [];
  ROUTINES.forEach(r => {
    if(activeIds.includes(r.id)) combined = combined.concat(r.tasks.map(t => ({ ...t, routineId: r.id })));
  });
  combined.sort((a,b) => toMinutes(a.start) - toMinutes(b.start));
  return combined;
}
function buildTodaysTasks(){
  return buildTasksForDayIndex(new Date().getDay()); // 0=Sunday ... 6=Saturday
}

// Read-only preview of a future day's tasks, for arrow navigation
// — times come ready in minutes, same as the real `tasks` array,
// but without pointer/outcome (those days haven't "happened" yet).
function buildPreviewTasksForOffset(dayOffset){
  const dayIdx = (new Date().getDay() + dayOffset) % 7;
  return buildTasksForDayIndex(dayIdx).map(t => ({
    name: t.name, emoji: t.emoji, routineId: t.routineId,
    startMin: toMinutes(t.start), endMin: toMinutes(t.end),
    outcome: null
  }));
}

  const activeIds = (WEEK_SCHEDULE[tomorrowIdx] || []).filter(id => ROUTINES.some(r => r.id === id));
  const activeRoutines = ROUTINES.filter(r => activeIds.includes(r.id));
  if(activeRoutines.length === 0) return null;
  let firstStart = null;
  activeRoutines.forEach(r => {
    r.tasks.forEach(t => {
      const s = toMinutes(t.start);
      if(firstStart === null || s < firstStart) firstStart = s;
    });
  });
  const names = activeRoutines.map(r => `${r.icon} ${r.name}`).join(', ');
  return firstStart !== null ? tr('tomorrow_preview', { names, time: fmtMin(firstStart) }) : tr('tomorrow_preview_short', { names });
}

let TASKS = buildTodaysTasks();
let loadedDayIndex = new Date().getDay();

// Each task stores its own duration (baseDurationMin), the routine it came
// from (routineId) and its original planned start time (plannedStartMin).
// Within the SAME routine, tasks chain with no gap (one starts when the
// previous one ends). When switching routines (e.g. Morning -> Lunch), the
// actual configured gap is respected — it only advances to the planned time
// if that time hasn't arrived yet.
let tasks = [];
let PLANNED = [];
let dayStartMin = 0;
let limitMin = 0;
let pointer = 0; // index of the current task; pointer === tasks.length = routine complete (or no routine today)

function buildTasksFromConfig(cfg){
  return cfg.map(t => ({
    name: t.name,
    emoji: t.emoji,
    sound: t.sound,
    baseDurationMin: toMinutes(t.end) - toMinutes(t.start),
    plannedDurationMin: toMinutes(t.end) - toMinutes(t.start), // immutable, not affected by extensions
    routineId: t.routineId || null,
    plannedStartMin: toMinutes(t.start),
    redMin: 0,
    outcome: null,
    startMin: 0,
    endMin: 0
  }));
}

// Find the block of tasks (same routine) that contains index "idx" within
// the `tasks` array, and that routine's deadline (planned end + the buffer
// configured for it, or +10min by default).
function routineBlockAt(idx){
  if(idx < 0 || idx >= tasks.length) return null;
  const rid = tasks[idx].routineId;
  let start = idx, end = idx;
  while(start > 0 && tasks[start-1].routineId === rid) start--;
  while(end < tasks.length-1 && tasks[end+1].routineId === rid) end++;
  return { routineId: rid, startIdx: start, endIdx: end };
}
function routineTargetAndLimit(idx){
  const block = routineBlockAt(idx);
  if(!block) return { targetEndMin: 0, limitMin: 0 };
  let targetEndMin = tasks[block.startIdx].plannedStartMin;
  for(let i = block.startIdx; i <= block.endIdx; i++) targetEndMin += tasks[i].plannedDurationMin;
  const routine = ROUTINES.find(r => r.id === block.routineId);
  // Use the routine's preconfigured deadline, if any; otherwise fall back
  // to a reasonable default (planned end + 10min).
  const limit = (routine && routine.limitMin !== undefined) ? routine.limitMin : (targetEndMin + 10);
  return { targetEndMin, limitMin: limit };
}

let currentLimitRoutineId = undefined; // tracks when to recompute limitMin (routine changed)
function refreshLimitForCurrentRoutine(){
  if(pointer >= tasks.length) return;
  const rid = tasks[pointer].routineId;
  if(rid !== currentLimitRoutineId){
    currentLimitRoutineId = rid;
    limitMin = routineTargetAndLimit(pointer).limitMin;
  }
}

function hardLimitMin(){ return limitMin; }

// Compute the start of "next" right after "prev": chain with no gap if
// they belong to the same routine; if it's a different routine and its
// planned time hasn't arrived yet, wait until that time (actual gap).
function nextStartAfter(prevTask, nextTask, cursor){
  if(prevTask && nextTask.routineId !== prevTask.routineId && nextTask.plannedStartMin > cursor){
    return nextTask.plannedStartMin;
  }
  return cursor;
}

function recomputeUpcoming(overrideCursor){
  let cursor = (overrideCursor !== undefined) ? overrideCursor : (pointer > 0 ? tasks[pointer-1].endMin : dayStartMin);
  for(let i = pointer; i < tasks.length; i++){
    const prev = i > 0 ? tasks[i-1] : null;
    const start = (i === pointer && overrideCursor !== undefined) ? cursor : nextStartAfter(prev, tasks[i], cursor);
    tasks[i].startMin = start;
    tasks[i].endMin = start + tasks[i].baseDurationMin;
    cursor = tasks[i].endMin;
  }
}


// (Re)build the whole routine from a configuration — used on initial load
// and whenever the user saves new settings on the "Configure" screen.
function nowInMinutes(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60;
}

// If the page is opened (or the routine reloaded) after some task's time
// has already passed, silently advance to the actual current task —
// no confirmation dialog or sound, one by one, retroactively.
function catchUpToNow(){
  const nowMin = nowInMinutes();
  while(pointer < tasks.length && nowMin >= tasks[pointer].endMin){
    tasks[pointer].outcome = 'skipped';
    pointer++;
    recomputeUpcoming();
  }
}

function initSchedule(cfg){
  tasks = buildTasksFromConfig(cfg);
  PLANNED = cfg.map(t => ({ baseDurationMin: toMinutes(t.end) - toMinutes(t.start) }));
  dayStartMin = cfg.length > 0 ? toMinutes(cfg[0].start) : 0;
  pointer = 0;
  awaitingStart = false;
  lastSegTaskIndex = -1;
  closeConfirm();
  recomputeUpcoming();
  catchUpToNow();
  currentLimitRoutineId = undefined; // force recomputing the deadline for the current routine
  refreshLimitForCurrentRoutine();
  rebuildTimelineDOM();
  updateHeaderTitle();
}

// If the TV stays on past midnight, switch to the new day's routine automatically.
function checkDayRollover(){
  const idx = new Date().getDay();
  if(idx !== loadedDayIndex){
    loadedDayIndex = idx;
    TASKS = buildTodaysTasks();
    initSchedule(TASKS);
  }
}

// Reload the page automatically from time to time, but only at safe moments
// (today's routine hasn't started, has finished, or is waiting for the next) —
// never in the middle of an active task, so no progress/extension that only
// exists in this session's memory is lost. Ensures the TV always runs the
// latest published version and avoids any hang from continuous use.
const AUTO_REFRESH_MIN_INTERVAL_MS = 20 * 60 * 1000; // at least 20min between reloads
const AUTO_REFRESH_STABLE_MS = 15 * 60 * 1000;       // only reload after 15min "idle" in a safe state
let safeStateSince = null;

function maybeAutoRefresh(nowMin){
  const isSafe = (pointer >= tasks.length) || (tasks[pointer] && nowMin < tasks[pointer].startMin);
  if(!isSafe){
    safeStateSince = null;
    return;
  }
  if(updateAvailable && isQuietForReload()){ reloadFresh(); return; }
  if(safeStateSince === null) safeStateSince = Date.now();
  const stableFor = Date.now() - safeStateSince;
  if(stableFor < AUTO_REFRESH_STABLE_MS) return;

  let lastReload = 0;
  try{ lastReload = parseInt(localStorage.getItem('lastAutoRefresh') || '0', 10); }catch(e){}
  if(Date.now() - lastReload < AUTO_REFRESH_MIN_INTERVAL_MS) return;

  try{ localStorage.setItem('lastAutoRefresh', String(Date.now())); }catch(e){}
  reloadFresh(); // a plain reload() may be served the same cached copy
}

function fmt([h,m]){
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function fmtMin(min){
  return fmt([Math.floor(min/60), Math.round(min%60)]);
}

const heroEl = document.getElementById('hero');
const heroEmoji = document.getElementById('hero-emoji');
const heroLabel = document.getElementById('hero-label');
const heroSub = document.getElementById('hero-sub');
const minutesLeftEl = document.getElementById('minutes-left');
const segmentsEl = document.getElementById('segments');
const finishEarlyBtn = document.getElementById('finish-early-btn');
const browseControlsEl = document.getElementById('browse-controls');
const browsePrevBtn = document.getElementById('browse-prev-btn');
const browseNextBtn = document.getElementById('browse-next-btn');

// Arrow navigation, by WHOLE routine (not task by task — today's tasks
// already show in the side list). browseDay = null (default screen) or
// a day offset from today (0 = today, 1 = tomorrow, ...);
// browseRoutineIdx = index of the routine "block" within that day
// (a day can have more than one routine).
let browseDay = null;
let browseRoutineIdx = null;

function tasksForBrowseDay(offset){
  return offset === 0 ? tasks : buildPreviewTasksForOffset(offset);
}
// Group a day's task list into blocks by routine (consecutive tasks
// of the same routine become a single block = one "page").
function routineBlocksForDay(offset){
  const list = tasksForBrowseDay(offset);
  const blocks = [];
  list.forEach((t, idx) => {
    const last = blocks[blocks.length - 1];
    if(last && last.routineId === t.routineId){
      last.endIdx = idx;
      last.endMin = t.endMin;
    } else {
      blocks.push({ routineId: t.routineId, startIdx: idx, endIdx: idx, startMin: t.startMin, endMin: t.endMin });
    }
  });
  return blocks;
}
// Find the next (or previous) day offset, starting at startOffset, that
// has at least 1 routine — skips days with nothing configured. Only looks
// up to 6 days ahead (never more than one full lap of the week).
function findDayWithTasks(startOffset, direction){
  for(let off = startOffset; off >= 0 && off <= 6; off += direction){
    if(tasksForBrowseDay(off).length > 0) return off;
  }
  return null;
}

function renderBrowsedTask(){
  const blocks = routineBlocksForDay(browseDay);
  const block = blocks[browseRoutineIdx];
  const list = tasksForBrowseDay(browseDay);
  const isToday = browseDay === 0;
  const isCompleted = isToday && block.endIdx < pointer;
  heroEl.classList.toggle('done', isCompleted);

  const r = ROUTINES.find(r => r.id === block.routineId);
  heroEmoji.textContent = r ? r.icon : '📋';
  heroLabel.textContent = r ? r.name : tr('routine_fallback');
  // The child's name in the title never disappears — only this card line changes
  const dayLabel = browseDay === 0 ? tr('today') : (browseDay === 1 ? tr('tomorrow') : `${WEEKDAY_FULL[(new Date().getDay()+browseDay)%7]}`);
  const taskCount = block.endIdx - block.startIdx + 1;

  if(isCompleted){
    const blockTasks = list.slice(block.startIdx, block.endIdx + 1);
    const anyLate = blockTasks.some(t => t.outcome === 'late');
    const outcomeTxt = anyLate ? ` ${LATE_ICON}` : ` ${ONTIME_ICON}`;
    heroSub.textContent = tr('completed_range', { from: fmtMin(block.startMin), to: fmtMin(block.endMin), n: taskCount }) + outcomeTxt;
  } else {
    heroSub.textContent = tr('day_range', { day: dayLabel, from: fmtMin(block.startMin), to: fmtMin(block.endMin), n: taskCount });
  }
  minutesLeftEl.innerHTML = '';
  segmentsEl.innerHTML = '';
  finishEarlyBtn.style.display = 'none';
  startNextBtn.style.display = 'none';
}

function browsePrev(){
  if(browseDay === null){
    if(pointer > 0){
      const blocks = routineBlocksForDay(0);
      const idx = blocks.findIndex(b => b.endIdx >= pointer - 1 && b.startIdx <= pointer - 1);
      browseDay = 0;
      browseRoutineIdx = idx !== -1 ? idx : blocks.length - 1;
    }
    render();
    return;
  }
  if(browseRoutineIdx > 0){
    browseRoutineIdx--;
  } else {
    const prevDay = findDayWithTasks(browseDay - 1, -1);
    if(prevDay !== null){
      browseDay = prevDay;
      browseRoutineIdx = routineBlocksForDay(prevDay).length - 1;
    } else if(browseDay === 0){
      browseDay = null; browseRoutineIdx = null; // back to the default screen
    }
  }
  render();
}
function browseNext(){
  if(browseDay === null){
    if(pointer < tasks.length){
      const blocks = routineBlocksForDay(0);
      const idx = blocks.findIndex(b => b.endIdx >= pointer);
      browseDay = 0;
      browseRoutineIdx = idx !== -1 ? idx : 0;
    } else {
      const nextDay = findDayWithTasks(1, 1);
      if(nextDay !== null){ browseDay = nextDay; browseRoutineIdx = 0; }
    }
    render();
    return;
  }
  const blocks = routineBlocksForDay(browseDay);
  if(browseRoutineIdx < blocks.length - 1){
    browseRoutineIdx++;
  } else {
    const nextDay = findDayWithTasks(browseDay + 1, 1);
    if(nextDay !== null){ browseDay = nextDay; browseRoutineIdx = 0; }
  }
  render();
}
browsePrevBtn.addEventListener('click', browsePrev);
browseNextBtn.addEventListener('click', browseNext);

// ---------- Timeline construction (rebuilt whenever the order changes) ----------
function rebuildTimelineDOM(){
  timelineEl.innerHTML = '<div class="timeline-title" id="timeline-title"></div>';
  timelinePreviewKey = null;
  tasks.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'step';
    div.id = 'step-' + i;
    const isDone = i < pointer;
    const canMoveUp = !isDone && i > pointer;
    const canMoveDown = !isDone && i < tasks.length - 1;
    div.innerHTML = `
      <div class="emoji">${t.emoji}</div>
      <div class="info">
        <div class="name">${t.name}</div>
        <div class="time">${fmtMin(t.startMin)} – ${fmtMin(t.endMin)}${t.redMin ? ` (+${t.redMin}min)` : ''}</div>
      </div>
      ${isDone
        ? `<div class="check">✔</div>${t.outcome === 'skipped' ? '' : `<div class="outcome-badge${t.outcome === 'late' ? '' : ' star'}">${t.outcome === 'late' ? LATE_ICON : ONTIME_ICON}</div>`}`
        : `<div class="reorder-controls">
             <button class="reorder-btn up" data-index="${i}" ${canMoveUp ? '' : 'disabled'} title="${tr('move_earlier')}">▲</button>
             <button class="reorder-btn down" data-index="${i}" ${canMoveDown ? '' : 'disabled'} title="${tr('move_later')}">▼</button>
           </div>`
      }
    `;
    timelineEl.appendChild(div);
  });
}

// ---------- The side list shows only the routine shown on the left ----------
// It follows the hero card: the routine being browsed with the arrows (on
// any day), else the routine of the current/next task, else (day finished)
// the last routine of the day. Other days' routines are drawn as read-only
// preview rows, rebuilt only when the browsed routine changes.
let timelinePreviewKey = null;
function focusedRoutineBlock(){
  if(browseDay !== null && browseRoutineIdx !== null){
    const block = routineBlocksForDay(browseDay)[browseRoutineIdx];
    if(block) return { day: browseDay, block };
  }
  const blocks = routineBlocksForDay(0);
  if(!blocks.length) return null;
  const idx = Math.min(pointer, tasks.length - 1);
  return { day: 0, block: blocks.find(b => idx >= b.startIdx && idx <= b.endIdx) || blocks[blocks.length - 1] };
}
function clearTimelinePreview(){
  timelineEl.querySelectorAll('.step.preview').forEach(el => el.remove());
  timelinePreviewKey = null;
}
// The deadline shown follows the same routine as the card and the list: the
// running routine's (adjustable with the arrows) or, for any other routine
// (browsing, between routines, day finished), its configured deadline, read-only.
function showDeadlineFor(focus){
  let value = limitMin;
  let live = true;
  if(!focus){
    live = false;
  } else if(!(focus.day === 0 && pointer < tasks.length && pointer >= focus.block.startIdx && pointer <= focus.block.endIdx)){
    live = false;
    const routine = ROUTINES.find(r => r.id === focus.block.routineId);
    value = (routine && routine.limitMin !== undefined)
      ? routine.limitMin
      : (focus.day === 0 ? routineTargetAndLimit(focus.block.startIdx).limitMin : focus.block.endMin + 10);
  }
  const limitControl = document.getElementById('limit-control');
  limitControl.style.visibility = focus ? '' : 'hidden';
  limitControl.classList.toggle('read-only', !live);
  limitControl.querySelectorAll('.limit-btn').forEach(btn => { btn.disabled = !live; });
  limitHourEl.textContent = String(Math.floor(value / 60) % 24).padStart(2, '0');
  limitMinEl.textContent = String(Math.round(value % 60)).padStart(2, '0');
}

function applyTimelineFocus(){
  const titleEl = document.getElementById('timeline-title');
  const focus = focusedRoutineBlock();
  showDeadlineFor(focus);
  if(!focus){
    clearTimelinePreview();
    if(titleEl) titleEl.style.display = 'none';
    return;
  }
  const { day, block } = focus;
  const r = ROUTINES.find(r => r.id === block.routineId);
  const weekday = WEEKDAY_FULL[(new Date().getDay() + day) % 7];
  const dayPrefix = day === 0 ? '' : (day === 1 ? `${tr('tomorrow')} · ` : `${weekday[0].toUpperCase()}${weekday.slice(1)} · `);
  if(titleEl){
    titleEl.textContent = `${dayPrefix}${r ? `${r.icon} ${r.name}` : `📋 ${tr('routine_fallback')}`}`;
    titleEl.style.display = '';
  }
  tasks.forEach((t, i) => {
    const el = document.getElementById('step-' + i);
    if(el) el.style.display = (day === 0 && i >= block.startIdx && i <= block.endIdx) ? '' : 'none';
  });
  if(day === 0){ clearTimelinePreview(); return; }
  const key = `${day}:${block.startIdx}:${block.endIdx}`;
  if(key === timelinePreviewKey) return;
  clearTimelinePreview();
  tasksForBrowseDay(day).slice(block.startIdx, block.endIdx + 1).forEach(t => {
    const div = document.createElement('div');
    div.className = 'step preview';
    const emoji = document.createElement('div');
    emoji.className = 'emoji';
    emoji.textContent = t.emoji;
    const info = document.createElement('div');
    info.className = 'info';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = t.name;
    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = `${fmtMin(t.startMin)} – ${fmtMin(t.endMin)}`;
    info.appendChild(name);
    info.appendChild(time);
    div.appendChild(emoji);
    div.appendChild(info);
    timelineEl.appendChild(div);
  });

}

// ---------- SOUND (generated beep, no external files) ----------
let soundEnabled = false; // starts off; user turns it on with the button
let audioCtx;

function ensureAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep(freq=880, duration=0.15, delay=0){
  if(!soundEnabled) return;
  try{
    const ctx = ensureAudioCtx();
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.25, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.05);
  }catch(e){}
}
function chime(){ beep(660,0.15,0); beep(880,0.18,0.16); beep(1046,0.22,0.34); }

// Demo melody for the "Wake up" task (just to test "bigger sound at the
// start" while we don't have a real hosted mp3 — replace with sound.src
// pointing to a music link/file when we have one).
function wakeMelody(){
  const notes = [523,587,659,698,784,880,784,659];
  notes.forEach((f,i) => beep(f, 0.22, i*0.2));
}

// ---------- Clapping sound (filtered noise, in applause rhythm) ----------
// ---------- "Crowd" applause sound (noise layer + scattered claps) ----------
function playClapSound(){
  if(!soundEnabled) return;
  try{
    const ctx = ensureAudioCtx();
    const duration = 2.6;
    const t0 = ctx.currentTime;

    // layer 1: continuous background "roar", like a distant crowd
    const roarBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate*duration), ctx.sampleRate);
    const roarData = roarBuf.getChannelData(0);
    for(let i=0;i<roarData.length;i++){ roarData[i] = Math.random()*2-1; }
    const roarSrc = ctx.createBufferSource();
    roarSrc.buffer = roarBuf;
    const roarFilter = ctx.createBiquadFilter();
    roarFilter.type = 'bandpass';
    roarFilter.frequency.value = 1600;
    roarFilter.Q.value = 0.5;
    const roarGain = ctx.createGain();
    roarGain.gain.setValueAtTime(0.0001, t0);
    roarGain.gain.linearRampToValueAtTime(0.16, t0+0.3);
    roarGain.gain.linearRampToValueAtTime(0.12, t0+duration-0.5);
    roarGain.gain.linearRampToValueAtTime(0.0001, t0+duration);
    roarSrc.connect(roarFilter).connect(roarGain).connect(ctx.destination);
    roarSrc.start(t0);

    // layer 2: many individual small claps, scattered and irregular (no fixed rhythm)
    const clapCount = 45;
    for(let i=0;i<clapCount;i++){
      const t = Math.random() * duration * 0.92;
      const dur = 0.05 + Math.random()*0.05;
      const bufferSize = Math.floor(ctx.sampleRate * dur);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<bufferSize;j++){ data[j] = (Math.random()*2-1) * Math.pow(1-j/bufferSize, 2); }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1200 + Math.random()*2500;
      filter.Q.value = 0.8 + Math.random();
      const gain = ctx.createGain();
      gain.gain.value = 0.10 + Math.random()*0.16;
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start(t0 + t);
    }

    // layer 3: whistles (high-pitched glissando)
    [0.15, 1.3].forEach(delay => {
      const t1 = t0 + delay;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      const g = ctx.createGain();
      osc.frequency.setValueAtTime(1100, t1);
      osc.frequency.exponentialRampToValueAtTime(2500, t1+0.18);
      osc.frequency.exponentialRampToValueAtTime(1700, t1+0.42);
      g.gain.setValueAtTime(0.0001, t1);
      g.gain.linearRampToValueAtTime(0.16, t1+0.05);
      g.gain.linearRampToValueAtTime(0.0001, t1+0.48);
      osc.connect(g).connect(ctx.destination);
      osc.start(t1); osc.stop(t1+0.5);
    });

    // layer 4: crowd "cheers" (filtered noise with glissando)
    [0.05, 0.85, 1.9].forEach(delay => {
      const t1 = t0 + delay;
      const dur = 0.55;
      const bufferSize = Math.floor(ctx.sampleRate*dur);
      const buf = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ d[i] = Math.random()*2-1; }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filt = ctx.createBiquadFilter();
      filt.type = 'bandpass';
      filt.Q.value = 6;
      filt.frequency.setValueAtTime(450, t1);
      filt.frequency.exponentialRampToValueAtTime(1300, t1+dur*0.6);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t1);
      g.gain.linearRampToValueAtTime(0.22, t1+0.12);
      g.gain.linearRampToValueAtTime(0.0001, t1+dur);
      src.connect(filt).connect(g).connect(ctx.destination);
      src.start(t1);
    });
  }catch(e){}
}

function speak(text, opts={}){
  if(!soundEnabled) return;
  try{
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANG_LOCALES[LANG];
      u.pitch = opts.pitch !== undefined ? opts.pitch : 1;
      u.rate = opts.rate !== undefined ? opts.rate : 1;
      const voices = window.speechSynthesis.getVoices();
      const voice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(LANG));
      if(voice) u.voice = voice;
      window.speechSynthesis.speak(u);
    } else {
      beep(392,0.2,0); beep(440,0.2,0.22); beep(494,0.3,0.44); // soft motif, no voice
    }
  }catch(e){}
}

const taskAudio = new Audio();
taskAudio.loop = false;

function stopTaskAudio(){
  if(!taskAudio.paused){
    taskAudio.pause();
    taskAudio.currentTime = 0;
  }
}

function playForTask(task){
  if(!soundEnabled){
    stopTaskAudio();
    return;
  }
  if(task && task.sound && task.sound.type === 'melody'){
    stopTaskAudio();
    wakeMelody();
  } else if(task && task.sound && task.sound.src){
    stopTaskAudio();
    taskAudio.src = task.sound.src;
    taskAudio.loop = !!task.sound.loop;
    taskAudio.volume = (task.sound.volume !== undefined) ? task.sound.volume : 1;
    taskAudio.currentTime = 0;
    taskAudio.play().catch(()=>{ wakeMelody(); });
  } else {
    stopTaskAudio();
    chime();
  }
}

// ---------- Per-minute segments ----------
let lastSegTaskIndex = -1;

function buildSegments(totalMin, redMin=0){
  segmentsEl.innerHTML = '';
  const n = Math.max(1, Math.round(totalMin));
  const redCount = Math.round(redMin);
  for(let i=0;i<n;i++){
    const seg = document.createElement('div');
    const isRed = i >= (n - redCount);
    seg.className = 'seg' + (isRed ? ' overtime' : '');
    seg.innerHTML = `<div class="fill"></div><span>${i+1}</span>`;
    segmentsEl.appendChild(seg);
  }
}
function updateSegments(elapsedMin){
  const segs = segmentsEl.children;
  for(let i=0;i<segs.length;i++){
    const seg = segs[i];
    const fill = seg.querySelector('.fill');
    const segElapsed = Math.min(1, Math.max(0, elapsedMin - i));
    if(segElapsed >= 1){
      seg.classList.add('complete');
      fill.style.width = '100%';
    } else {
      seg.classList.remove('complete');
      fill.style.width = (segElapsed*100) + '%';
    }
  }
}

// ---------- Task extension (+5 min), respecting the deadline ----------
// Recompute only the tasks AFTER the current one (pointer), using its current
// end as the anchor. Never touches the current task's own start — important
// because that start may have been set by an early "Start".
function cascadeAfterPointer(){
  let cursor = tasks[pointer].endMin;
  for(let i = pointer+1; i < tasks.length; i++){
    const start = nextStartAfter(tasks[i-1], tasks[i], cursor);
    tasks[i].startMin = start;
    tasks[i].endMin = start + tasks[i].baseDurationMin;
    cursor = tasks[i].endMin;
  }
}

function extendCurrentTask(){
  const extra = 5;
  tasks[pointer].baseDurationMin += extra;
  tasks[pointer].redMin += extra;
  tasks[pointer].endMin += extra; // extend only the end; the start doesn't change
  cascadeAfterPointer(); // first let the delay naturally push the following tasks

  const limit = hardLimitMin();
  const block = routineBlockAt(pointer); // only touch tasks within the SAME routine, never the next one
  const lastIdxOfRoutine = block.endIdx;
  const overflow = tasks[lastIdxOfRoutine].endMin - limit;
  if(overflow > 0){
    // only compress as much as needed to never exceed this routine's deadline
    const after = tasks.slice(pointer+1, lastIdxOfRoutine+1);
    if(after.length){
      const floor = 3;
      let newDur = after.map(t => t.baseDurationMin);
      let toReduce = overflow;
      for(let pass = 0; pass < 4 && toReduce > 0.01; pass++){
        const eligible = newDur.map((d,idx) => idx).filter(idx => newDur[idx] > floor);
        const eligibleTotal = eligible.reduce((s,idx) => s + newDur[idx], 0);
        if(eligibleTotal <= 0) break;
        let reduced = 0;
        eligible.forEach(idx => {
          const share = (newDur[idx] / eligibleTotal) * toReduce;
          const maxRed = newDur[idx] - floor;
          const actual = Math.min(share, maxRed);
          newDur[idx] -= actual;
          reduced += actual;
        });
        toReduce -= reduced;
      }
      after.forEach((t, idx) => { t.baseDurationMin = newDur[idx]; });
    }
    cascadeAfterPointer();
  }
}

// ---------- Mark task as done (shared by both ways of advancing) ----------
let awaitingStart = false; // true = next task waiting for a tap on "Start"

function markTaskDone(actualEndMin){
  tasks[pointer].endMin = actualEndMin;
  tasks[pointer].outcome = tasks[pointer].redMin > 0 ? 'late' : 'onTime';
  if(tasks[pointer].outcome === 'onTime') celebrate();
  else encourage();
  pointer++;
  lastSegTaskIndex = -1;
  rebuildTimelineDOM();
}

// Used by the confirmation dialog (Yes / timeout): the task finished on
// time, so the next one starts immediately, with no wait.
function advanceTask(actualEndMin){
  if(pointer >= tasks.length) return;
  markTaskDone(actualEndMin);
  recomputeUpcoming();
  const nextTask = pointer < tasks.length ? tasks[pointer] : null;
  playForTask(nextTask);
}

// ---------- "Was the task completed?" dialog ----------
const confirmOverlay = document.getElementById('confirm-overlay');
const confirmCardEl = document.querySelector('.confirm-card');
const confirmTaskName = document.getElementById('confirm-task-name');
const confirmTimerBar = document.getElementById('confirm-timer-bar');
const confirmSecondsEl = document.getElementById('confirm-seconds');
const CONFIRM_MS = 10000;
let confirmState = null; // {deadline}
let lastTickSecond = null;

function openConfirm(){
  confirmState = { deadline: Date.now() + CONFIRM_MS };
  lastTickSecond = null;
  confirmTaskName.textContent = tasks[pointer].name;
  confirmOverlay.style.display = 'flex';
  confirmCardEl.classList.remove('urgent');
  chime();
}
function closeConfirm(){
  confirmOverlay.style.display = 'none';
  confirmCardEl.classList.remove('urgent');
  confirmState = null;
}
function resolveConfirm(answer){
  if(!confirmState) return;
  if(answer === 'nao'){
    try{ extendCurrentTask(); }catch(e){}
    closeConfirm();
    lastSegTaskIndex = -1;
    try{ rebuildTimelineDOM(); }catch(e){}
    startExtraTimeFeedback(); // banner + sound + voice, always — even if something above fails
  } else {
    const finishAt = tasks[pointer].endMin;
    closeConfirm();
    try{ advanceTask(finishAt); }catch(e){}
  }
  render();
}
document.getElementById('confirm-yes').addEventListener('click', () => resolveConfirm('sim'));
document.getElementById('confirm-no').addEventListener('click', () => resolveConfirm('nao'));

// ---------- "I'm done" button (early completion) ----------
function finishEarly(){
  if(pointer >= tasks.length || confirmState || awaitingStart) return;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  if(nowMin < tasks[pointer].startMin) return; // still in the waiting gap between routines
  const finishAt = Math.max(tasks[pointer].startMin, Math.min(nowMin, tasks[pointer].endMin));
  markTaskDone(finishAt);
  if(pointer < tasks.length){
    awaitingStart = true; // next task waits for a tap on "Start"
  } else {
    recomputeUpcoming();
  }
  render();
}
finishEarlyBtn.addEventListener('click', finishEarly);

// ---------- "Start" button (starts the next task and moves the rest earlier) ----------
const startNextBtn = document.getElementById('start-next-btn');
function startNextTask(){
  if(!awaitingStart) return;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  awaitingStart = false;
  recomputeUpcoming(nowMin); // anchor the next task (and the following ones) from now
  lastSegTaskIndex = -1;
  playForTask(tasks[pointer]);
  render();
}
startNextBtn.addEventListener('click', startNextTask);

// ---------- Reorder tasks not done yet ----------
function moveTask(idx, dir){
  const j = idx + dir;
  if(idx < pointer || j < pointer || j >= tasks.length) return;
  const tmp = tasks[idx];
  tasks[idx] = tasks[j];
  tasks[j] = tmp;
  recomputeUpcoming();
  lastSegTaskIndex = -1;
  rebuildTimelineDOM();
  render();
}
timelineEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.reorder-btn');
  if(!btn || btn.disabled) return;
  const idx = parseInt(btn.dataset.index, 10);
  moveTask(idx, btn.classList.contains('up') ? -1 : 1);
});

// ---------- Main render ----------
function render(){
  renderMain();
  applyTimelineFocus();
}
function renderMain(){
  checkDayRollover();
  const now = new Date();
  clockEl.textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  maybeAutoRefresh(nowMin);
  refreshLimitForCurrentRoutine(); // automatically recompute the deadline when the routine changes
  updateHeaderTitle(); // reset to the normal title by default; renderBrowsedTask() overrides it while browsing

  // Visually mark completed / active tasks
  tasks.forEach((t,i) => {
    const el = document.getElementById('step-'+i);
    if(!el) return;
    el.classList.remove('active','finished');
    if(i < pointer) el.classList.add('finished');
    else if(i === pointer) el.classList.add('active');
  });

  const idle = (pointer >= tasks.length) || (!awaitingStart && tasks[pointer] && nowMin < tasks[pointer].startMin);

  if(!idle){
    browseDay = null;
    browseTaskIdx = null;
    browseControlsEl.style.display = 'none';
  }

  if(pointer >= tasks.length){
    heroEl.classList.add('done');
    finishEarlyBtn.style.display = 'none';
    startNextBtn.style.display = 'none';

    const hasFuture = findDayWithTasks(1, 1) !== null;
    if(tasks.length > 0 || hasFuture){
      browseControlsEl.style.display = 'flex';
      browsePrevBtn.disabled = (browseDay === null) ? (tasks.length === 0) : false;
      browseNextBtn.disabled = (browseDay === null) ? !hasFuture : false;
      if(browseDay !== null){ renderBrowsedTask(); return; }
    } else {
      browseControlsEl.style.display = 'none';
    }

    if(tasks.length === 0){
      heroEmoji.textContent = '😴';
      heroLabel.textContent = tr('no_routine_today');
      heroSub.textContent = previewTomorrow() || tr('no_routine_configured');
    } else {
      heroEmoji.textContent = '🎉';
      heroLabel.textContent = tr('routine_complete');
      heroSub.textContent = previewTomorrow() || tr('see_you_tomorrow');
    }
    minutesLeftEl.innerHTML = '';
    segmentsEl.innerHTML = '';
    return;
  }

  if(awaitingStart){
    browseControlsEl.style.display = 'none';
    const t = tasks[pointer];
    heroEl.classList.remove('done');
    heroEmoji.textContent = t.emoji;
    heroLabel.textContent = t.name;
    heroSub.textContent = tr('ready_to_start');
    minutesLeftEl.innerHTML = '';
    segmentsEl.innerHTML = '';
    finishEarlyBtn.style.display = 'none';
    startNextBtn.style.display = 'inline-block';
    startNextBtn.textContent = tr('start_task', { task: t.name });
    return;
  }
  finishEarlyBtn.style.display = 'inline-block';
  startNextBtn.style.display = 'none';

  // Actual gap between different routines (e.g. end of Morning until Lunch
  // starts). Right after finishing, it keeps showing the "done" screen for
  // a while (so the child sees what they finished) instead of jumping straight
  // to the countdown — only shows the countdown when the next one is close
  // (30min or less) AND at least 15min have passed since the end.
  if(nowMin < tasks[pointer].startMin){
    const minutesSinceLastDone = pointer > 0 ? (nowMin - tasks[pointer-1].endMin) : 999;
    const minutesUntilNext = tasks[pointer].startMin - nowMin;
    const showCountdown = (minutesSinceLastDone >= 15) && (minutesUntilNext <= 30);

    // Safety net: at 15min or less from the actual time, force back to live
    // mode, even if manually browsing another page — ensures nobody misses
    // the time because they were wandering around.
    if(minutesUntilNext <= 15){ browseDay = null; browseTaskIdx = null; }

    finishEarlyBtn.style.display = 'none';
    segmentsEl.innerHTML = '';

    browseControlsEl.style.display = 'flex';
    browsePrevBtn.disabled = (browseDay === null) ? (pointer === 0) : false;
    browseNextBtn.disabled = false; // can always try moving forward (skips to the next days with a routine)
    if(browseDay !== null){ renderBrowsedTask(); return; }

    if(showCountdown){
      heroEl.classList.remove('done');
      heroEmoji.textContent = '⏳';
      heroLabel.textContent = tr('next_label', { task: tasks[pointer].name });
      heroSub.textContent = tr('starts_at', { time: fmtMin(tasks[pointer].startMin) });
      minutesLeftEl.innerHTML = Math.ceil(minutesUntilNext) + '<span class="unit">min</span>';
    } else {
      heroEl.classList.add('done');
      heroEmoji.textContent = '🎉';
      heroLabel.textContent = tr('all_good');
      heroSub.textContent = tr('next_at', { task: tasks[pointer].name, time: fmtMin(tasks[pointer].startMin) });
      minutesLeftEl.innerHTML = '';
    }
    return;
  }

  // Confirmation dialog when the current task's time runs out
  if(!confirmState && nowMin >= tasks[pointer].endMin){
    openConfirm();
  }
  if(confirmState){
    if(Date.now() >= confirmState.deadline){
      resolveConfirm('sim'); // no answer within 10s -> assume completed
      return;
    }
    const msLeft = Math.max(0, confirmState.deadline - Date.now());
    const secLeft = Math.ceil(msLeft/1000);
    confirmSecondsEl.textContent = secLeft;
    confirmTimerBar.style.width = (msLeft/CONFIRM_MS*100) + '%';
    if(secLeft <= 3){
      confirmCardEl.classList.add('urgent');
      if(secLeft !== lastTickSecond){ beep(700, 0.12, 0); lastTickSecond = secLeft; }
    }
  }

  const t = tasks[pointer];
  heroEl.classList.remove('done');
  heroEmoji.textContent = t.emoji;
  heroLabel.textContent = t.name;
  heroSub.textContent = confirmState ? tr('confirming') : tr('until', { time: fmtMin(t.endMin) });

  const total = t.endMin - t.startMin;
  const elapsed = confirmState ? total : Math.max(0, nowMin - t.startMin);
  const remain = Math.max(0, total - elapsed);
  minutesLeftEl.innerHTML = confirmState ? '' : (Math.ceil(remain) + '<span class="unit">min</span>');

  if(lastSegTaskIndex !== pointer){
    buildSegments(total, t.redMin);
    lastSegTaskIndex = pointer;
  }
  updateSegments(elapsed);
}

// ---------- In-app alert/confirm ----------
// TV browsers (e.g. on Google TV) may block native alert()/confirm() popups,
// and a blocked confirm() silently returns false — so use our own dialog.
let appDialogResolve = null;
function openAppDialog(message, yesLabel, noLabel){
  if(appDialogResolve) appDialogResolve(false); // a newer dialog replaces an unanswered one
  document.getElementById('app-dialog-message').textContent = message;
  const yesBtn = document.getElementById('app-dialog-yes');
  const noBtn = document.getElementById('app-dialog-no');
  yesBtn.textContent = yesLabel;
  noBtn.textContent = noLabel || '';
  noBtn.style.display = noLabel ? '' : 'none';
  document.getElementById('app-dialog-overlay').style.display = 'flex';
  // Focus the safe choice, so an accidental remote "OK" press doesn't confirm.
  (noLabel ? noBtn : yesBtn).focus();
  return new Promise(resolve => { appDialogResolve = resolve; });
}
function closeAppDialog(answer){
  document.getElementById('app-dialog-overlay').style.display = 'none';
  const resolve = appDialogResolve;
  appDialogResolve = null;
  if(resolve) resolve(answer);
}
function appAlert(message){ return openAppDialog(message, tr('ok'), null); }
function appConfirm(message, yesLabel){ return openAppDialog(message, yesLabel || tr('yes'), tr('cancel')); }
document.getElementById('app-dialog-yes').addEventListener('click', () => closeAppDialog(true));
document.getElementById('app-dialog-no').addEventListener('click', () => closeAppDialog(false));
document.addEventListener('keydown', (e) => {
  if(appDialogResolve && (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack')){
    e.preventDefault();
    closeAppDialog(false);
  }
});

// ---------- Weekly table (day x routine) ----------
// Detect actual time overlap between different routines checked on the
// same day. Returns { byDay: {0:[{routineName,...}], ...}, messages: [text,...] }
function findScheduleConflicts(){
  const byDay = {};
  const messages = [];
  for(let d=0; d<7; d++){
    const ids = draftWeekSchedule[d] || [];
    if(ids.length < 2) continue;
    let combined = [];
    draftRoutines.forEach(r => {
      if(ids.includes(r.id)){
        r.tasks.forEach(t => combined.push({
          routineId: r.id,
          routineName: r.name,
          start: toMinutes(hhmmToArr(t.start)),
          end: toMinutes(hhmmToArr(t.end))
        }));
      }
    });
    combined.sort((a,b) => a.start - b.start);
    const conflictingIds = new Set();
    for(let i=1; i<combined.length; i++){
      if(combined[i].start < combined[i-1].end && combined[i].routineId !== combined[i-1].routineId){
        conflictingIds.add(combined[i].routineId);
        conflictingIds.add(combined[i-1].routineId);
        messages.push(tr('overlap_item', { day: DAY_NAMES[d], a: combined[i-1].routineName, b: combined[i].routineName }));
      }
    }
    if(conflictingIds.size > 0) byDay[d] = conflictingIds;
  }
  return { byDay, messages };
}

function renderWeekMatrix(){
  const conflicts = findScheduleConflicts();
  const thead = document.querySelector('#week-matrix thead');
  const tbody = document.querySelector('#week-matrix tbody');
  thead.innerHTML = '<tr><th></th>' + DAY_NAMES.map((d,i) => `<th class="${conflicts.byDay[i]?'day-conflict':''}">${d}</th>`).join('') + '<th></th></tr>';
  tbody.innerHTML = draftRoutines.map(r => `
    <tr>
      <td><span class="matrix-routine-label">${r.icon} ${r.name}</span></td>
      ${DAY_NAMES.map((_, d) => {
        const checked = (draftWeekSchedule[d]||[]).includes(r.id);
        const isConflict = checked && conflicts.byDay[d] && conflicts.byDay[d].has(r.id);
        return `<td class="${isConflict?'day-conflict':''}"><input type="checkbox" class="${isConflict?'conflict-checkbox':''}" data-day="${d}" data-rid="${r.id}" ${checked ? 'checked' : ''}></td>`;
      }).join('')}
      <td><button type="button" class="apply-all-days-btn" data-rid="${r.id}">${tr('all_days_btn')}</button></td>
    </tr>
  `).join('');

  const warningEl = document.getElementById('conflict-warning');
  if(conflicts.messages.length > 0){
    warningEl.innerHTML = tr('overlap_heading') + '<br>' + conflicts.messages.join('<br>');
    warningEl.classList.add('show');
  } else {
    warningEl.classList.remove('show');
  }
}

// Adjust a task's time (start/end) by the chosen increment.
// When changing a task's END and auto-chaining is on, push the next task's
// START (and end, keeping its duration) along with it, so there's never
// a gap between them.
function adjustDraftTime(index, field, dir){
  const t = draftTasks[index];
  let totalMin = toMinutes(hhmmToArr(t[field])) + (dir * timeStepMin);
  totalMin = ((totalMin % 1440) + 1440) % 1440;
  t[field] = arrToHHMM([Math.floor(totalMin/60), totalMin%60]);

  if(field === 'end' && autoLinkNext && index < draftTasks.length - 1){
    const next = draftTasks[index+1];
    const nextDuration = toMinutes(hhmmToArr(next.end)) - toMinutes(hhmmToArr(next.start));
    const newNextStart = totalMin;
    const newNextEnd = newNextStart + nextDuration;
    next.start = arrToHHMM([Math.floor(newNextStart/60)%24, newNextStart%60]);
    next.end = arrToHHMM([Math.floor(newNextEnd/60)%24, newNextEnd%60]);
  }
  renderSettingsRows();
}

// After reordering, recompute times in a chain: each task keeps its own
// duration, but now starts exactly where the previous one ends, in the new
// order — the first task in the list keeps its original
// start time.
function recalculateDraftTaskTimes(){
  if(draftTasks.length === 0) return;
  let cursor = toMinutes(hhmmToArr(draftTasks[0].start));
  draftTasks.forEach(t => {
    const duration = toMinutes(hhmmToArr(t.end)) - toMinutes(hhmmToArr(t.start));
    t.start = arrToHHMM([Math.floor(cursor/60)%24, cursor%60]);
    cursor += duration;
    t.end = arrToHHMM([Math.floor(cursor/60)%24, cursor%60]);
  });
}

document.getElementById('settings-save').addEventListener('click', () => {
  // Validate all routines (not only the one currently shown)
  for(const r of draftRoutines){
    for(const t of r.tasks){
      if(!t.name || !t.name.trim()){
        appAlert(tr('task_needs_name', { routine: r.name }));
        return;
      }
      const s = toMinutes(hhmmToArr(t.start));
      const e = toMinutes(hhmmToArr(t.end));
      if(e <= s){
        appAlert(tr('task_end_after_start', { task: t.name, routine: r.name }));
        return;
      }

  }

  // Actual time overlap between different routines checked on the same day
  // (same check already shown live in the table — this is the final safeguard)
  const conflictCheck = findScheduleConflicts();

    const msg = tr('overlap_confirm', { list: conflictCheck.messages.join('\n') });

// ---------- Cloud sync (pairing by code, one anonymous identity per device) ----------
// All paired devices (TV, phones) share one "house" in a Firebase Realtime
// Database. Each device signs in anonymously through the Firebase Auth REST
// API (no accounts, e-mails or passwords), and the database rules only let
// devices listed in houses/<id>/members read or write that house, so removing
// a device from the list cuts its access for real (see database.rules.json).
// A short-lived 6-digit pair code lets a new device add itself as a member.
// Every save uploads the whole config to houses/<id>/data; the last save wins.
const CLOUD_DB_URL = 'https://rotina-infantil-7dc80-default-rtdb.firebaseio.com'; // empty = cloud sync off
const FIREBASE_API_KEY = 'AIzaSyBLKN1Tc425FYJt9-opD2DO6XUDu_4y5HY'; // public by design; access is enforced by the database rules
const AUTH_SIGNUP_URL = 'https://identitytoolkit.googleapis.com/v1/accounts:signUp';
const AUTH_REFRESH_URL = 'https://securetoken.googleapis.com/v1/token';
const HOUSE_ID_KEY = 'rotinaHouseId_v2';
const LEGACY_HOUSE_ID_KEY = 'rotinaHouseId_v1'; // pairing from before per-device identities; must pair again
const HOUSE_REV_KEY = 'rotinaHouseRev_v2'; // revision of the config this device last applied or sent
const AUTH_KEY = 'rotinaAuth_v1';          // { uid, refreshToken } of this device's anonymous identity
const DEVICE_NAME_KEY = 'rotinaDeviceName_v1';
const PAIR_CODE_TTL_MS = 10 * 60 * 1000;
const TOKEN_MARGIN_MS = 60 * 1000;         // refresh the ID token this long before it expires
const LAST_SEEN_INTERVAL_MS = 60 * 60 * 1000;
const ALNUM = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

function cloudEnabled(){ return !!(CLOUD_DB_URL && FIREBASE_API_KEY); }
function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lsSet(key, value){
  try{
    if(value === null) localStorage.removeItem(key);
    else localStorage.setItem(key, value);
  }catch(e){}
}
function randomId(len, alphabet){
  const bytes = new Uint8Array(len);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => alphabet[b % alphabet.length]).join('');
}
function getHouseId(){ return lsGet(HOUSE_ID_KEY); }

// ---- Anonymous device identity (Firebase Auth REST API) ----
let idToken = null;
let idTokenExpiresAt = 0;
let tokenPromise = null;
function loadAuth(){
  try{ return JSON.parse(lsGet(AUTH_KEY)) || null; }catch(e){ return null; }
}
function getUid(){
  const auth = loadAuth();
  return auth ? auth.uid : null;
}
function fetchJson(url, options){
  return fetch(url, options).then(r => r.json().then(body => {
    if(!r.ok){
      const err = new Error('HTTP ' + r.status);
      err.status = r.status;
      err.code = (body && body.error && (body.error.message || body.error)) || '';
      throw err;
    }
    return body;
  }));
}
function getIdToken(force){
  if(!force && idToken && Date.now() < idTokenExpiresAt - TOKEN_MARGIN_MS) return Promise.resolve(idToken);
  if(tokenPromise) return tokenPromise;
  const auth = loadAuth();
  const request = (auth && auth.refreshToken)
    ? fetchJson(`${AUTH_REFRESH_URL}?key=${FIREBASE_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(auth.refreshToken)
      }).then(j => ({ uid: j.user_id, idToken: j.id_token, refreshToken: j.refresh_token, expiresIn: j.expires_in }),
        err => {
          // The identity itself is gone (e.g. deleted in the console): start over with a new
          // one; the database will then treat this device as no longer being a member.
          // Only when Google says the identity itself is gone. Other 400s (bad key,
          // quota, transient errors) keep it, so a glitch never costs the pairing.
          if(['TOKEN_EXPIRED', 'USER_DISABLED', 'USER_NOT_FOUND', 'INVALID_REFRESH_TOKEN'].includes(String(err.code))){
            logCloudEvent(tr('log_identity_lost', { code: err.code }));
            lsSet(AUTH_KEY, null);
          } else {
            logCloudEvent(tr('log_refresh_failed', { info: `${err.status || 'network'} ${err.code || ''}`.trim() }));
          }
          throw err;
        })
    : fetchJson(`${AUTH_SIGNUP_URL}?key=${FIREBASE_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ returnSecureToken: true })
      }).then(j => ({ uid: j.localId, idToken: j.idToken, refreshToken: j.refreshToken, expiresIn: j.expiresIn }));
  tokenPromise = request.then(t => {
    if(!auth || auth.uid !== t.uid) logCloudEvent(tr('log_new_identity', { id: String(t.uid).slice(0, 6) }));
    lsSet(AUTH_KEY, JSON.stringify({ uid: t.uid, refreshToken: t.refreshToken }));
    idToken = t.idToken;
    idTokenExpiresAt = Date.now() + Number(t.expiresIn) * 1000;
    tokenPromise = null;
    return idToken;
  }, err => { tokenPromise = null; throw err; });
  return tokenPromise;
}

function dbUrl(path, token){
  return `${CLOUD_DB_URL.replace(/\/+$/, '')}/${path}.json?auth=${encodeURIComponent(token)}`;
}
// Database REST call as this device. A 401 is retried once with a fresh token
// (it may just have expired); a second 401 means the rules deny access.
function cloudFetch(path, options, retried){
  return getIdToken(retried).then(token => fetch(dbUrl(path, token), Object.assign({ cache: 'no-store' }, options)))
    .then(r => {
      if(r.status === 401 && !retried) return cloudFetch(path, options, true);
      if(!r.ok){ const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }
      return r.json();
    });
}

// Apply a house record received from the cloud. The config is applied unless
// it's the revision this device already has; if the settings screen is open
// with unsaved edits, it's deferred so they aren't wiped (closeSettings

let pendingRemoteHouse = null;
let knownMemberIds = null;
function handleRemoteHouse(house){

}
function announceNewMembers(members){

// The database refused this device. That normally means another device removed
// it, but a transient glitch must never cost the pairing, so it only counts
// after a second refusal at least 15s later.
let removalSuspectAt = 0;
function suspectRemoved(source){
  if(!getHouseId()) return;
  const now = Date.now();
  if(removalSuspectAt && now - removalSuspectAt >= 15000){
    removalSuspectAt = 0;
    handleRemovedFromHouse(source);
    return;
  }
  if(!removalSuspectAt){
    removalSuspectAt = now;
    logCloudEvent(tr('log_refused', { source }));
  }
  setTimeout(refreshFromCloud, 20000);
}

// Another device removed this one from the group (or it was paired before
// per-device identities existed): stop syncing, but keep the local routine.
function handleRemovedFromHouse(source){
  if(!getHouseId()) return;
  logCloudEvent(tr('log_removed', { source: source || '?', id: String(getUid()).slice(0, 6) }));
  stopHouseSync();
  hidePairCode();
  lsSet(HOUSE_ID_KEY, null);
  lsSet(HOUSE_REV_KEY, null);
  knownMemberIds = null;
  updateCloudStatus();
  setCloudStatus(tr('cloud_removed'));
}

// Only one read in flight at a time: if a slower, older response arrived
// after a newer one, it would re-apply stale data. A refresh requested while
// one is running just schedules one more read right after it.
let refreshInFlight = null;
let refreshAgain = false;
function refreshFromCloud(){
  const houseId = getHouseId();
  if(!cloudEnabled() || !houseId) return Promise.resolve();
  if(refreshInFlight){ refreshAgain = true; return refreshInFlight; }
  refreshInFlight = cloudFetch(`houses/${houseId}`)
    .then(house => {
      if(getHouseId() !== houseId) return;
      if(removalSuspectAt){ removalSuspectAt = 0; logCloudEvent(tr('log_recovered')); }
      handleRemoteHouse(house);
    })
    .catch(err => { if(err.status === 401 && getHouseId() === houseId) suspectRemoved(tr('source_read')); })
    .then(() => {
      refreshInFlight = null;
      if(refreshAgain){ refreshAgain = false; return refreshFromCloud(); }
    });
  return refreshInFlight;
}

function touchLastSeen(){

  const uid = getUid();

// Live updates via the database's streaming REST API (Server-Sent Events).
// Any change notification just triggers a full re-read — simpler than
// applying partial patches. The stream carries the ID token, so it's
// reopened before the token expires.
let houseStream = null;
let streamRestartTimer = null;
function stopHouseSync(){
  if(houseStream){ houseStream.close(); houseStream = null; }
  if(streamRestartTimer){ clearTimeout(streamRestartTimer); streamRestartTimer = null; }
}
function startHouseSync(){
  stopHouseSync();
  const houseId = getHouseId();
  if(!cloudEnabled() || !houseId) return;
  refreshFromCloud();
  if(!window.EventSource) return;
  getIdToken().then(token => {
    if(getHouseId() !== houseId || houseStream) return;
    const stream = new EventSource(dbUrl(`houses/${houseId}`, token));
    houseStream = stream;
    const restartSoon = () => {
      if(houseStream !== stream) return;
      stopHouseSync();
      streamRestartTimer = setTimeout(startHouseSync, 5000);
    };
    ['put', 'patch'].forEach(ev => stream.addEventListener(ev, () => refreshFromCloud()));
    // Token expired or access revoked: reopen with a fresh token (or find out this device was removed).
    ['auth_revoked', 'cancel'].forEach(ev => stream.addEventListener(ev, restartSoon));
    // The browser gave up on the stream for good (e.g. its reconnect hit an expired token).
    stream.addEventListener('error', () => { if(stream.readyState === 2) restartSoon(); });
    streamRestartTimer = setTimeout(startHouseSync, Math.max(60 * 1000, idTokenExpiresAt - Date.now() - TOKEN_MARGIN_MS));
  }).catch(() => {});
}

// Make sure this device belongs to a house (creating one with the current
// config if needed), so other devices can join it.
function ensureHouse(){
  const existing = getHouseId();
  if(existing) return Promise.resolve(existing);
  const houseId = randomId(24, ALNUM);
  return getIdToken()
    .then(() => cloudFetch(`houses/${houseId}/members/${getUid()}`, { method: 'PUT', body: JSON.stringify(newMemberRecord()) }))
    .then(() => {
      lsSet(HOUSE_ID_KEY, houseId);
      logCloudEvent(tr('log_group_created'));
      return pushConfigToCloud(getCurrentConfigObject());
    })
    .then(ok => {
      if(!ok){ lsSet(HOUSE_ID_KEY, null); throw new Error('push failed'); }
      startHouseSync();
      return houseId;
    });
}

// The database rules refuse to overwrite a code that is still valid, so a
// collision just means trying another random code.
function createPairCode(houseId, attempt){
  const code = randomId(6, '0123456789');
  const body = JSON.stringify({ houseId, expiresAt: Date.now() + PAIR_CODE_TTL_MS });
  return cloudFetch(`pairCodes/${code}`, { method: 'PUT', body })
    .then(() => code)
    .catch(err => {
      if((attempt || 0) < 3) return createPairCode(houseId, (attempt || 0) + 1);
      throw err;
    });
}

function formatClock(ms){
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function formatLastSeen(ms){
  if(!ms) return tr('seen_never');
  const diffMin = Math.floor((Date.now() - ms) / 60000);
  if(diffMin < 2) return tr('seen_now');
  if(diffMin < 60) return tr('seen_min', { n: diffMin });
  const d = new Date(ms);
  const today = new Date(); today.setHours(0,0,0,0);
  const dayDiff = Math.round((today - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  if(dayDiff === 0) return tr('seen_today', { time: formatClock(ms) });
  if(dayDiff === 1) return tr('seen_yesterday', { time: formatClock(ms) });
  return tr('seen_date', { date: `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}` });
}
