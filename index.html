// Now that everything (DOM, functions, settings screen) exists, build the
// actual routine from the configuration saved in this browser (or the
// default, if it's the first time).
// ---------- Full screen and "keep the screen on" (display devices) ----------
(function setUpDisplayHelpers(){
  const isPhone = guessDeviceKind() === 'phone';
  const root = document.documentElement;
  const request = root.requestFullscreen || root.webkitRequestFullscreen;
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  const current = () => document.fullscreenElement || document.webkitFullscreenElement;
  const fsBtn = document.getElementById('fullscreen-btn');
  if(request && !isPhone && (document.fullscreenEnabled || document.webkitFullscreenEnabled)){
    fsBtn.style.display = '';
    const label = () => { fsBtn.textContent = tr(current() ? 'fullscreen_exit' : 'fullscreen_btn'); };
    fsBtn.addEventListener('click', () => {
      try{
        const r = current() ? exit.call(document) : request.call(root);
        if(r && r.catch) r.catch(() => {});
      }catch(e){}
    });
    document.addEventListener('fullscreenchange', label);
    document.addEventListener('webkitfullscreenchange', label);
  }

  // Ask the screen to stay on while the app is visible. The lock is dropped
  // whenever the page is hidden, so ask again when it comes back.
  if(isPhone || !('wakeLock' in navigator)) return;
  let lock = null;
  const keepAwake = () => {
    if(lock || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen')
      .then(l => { lock = l; l.addEventListener('release', () => { lock = null; }); })
      .catch(() => {});
  };
  keepAwake();
  document.addEventListener('visibilitychange', keepAwake);
  // Some browsers only grant it after an interaction.
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, keepAwake, { passive: true }));
})();

// ---------- One day per child ----------
// The schedule engine keeps the day it is working on in the globals above
// (tasks, pointer, awaitingStart, ...) and draws it into the elements above
// (heroEl, timelineEl, ...). Each child has a slot with its own copy of both;
// withChild(slot, fn) swaps that child's day and elements in, runs fn and
// swaps back. Between calls the globals hold the first child's day, so with
// one child nothing is ever swapped and the engine works as it always did.
const MAIN_VIEW = { heroEl, heroEmoji, heroLabel, heroSub, minutesLeftEl, segmentsEl, finishEarlyBtn, startNextBtn, skipBtn, postponeBtn, forecastEl,
  browseControlsEl, browsePrevBtn, browseNextBtn, timelineEl, pageTitleEl, limitHourEl, limitMinEl, limitControlEl, panelEl: null };
function useView(v){
  ({ heroEl, heroEmoji, heroLabel, heroSub, minutesLeftEl, segmentsEl, finishEarlyBtn, startNextBtn, skipBtn, postponeBtn, forecastEl,
     browseControlsEl, browsePrevBtn, browseNextBtn, timelineEl, pageTitleEl, limitHourEl, limitMinEl, limitControlEl, panelEl } = v);
}
function freshDay(){
  return { TASKS: [], loadedDayIndex: new Date().getDay(), tasks: [], PLANNED: [], dayStartMin: 0, limitMin: 0, pointer: 0,
    currentLimitRoutineId: undefined, awaitingStart: false, lastSegTaskIndex: -1, confirmState: null, lastTickSecond: null,
    scheduleDate: null, testMode: false, runningTestStart: null, progressSeq: 0, progressPublishTimer: null, lastDayStateJson: '',
    browseDay: null, browseRoutineIdx: null, timelinePreviewKey: null };
}
function saveDay(slot){
  slot.day = { TASKS, loadedDayIndex, tasks, PLANNED, dayStartMin, limitMin, pointer, currentLimitRoutineId, awaitingStart,
    lastSegTaskIndex, confirmState, lastTickSecond, scheduleDate, testMode, runningTestStart, progressSeq, progressPublishTimer,
    lastDayStateJson, browseDay, browseRoutineIdx, timelinePreviewKey };
}
function loadDay(slot){
  ({ TASKS, loadedDayIndex, tasks, PLANNED, dayStartMin, limitMin, pointer, currentLimitRoutineId, awaitingStart,
     lastSegTaskIndex, confirmState, lastTickSecond, scheduleDate, testMode, runningTestStart, progressSeq, progressPublishTimer,
     lastDayStateJson, browseDay, browseRoutineIdx, timelinePreviewKey } = slot.day);
  ACTIVE_CHILD_ID = slot.id;
  const child = CHILDREN.find(c => c.id === slot.id);
  CHILD_NAME = child ? child.name : '';
  useView(slot.view || MAIN_VIEW);
}
let SLOTS = [];
let currentSlot = null;
function slotById(id){ return SLOTS.find(s => s.id === id) || null; }
function withChild(slot, fn){
  if(!slot || slot === currentSlot) return fn(currentSlot);
  const prev = currentSlot;
  saveDay(prev);
  loadDay(slot);
  currentSlot = slot;
  try{ return fn(slot); }
  finally{
    saveDay(slot);
    loadDay(prev);
    currentSlot = prev;
  }
}
function forEachChild(fn){ SLOTS.slice().forEach(slot => withChild(slot, fn)); }
// One slot per shown child (kept for children that stay), first child loaded.
// A hidden child has no slot: no column, sounds or questions; its day comes
// back from the saved copy when it is shown again.
function syncSlots(){
  if(currentSlot) saveDay(currentSlot);
  SLOTS = visibleChildren().map(c => slotById(c.id) || { id: c.id, day: freshDay(), view: null });
  currentSlot = SLOTS[0];
  loadDay(currentSlot);
}
// ---------- Several children on one screen ----------
// With two or more children the main screen is hidden and each child gets a
// column (#kids-grid) with its own set of the engine's elements. Its buttons
// act on that child's day. With one child the main screen is used as before.
const kidsGrid = document.getElementById('kids-grid');
function fitPanels(){
  const portrait = window.innerHeight > window.innerWidth;
  kidsGrid.querySelectorAll('.kid-panel').forEach(p => {
    const w = portrait ? Math.min(p.clientWidth, 640) : Math.min(p.clientWidth, p.clientHeight * 0.95);
    p.style.setProperty('--w', Math.max(200, w) + 'px');
  });
}
// Heights change when the web font arrives or the screen size changes:
// scroll the columns' lists to the current task again.
function rescrollPanels(){ kidsGrid.querySelectorAll('.kid-timeline').forEach(t => { delete t.dataset.scrolledTo; }); }
window.addEventListener('resize', fitPanels);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(rescrollPanels);
function buildPanels(){
  const multi = SLOTS.length > 1;
  document.body.classList.toggle('multi', multi);
  const solo = !multi && CHILDREN.find(c => SLOTS[0] && c.id === SLOTS[0].id);
  document.documentElement.classList.toggle('solo', !!solo);
  document.documentElement.style.setProperty('--c', solo ? `var(--${solo.color || 'sky'})` : '');
  kidsGrid.innerHTML = '';
  SLOTS.forEach(slot => { slot.view = null; });
  if(!multi) return;
  document.getElementById('page-title').textContent = `🌞 ${APP_NAME}`;
  kidsGrid.style.setProperty('--n', SLOTS.length);
  SLOTS.forEach(slot => {
    const child = CHILDREN.find(c => c.id === slot.id) || {};
    const panel = document.createElement('section');
    panel.className = 'kid-panel' + (child.color === 'sun' ? ' light-color' : '');
    panel.dataset.child = slot.id;
    panel.style.setProperty('--c', `var(--${child.color || 'sky'})`);
    panel.innerHTML = `
      <div class="kid-head"><span class="kid-avatar"></span><span class="kid-name"></span>
        <span class="kid-deadline"><span class="kid-forecast"></span><span hidden><span class="kid-limit-h"></span><span class="kid-limit-m"></span></span></span></div>
      <div class="kid-hero">
        <div class="kid-emoji">⏰</div>
        <div class="kid-info">
          <div class="kid-label"></div>
          <div class="kid-sub"></div>
          <div class="kid-row">
            <div class="kid-minutes"></div>
            <button type="button" class="kid-finish"><span class="kid-box"></span><span class="kid-finish-label"></span></button>
          </div>
          <button type="button" class="kid-start"></button>
          <div class="task-extra-btns"><button type="button" class="kid-postpone"></button><button type="button" class="kid-skip"></button></div>
          <div class="kid-browse">
            <button type="button" class="kid-prev">◀</button>
            <button type="button" class="kid-next">▶</button>
          </div>
        </div>
        <div class="kid-segments"></div>
      </div>
      <div class="kid-timeline"></div>`;
    const q = sel => panel.querySelector(sel);
    q('.kid-avatar').textContent = child.icon || '';
    q('.kid-name').textContent = child.name || '';
    q('.kid-finish').title = tr('finish_early');
    q('.kid-finish').setAttribute('aria-label', tr('finish_early'));
    q('.kid-finish-label').textContent = tr('finish_short');
    const act = fn => () => { if(SLOTS.includes(slot)) withChild(slot, fn); };
    // Tick the box first, so the child sees it marked, then close the task.
    const finishBtn = q('.kid-finish');
    finishBtn.addEventListener('click', () => {
      if(finishBtn.classList.contains('checked')) return;
      finishBtn.classList.add('checked');
      setTimeout(() => { finishBtn.classList.remove('checked'); act(finishEarly)(); }, 600);
    });
    q('.kid-start').addEventListener('click', act(startNextTask));
    q('.kid-skip').addEventListener('click', act(() => askSkip(pointer)));
    q('.kid-postpone').addEventListener('click', act(() => { postponeTask(); progressAction(); render(); }));
    q('.kid-timeline').addEventListener('click', (e) => {
      const btn = e.target.closest('.skip-btn');
      if(btn) act(() => onStepSkip(parseInt(btn.dataset.index, 10)))();
    });
    q('.kid-prev').title = tr('browse_prev_title');
    q('.kid-next').title = tr('browse_next_title');
    q('.kid-prev').addEventListener('click', act(browsePrev));
    q('.kid-next').addEventListener('click', act(browseNext));
    slot.view = {
      heroEl: q('.kid-hero'), heroEmoji: q('.kid-emoji'), heroLabel: q('.kid-label'), heroSub: q('.kid-sub'),
      minutesLeftEl: q('.kid-minutes'), segmentsEl: q('.kid-segments'), finishEarlyBtn: q('.kid-finish'), startNextBtn: q('.kid-start'),
      skipBtn: q('.kid-skip'), postponeBtn: q('.kid-postpone'), forecastEl: q('.kid-forecast'),
      browseControlsEl: q('.kid-browse'), browsePrevBtn: q('.kid-prev'), browseNextBtn: q('.kid-next'),
      pageTitleEl: document.createElement('div'), // no title per column: stays off screen
      timelineEl: q('.kid-timeline'), limitHourEl: q('.kid-limit-h'), limitMinEl: q('.kid-limit-m'), limitControlEl: q('.kid-deadline'),
      panelEl: panel
    };
    kidsGrid.appendChild(panel);
  });
  fitPanels();
}
// Rebuilds every child's day from the config (keeping today's progress).
function initAllChildren(opts){
  syncSlots();
  buildPanels();
  useView(currentSlot.view || MAIN_VIEW);
  forEachChild(() => {
    loadedDayIndex = new Date().getDay();
    TASKS = buildTodaysTasks();
    initSchedule(TASKS, opts);
    render(); // draw right away (new columns would otherwise stay empty until the next tick)
  });
}

initAllChildren();
maybeShowWelcome();
updateSoundPrompt();
// On a TV, put the remote's focus on the balloon, so pressing OK turns the sound on.
if(soundPromptWanted() && guessDeviceKind() === 'tv' && document.getElementById('welcome-overlay').style.display !== 'flex'){
  document.getElementById('sound-prompt-btn').focus({ preventScroll: true });
}
initCloudSync();

function safeRender(){
  try{ renderAll(); }catch(e){ /* never let the loop hang because of a one-off error */ }
  try{ forEachChild(saveDayState); }catch(e){}
}
safeRender();
setInterval(safeRender, 1000);
</script>
</body>
</html>
